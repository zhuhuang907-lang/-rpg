<title>历史模拟RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" media="print" onload="this.media='all'"><!-- 字体连不上（国内常见）也不挡页面：先用本机字体显示，字体到了再换上 -->
<style>
/* 版式：左边是和 GM 的对话（像聊天一样一来一往），右边是账册：局面、人物、家业、史线、地理、年谱。
   配色取「竹纸 + 墨 + 石青 + 朱印」：纸色偏青灰，石青作主色，朱色只用在印章与要紧处。 */
:root{
  --paper:#eef0ea; --sheet:#f8f9f5; --ink:#1d2421; --ink2:#4a524e; --mute:#7c847f; --rule:#d5dad2;
  --qing:#2c5f7c; --qing-soft:#dde8ee; --zhu:#b5372a; --zhu-soft:#f5e2de; --ochre:#9a7b2f; --ochre-soft:#f3ecd9;
  --good:#3d7a55; --good-soft:#e2efe6; --shadow:0 1px 2px rgba(20,30,28,.06),0 4px 14px rgba(20,30,28,.05);
  --f-title:"Ma Shan Zheng","Noto Serif SC","Songti SC",serif;
  --f-read:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-ui:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#131819; --sheet:#1b2224; --ink:#e4e8e3; --ink2:#b9c1bc; --mute:#86908b; --rule:#2e3739;
  --qing:#86b6d4; --qing-soft:#1f3340; --zhu:#e2725f; --zhu-soft:#3a2420; --ochre:#d2b15e; --ochre-soft:#332b17;
  --good:#7cc195; --good-soft:#1c3125; --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131819; --sheet:#1b2224; --ink:#e4e8e3; --ink2:#b9c1bc; --mute:#86908b; --rule:#2e3739;
  --qing:#86b6d4; --qing-soft:#1f3340; --zhu:#e2725f; --zhu-soft:#3a2420; --ochre:#d2b15e; --ochre-soft:#332b17;
  --good:#7cc195; --good-soft:#1c3125; --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font:15px/1.7 var(--f-ui);padding-inline:16px;padding-block:0 24px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:6px 12px;transition:background .12s,border-color .12s}
button:hover:not(:disabled){border-color:var(--qing)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--qing);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.main{background:var(--qing);border-color:var(--qing);color:var(--sheet);font-weight:600}
button.link{border:none;background:none;padding:2px 4px;color:var(--qing);text-decoration:underline;text-underline-offset:3px}
input,select,textarea{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical}
.muted{color:var(--mute)}
.wrap{max-width:1280px;margin:0 auto}

.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;border-bottom:1px solid var(--rule);margin-bottom:14px}
.brand{font-family:var(--f-title);font-size:28px;line-height:1;letter-spacing:.04em}
.brand small{font-family:var(--f-ui);font-size:12px;color:var(--mute);margin-left:8px;letter-spacing:0}
.top .sp{flex:1}
.status{font-size:13px;color:var(--ink2);font-family:var(--f-read);min-width:0}
.status b{color:var(--ink)}

.h{display:flex;align-items:center;gap:10px;margin:18px 0 8px;font-family:var(--f-read);font-weight:700;font-size:16px;letter-spacing:.08em;flex-wrap:wrap}
.h .seal{display:inline-grid;place-items:center;width:23px;height:23px;border:1.5px solid var(--zhu);color:var(--zhu);border-radius:3px;font-family:var(--f-title);font-size:16px;letter-spacing:0;flex:none}
.h .note{font-family:var(--f-ui);font-weight:400;font-size:12px;color:var(--mute);letter-spacing:0}

.start{max-width:780px;margin:0 auto}
.hero{padding-block:18px 6px}
.hero h1{font-family:var(--f-title);font-weight:400;font-size:40px;margin:0 0 6px;text-wrap:balance}
.hero p{margin:0;color:var(--ink2);max-width:64ch}
.ask1{display:flex;gap:8px;margin-top:16px}
.ask1 input{font-size:17px;padding:12px 14px}
.ask1 button{white-space:nowrap;padding:0 22px;font-size:16px}
.examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border-radius:16px;padding:4px 12px;font-size:13px;background:var(--sheet);text-align:left}
.saves{display:grid;gap:8px}
.save{display:flex;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;flex-wrap:wrap}
.save .t{flex:1;min-width:0}
.save .t b{display:block;font-family:var(--f-read)}
.save .t span{font-size:12px;color:var(--mute)}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.howto div{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink2)}
.howto b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}

.game{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:22px;align-items:start}
.chat{display:flex;flex-direction:column;gap:14px;min-width:0}
.msg{min-width:0}
.msg.gm{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px 18px}
.msg.gm.talk{background:var(--qing-soft);border-color:var(--rule);border-color:color-mix(in srgb,var(--qing) 30%,transparent)}
.msg.me{align-self:flex-end;max-width:80%;background:var(--ink);color:var(--paper);border-radius:12px 12px 2px 12px;padding:9px 14px;white-space:pre-wrap}
.headln{font-family:var(--f-read);font-size:14px;color:var(--ink);margin:2px 0 8px;font-weight:600}
.delta{font-size:13px;color:var(--qing);background:var(--qing-soft);border-radius:6px;padding:3px 8px;margin:-4px 0 8px;display:inline-block}
.status .chg{color:var(--qing);font-weight:600}
.curst{font-size:13px;color:var(--mute);border-top:1px dashed var(--rule);margin-top:10px;padding-top:6px;line-height:1.6}
.fbrow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:6px;font-size:12px}.fbrow .chip{font-size:12px;padding:2px 8px}
.msg .lab{font-size:12px;color:var(--qing);margin-bottom:4px;font-family:var(--f-read);display:flex;gap:8px;flex-wrap:wrap}
.msg .lab .tag{color:var(--mute)}
.text{font-family:var(--f-read);font-size:17px;line-height:1.9;max-width:42em}
.text p{margin:0 0 .75em}.text p:last-child{margin-bottom:0}
.custom{margin-top:14px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);padding:8px 12px}
.custom summary{cursor:pointer;font-size:14px;color:var(--qing);font-weight:600}
.cform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;margin-top:10px}
.cform label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink2)}
.cform .wide{grid-column:1/-1}
.cform input,.cform select,.cform textarea{font-size:14px}
@media (max-width:520px){.cform{grid-template-columns:minmax(0,1fr)}}
.intro{border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;line-height:1.75}
.intro .ih{font-family:var(--f-read);font-weight:700;color:var(--qing);margin-bottom:2px}
.intro b{color:var(--ink);font-weight:600;margin-right:6px}
.goalbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:-4px}
.goal{border:1px solid var(--rule);border-color:color-mix(in srgb,var(--qing) 30%,transparent);background:var(--qing-soft);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--ink2);text-align:left;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal b{color:var(--qing);margin-right:6px;font-weight:600}
.ex.goal{background:var(--qing-soft)}
.ex.wide{grid-column:1/-1}
.book{margin-top:10px;font-size:13px}.book summary{cursor:pointer;color:var(--mute);list-style:none;padding:4px 0}.book summary::before{content:'▸ ';}.book[open] summary::before{content:'▾ '}
.book .extras{margin-top:6px}
.fs{display:inline-block;font-size:11px;color:var(--qing);border:1px solid var(--qing);border-color:color-mix(in srgb,var(--qing) 35%,transparent);border-radius:4px;padding:0 4px;margin-right:6px;line-height:1.5}
.ex.refs a{color:inherit}
.feed{margin-top:10px;font-size:13px;color:var(--ink2)}.feed .fh{color:var(--mute);font-size:12px;margin-bottom:4px}.feed .fi{animation:fadein .4s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.msg.talk .text{font-family:var(--f-ui);font-size:15px;line-height:1.85}
.text[contenteditable="true"]{outline:2px dashed var(--ochre);padding:6px;border-radius:6px}
.caret::after{content:"▍";color:var(--qing);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.thinking{display:block;color:var(--ink2);font-size:14px;white-space:normal}
.thinking .dots{vertical-align:middle;margin-right:10px}
.thinking .link{margin-left:8px}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--qing);animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion: reduce){.dots i,.caret::after{animation:none}}
.extras{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.ex{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;background:var(--paper);font-size:13.5px;min-width:0}
.ex .eh{font-family:var(--f-read);font-weight:700;color:var(--qing);letter-spacing:.08em;font-size:13px}
.ex .eh span{font-family:var(--f-ui);font-weight:400;color:var(--mute);font-size:11px;letter-spacing:0;margin-left:6px}
.ex div+div{margin-top:3px}
.ex.life{background:var(--good-soft)}
.ex.news{background:var(--ochre-soft)}
.msgacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.hints{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.earlier{font-size:13px;color:var(--mute);text-align:center}

.composer{position:sticky;bottom:0;background:var(--paper);padding-block:10px 4px;border-top:1px solid var(--rule)}
.composer textarea{font-size:15px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.row select{width:auto}
.row .grow{flex:1}
.savest{font-size:12px;color:var(--good)}.savest.bad{color:var(--zhu)}

.side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:10px 14px 14px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin:0 -4px 6px;padding-bottom:6px;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:4px 7px;font-size:14px;border-radius:6px;color:var(--ink2)}
.tabs button.on{background:var(--qing-soft);color:var(--qing);font-weight:600}
.who{font-family:var(--f-read)}
.who .n{font-size:20px;font-weight:700}
.who .r{color:var(--mute);font-size:13px}
.who .w{color:var(--qing);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:10px}
.tile{border:1px solid var(--rule);border-radius:8px;padding:6px 9px;background:var(--paper)}
.tile .k{font-size:12px;color:var(--mute)}
.tile .v{font-family:var(--f-read);font-size:15px;font-weight:600;word-break:break-all;font-variant-numeric:tabular-nums}
.tile .why{font-size:11px;color:var(--mute);line-height:1.4}
.up{color:var(--good);font-size:11px;margin-left:3px}.down{color:var(--zhu);font-size:11px;margin-left:3px}
.grp{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:5px}
.grp .gk{width:5.5em;flex:none}
.bar{flex:1;height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--qing)}
.bar i.bad{background:var(--zhu)}.bar i.warn{background:var(--ochre)}.bar i.good{background:var(--good)}
.grp .gw{color:var(--mute);white-space:nowrap;min-width:3em}
.list{font-size:13.5px}
.list > div{border-bottom:1px dotted var(--rule);padding:6px 0}
.list b{font-weight:600}
.list .when{color:var(--qing);margin-right:6px;font-family:var(--f-read)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0}
.kv dt{color:var(--mute)}.kv dd{margin:0;min-width:0}
.pcs{display:grid;gap:8px}
.pc{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--paper)}
.pc .pn{display:flex;justify-content:space-between;gap:6px;align-items:center}
.pc .pn b{font-family:var(--f-read);font-size:15px}
.att{font-size:11px;border:1px solid var(--rule);border-radius:10px;padding:0 6px;color:var(--qing);white-space:nowrap}
.pc .pr{color:var(--mute);font-size:12px}
.pc .pl span{color:var(--mute);margin-right:4px}
.abil{margin-left:6px;font-size:11px;border:1px solid var(--rule);border-radius:3px;padding:0 4px;color:var(--ochre)}
.badge{font-size:11px;padding:0 7px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.b-todo{color:var(--ochre);background:var(--ochre-soft)}.b-doing{color:var(--qing);background:var(--qing-soft)}
.b-bad{color:var(--zhu);background:var(--zhu-soft)}.b-done{color:var(--good);background:var(--good-soft)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--mute);font-weight:500;border-bottom:1px solid var(--rule);padding:4px 6px 4px 0}
.tbl td{border-bottom:1px dotted var(--rule);padding:5px 6px 5px 0;vertical-align:top}
.tblwrap{overflow-x:auto}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.spark{margin-top:8px}.spark svg{width:100%;height:56px;display:block}
.overview{font-family:var(--f-read);font-size:14px;line-height:1.85;white-space:pre-wrap}
.mine{color:var(--zhu)}
.banner{white-space:pre-wrap;background:var(--ochre-soft);border:1px solid var(--ochre);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.err{white-space:pre-wrap;background:var(--zhu-soft);border:1px solid var(--zhu);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}

.closeSide{display:none}
@media (max-width: 960px){
  .game{grid-template-columns:minmax(0,1fr)}
  /* 手机：正文在前；册子收成顶上一行标签，点开铺满全屏，看完收起回到正文 */
  .side{position:sticky;top:0;z-index:20;max-height:none;order:-1;padding:4px 8px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .side.fold .tabs{border-bottom:none;margin-bottom:0;padding-bottom:0}
  .side .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .side .tabs button{flex:none}
  .side.fold .pane{display:none}
  .side:not(.fold){position:fixed;inset:0;z-index:60;overflow:auto;border-radius:0;padding:8px 14px 40px;border:none}
  .side:not(.fold) .tabs{flex-wrap:wrap}
  .side:not(.fold) .closeSide{display:inline-block;margin-left:auto;font-weight:600;color:var(--qing)}
}
@media (max-width: 520px){
  .ask1{flex-direction:column}.ask1 button{padding:10px}
  .top{gap:6px 10px;padding-block:8px;margin-bottom:8px}.brand{font-size:22px}
  .top .status{order:3;flex-basis:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
  .msg.gm{padding:12px 14px}.text{font-size:16.5px;line-height:1.85}
  .composer textarea{font-size:16px;min-height:0}
  .extras{grid-template-columns:minmax(0,1fr)}
  .composer .savest{display:none}.composer label.muted{font-size:12px}
  .hero h1{font-size:32px}
  .msg.me{max-width:92%}
  .h .note{flex-basis:100%;margin-left:33px}
}
/* 捏脸 */
.facebox{display:flex;gap:12px;align-items:flex-start}
.facebox canvas{width:96px;height:114px;border-radius:8px;border:1px solid var(--rule);background:#f2ece1;flex:none}
.pc canvas.mini{width:46px;height:55px;border-radius:6px;border:1px solid var(--rule);float:right;margin:0 0 4px 8px;background:#f2ece1}
#faceModal{position:fixed;inset:0;z-index:90;background:rgba(45,38,30,.42);display:flex;align-items:center;justify-content:center;padding:14px}
#faceModal[hidden]{display:none}
#faceModal .fm{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;max-width:860px;width:100%;max-height:92vh;overflow:auto;padding:14px;display:flex;gap:16px;flex-wrap:wrap}
#faceModal .fm canvas{width:min(280px,100%);height:auto;aspect-ratio:480/680;border-radius:8px;border:1px solid var(--rule);background:#f2ece1}
#faceModal .fp{flex:1;min-width:260px}
#faceModal .ftabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
#faceModal .ftabs button{padding:4px 11px;border-radius:16px}
#faceModal .ftabs button.on{background:var(--qing);color:#fff;border-color:var(--qing)}
#faceModal .frow{display:grid;grid-template-columns:52px 1fr 34px;gap:8px;align-items:center;margin-bottom:8px;font-size:13px}
#faceModal .frow input[type=range]{width:100%}
#faceModal .fbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#faceModal .ftr{font-size:12px;color:var(--mute);margin-top:8px}
  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:6px 0}
  .ccard{border:1px solid var(--line,#ddd);border-radius:6px;padding:8px;background:var(--card,#fffdf8)}
  .ccard .ct{font-weight:bold;margin-bottom:4px}
  .ccard .cr{display:flex;justify-content:space-between;gap:6px;font-size:13px}
  .onode{border-left:2px solid var(--line,#ddd);padding:2px 0 2px 8px;margin:3px 0 3px 6px}
  .onode>summary{font-size:14px;cursor:pointer}
  .onode.path{border-left-color:#b5452f}
  .onpath{background:#f6e3dc!important;color:#8a2f1d!important}
  .vt{font-size:11px;color:#888;border:1px solid #ccc;border-radius:3px;padding:0 3px;margin-left:3px}
  .opost{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;padding:2px 0}
  .opost .ot{min-width:6em}.opost .ot i{font-style:normal;color:#888;margin-left:4px;font-size:12px}
  .opost .oin{width:9em;font-size:12px;padding:2px 4px}
  .oadd summary{font-size:12px;cursor:pointer}
  .ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin:6px 0}
  .gcell{border:1px solid var(--line,#ddd);border-radius:6px;padding:5px 6px;background:var(--card,#fffdf8);position:relative}
  .gcell .gk{font-size:12px;color:#666}.gcell .gk small{margin-left:4px;color:#999}
  .gcell .gv{font-size:15px;font-weight:bold}.gcell .gv small{font-size:11px;font-weight:normal;margin-left:2px;color:#888}
  .gbar{height:5px;background:#eee;border-radius:3px;overflow:hidden;margin-top:3px}.gbar i{display:block;height:100%;background:#7a9a5a}.gbar i.warn{background:#c9a03a}.gbar i.bad{background:#b5452f}
  .gd{position:absolute;top:4px;right:6px;font-size:11px}.gd.up{color:#3b7a2e}.gd.down{color:#a33}
  .spk{display:block;margin-top:2px;color:#999}

7. 不攀附，人是那个年代的真人，不善化：主角是什么出身就是什么出身——偏远地方的小人物不认识名人，见不到大人物，身边是同乡、邻里、东家、小吏这些够得着的人；史书上的真人只照史料出现在他们真在的地方，跟主角没有来往的，不写成主角的亲戚、同窗、故交、恩主，不让他们认得主角、主动来找主角、对主角另眼相看；主角想结识大人物要自己找门路，多半见不到、递不上话。主线上的真人照史料行动，该狠的狠、该贪的贪；身边的人照自己的利害行事，私心、势利、贪财、刻薄、偏见、欺软怕硬、落井下石，那个年代的人有的照样写。好人也有算计，坏人不洗白；不让人物为了显得正面去讲道理、认错、劝善、突然良心发现；主角做了狠事，旁人照那个年代的眼光反应（怕、巴结、记恨、叫好都行），叙述不评判。一群人不会因为一个生人喊一句就跟着走：多数人有自己的盘算和顾虑（怕官府、还指望进城、没吃的、不信生人），只有走投无路的、心怀怨愤的、想趁乱的少数会动。人只知道他够得着的消息，想事情用那个年代的道理，不知道后世；魂穿来的主角只记得些模糊的印象，不能当预知用，叙述也不透露后世结局。每个出场的人有名有姓（虚构的起一个合乎时代的全名，不与同时同地的真人重名，不写「严某」；本该是真人的官位不用虚构的人顶），头一次出场交代他是谁。每个人都要有名字。官员、宗室、贵族、旗人、士绅先照材料里查到的真人写；查不到的，照【本地官员名册】里推断的人（前任没有调走、没有接任的记录就仍在任，也考虑年老病故）；实在查不到也推不出的，起一个合乎他身份和那个年代风气的雅名（官宦士绅有字有号、同族照字辈，宗室旗人照本朝宗室旗人的取名习惯），程序会再去查，查到真人就换成真名。平民小人物起合他出身的名字（贫户多叫小名排行）。真人的性情、嗜好、私事、家世、关系只写史料有的，史料没写的不替他编人设、编往事、编秘密；虚构的人也只交代这一场用得着的身份和来由，不给他编一套身世故事。主角和他家里人的家世（祖上、父母、兄弟、婚配、子女、族谱字辈）照开局设定和史料，人数、年纪、名字一旦写定不改，推测只照那个年代那种人家的常情，不离谱。不为了把主角凑到历史大事、大人物跟前，去改主角或旁人的身份、籍贯、行程、官职、关系；碰不上就碰不上。对手聪明，不为了让主角赢而犯傻。成败照实情定：主角的身份、权限、钱粮、人手、门路够得着、照常理办得成的事，就办成，不为了显得难、显得有戏而让它失败、拖着不成；真正的阻力（对方的利害、制度、路程、实力差）够大，才会卡住或失败，失败了写清卡在哪，不暗中救场。办成了也会有代价或后患（花了钱粮、欠了人情、招了眼红），照实写。
8. 一回只写一两件事，写深写透，不堆事件、不派任务；别人找上门托事、派差事是偶尔的（多半几回才有一次），不是回回都有人来找主角办事；人物有来有去：不在眼前的人（外地的、断了来往的、多年不见的）没有来由不出场，故人重逢只能是偶然——同城、同路、同一场合，路程日子说得通，而且很少；要见远处的人，是主角自己去找、写信、托人，联络照身份来：官员走公文、驿递、差役、邸报，富户遣家仆送信、托商号捎带，平民托同乡、过路人捎口信，路远的要走一两个月，常常送不到、没回音；征召照本朝制度由官府办，不会凭空落到一个平头百姓身上。断了的线就断了，不为了热闹把旧人拉回来；很多日子里本来就无事发生，照常写日子即可；但平常日子不空：主角够得着的人各有心事、买卖、婚嫁、官司、门路，此时此地真有的机会（科举、招募、行情、庙会集市、书院讲会、同乡会馆、衙门招吏、商队招人）就摆在那里，玩家去碰就有回应，给出能往下走的线头；结交人要有场合、有来由（同乡、同行、同窗、东家、邻里、师友引荐），一步步熟起来；世界照它自己的时间走：史事到了日子、消息按路程到了、某人的打算该动了才动，没到时候就不硬加；玩家这一步本身就是这一回的戏。钱、账、债只在玩家这一步跟钱有关、或者到了交割的日子才写，不回回拿钱粮账目、欠款做文章；同一件事（同一笔债、同一本账、同一个麻烦）上一回写过了，这回玩家没提就不再拿出来。玩家还在一场对话、一段路、一件事里，就接着写下去，不换场面；新起一场时，场面、出场的人、开头和收尾才和【最近几回的场面】错开。
9. 历史的质感在具体：衙门、职衔、文书、称谓、街巷、器物、物价照【制度框架】【本地志】【内置史料】【真人档案】来，用在动作和对话里，一个场面用一两处就够，不讲解、不掉书袋；不造官名、不搬别朝的制度、不编史书没有的大事。写到官职，写清本官（寄禄官或品级）、实际差遣或职掌、上司和同僚的真名（照【本地官员名册】【真人档案】），不写「加官一等」「迁两官」这种含糊话；赏赐、服色、仪制合本朝等级，诏令文书照路程和程序传达，不当日就到。
10. 地理、时间、路程、钱粮是真的：地名、方向、远近、沿途州县照【县级地理】，没有的不编；步行日行五六十里，骑马百里上下，驿递三四百里；外地的事照【传到此地的消息】写——先到的多是风闻，走了样（人数、日子、谁干的会传错、夸大，各人说法不一），官文邸报晚到才确；没传到的，书中人就不知道；打仗照兵力粮草地形天候；升迁照本朝规矩；人会老会病会死，死了由继承人接着。正文里的兵数、粮数、地盘、国库照【国势账】，只在要紧时提一句；不写盘点家产、清点人手、算账这类流水账。
11. 写法：像《大明王朝1566》那样一场一场写，像上面的示范那样分段：一段三五句，人物说话另起一段，段与段之间空一行；叙述短，人物的话里有身份、有脾气、有算盘；称主角为「你」。不要清单、小标题、括号按语、「你可以……」的选项；不说教；不用「仿佛」「不禁」「一丝」「深吸一口气」「嘴角微微上扬」「命运的齿轮」这类套话；不用感悟句收尾。

笔法（只学节奏、写法和分寸；用词、称呼、器物、钱的单位一律按本局的年代，不照搬下面的字眼）：
——卖布的见你在摊前站住，把那匹布往案上一抖，灯底下泛出一层光。「您瞧这织口，城里能织到这个份上的不出五家。」见你不搭腔，他压低了声音：「去年冬天是这个价，今年丝贵，再少小店就赔了。」说着拿眼角瞟你，一只手已经搭在了秤杆上。门外挑担的吆喝着过去了。
——你进门时，母亲正坐在灶下添柴，见了你也不起身，只问：「吃过没有？」不等你答，又说：「西头王家的二丫头，今年十六了，你见过的。」灶膛里噼啪响了一下。父亲在里屋咳嗽，咳完了隔着帘子说：「你娘的意思，你自己掂量。」

整回的样子（两段示范，各取一个年代，仅为写法示例；只学它怎样把真实大事落到一个人身上、身边的人怎样自己动、怎样只写别人不替主角开口、怎样停在新局面上——人物、年代、字眼一概不照搬）：
——熙宁三年二月，青苗钱的榜文贴到县门口第三天，你在茶肆里听见了第一句骂。说话的是西乡的里正孙德，他把茶碗往桌上一顿：「官家借钱，二分息，比城里的质库还狠。」同桌的人没接话，眼睛都往你这边瞟——你这身县尉的公服坐在这里，谁都知道是什么意思。
昨夜崔知县把你叫到后衙，只说了一句：「府里限月底散完，散不完，你我都去岭南吃荔枝。」他没说怎么散。
孙德终于转过身来，拱了拱手：「尉公，小老儿说句实话。西乡今年麦苗长得好，没人缺这几贯钱。可榜上写着户户都要请，这是借，还是派？」
茶肆里一下静了。门外挑担的走过，扁担吱呀一声。
押司周彦从门口挤进来，满头是汗，凑到你耳边：「东乡张家，一早把三百贯青苗钱全领走了，说是替佃户一并请的。」他顿了顿，「转手就按四分息放给了佃户。小人已经叫人去抄张家的放钱簿子。」
孙德听不见这话，只当你不肯答，冷笑一声，丢下茶钱走了。
——崇祯二年十月底，通州的米价一夜涨了三成。你一早到张家湾码头，漕船上的米包有人往下卸、有人往上搬，乱成一团。牙人钱六迎上来，不等你问就说：「东家，遵化来了塘报，东虏从喜峰口进来了。昨儿后半夜京里几家大宅派人来，要把咱们仓里的米全订下，出市价加两成，定银五百两都带来了，管事的还在船上候着。」他搓着手，「这价只会涨不会落，小的没敢应，等您一句话。」
远处有锣声。州衙的差役沿街喊着：城门申时就关，四乡的人赶紧进城。
钱六压低了声音：「还有一桩。关宁的兵马听说正往京师赶，要是从通州过，粮是要征的。那五千石要是还在咱们仓里，到时候一粒也不由咱们。」他眼睛亮亮地看着你。

/* ========== 国势账：地盘、兵马、势力、国库按名字合并（不再被一张不全的清单整组冲掉），粮饷与岁入岁出由程序照日子结算 ========== */
const GONE = v => /^(true|是|1|丢|失|亡|散|灭)/.test(String(v == null ? '' : v).trim());
function mergeRows(old, upd, key, n) {
  const m = new Map(arr(old).filter(x => x && x[key]).map(x => [x[key], x]));
  for (const x of arr(upd)) {
    const k = x && x[key]; if (!k) continue;
    if (GONE(x.lost) || GONE(x.gone)) { m.delete(k); continue; }
    const clean = Object.fromEntries(Object.entries(x).filter(([kk, v]) => v !== '' && v != null && kk !== 'lost' && kk !== 'gone'));
    m.set(k, { ...(m.get(k) || {}), ...clean });
  }
  return [...m.values()].slice(-n);
}
/** 过了几天：兵吃粮（一人一日一升半）、国库照岁入岁出折算；记进这一回的账 */
function realmUpkeep(s, days, acc) {
  if (!days || days <= 0) return;
  for (const f of arr(s.forces)) {
    if (arr(f.units).length) continue;   // 有编成的兵马照兵种按月结算粮饷（armyMonthly），这里不再重复扣
    const t = N0(f.troops), g = N0(f.grain);
    if (t > 0 && g != null) { const use = Math.round(t * 0.02 * days); if (use > 0) { const ng = Math.max(0, g - use); acc.push({ k: `${f.name || f.leader}军粮`, from: g + '石', to: ng + '石', why: `${t}人×${days}天，日食二升` }); f.grain = String(ng); } }
  }
  const R = s.realm;
  if (R) { const rev = N0(R.revenue) || 0, out = N0(R.outlay) || 0, tr = N0(R.treasury); if (tr != null && (rev || out)) { const nt = Math.round(tr + (rev - out) * days / 360); if (nt !== tr) { acc.push({ k: '国库', from: fmtN(tr, (s.money || {}).unit || '两'), to: fmtN(nt, (s.money || {}).unit || '两'), why: `岁入${rev}、岁出${out}，折${days}天` }); R.treasury = String(nt); } } }
}
/** 给推演、写正文、记账的人看的国势总账（程序算的，以此为准） */
function realmBlock(s) {
  const tr = arr(s.territory), fc = arr(s.forces), R = s.realm, pw = arr(s.powers);
  if (!tr.length && !fc.length && !R) return '';
  const sum = (xs, k) => xs.reduce((a, x) => a + (N0(x[k]) || 0), 0);
  const L = ['【国势账（程序结算，以此为准；正文里的兵数、粮数、地盘、国库必须和这里对得上，打了仗、丢了城、征了兵就在记账时改）】'];
  if (R) L.push(`国库 ${R.treasury ?? '？'}；太仓存粮 ${R.granary ?? '？'}石；总兵额 ${R.army ?? '？'}；岁入 ${R.revenue ?? '？'}、岁出 ${R.outlay ?? '？'}${R.note ? '；' + R.note : ''}`);
  if (tr.length) L.push(`地盘 ${tr.length} 处（户口合计约 ${sum(tr, 'pop')}，守军合计 ${sum(tr, 'troops')}，存粮合计 ${sum(tr, 'grain')}石）：` + tr.map(x => `${x.place}（户${x.pop || '？'}，守军${x.troops || '？'}，粮${x.grain || '？'}石，民心${x.loyalty || '？'}${x.ruler ? '，' + x.ruler + '治' : ''}）`).join('；'));
  if (fc.length) L.push(`兵马 ${fc.length} 支（合计 ${sum(fc, 'troops')} 人）：` + fc.map(x => { const t = N0(x.troops), g = N0(x.grain); const dd = t > 0 && g != null ? Math.floor(g / (t * 0.02)) : null; return `${x.name || ''}（${x.leader || ''}统，${x.troops || '？'}人，${x.quality || ''}，在${x.at || '？'}，${x.status || ''}${dd != null ? `，粮可支${dd}天${dd < 30 ? '——要断粮了' : ''}` : ''}）`; }).join('；'));
  if (pw.length) L.push('天下各方：' + pw.map(x => `${x.name}（${x.leader || ''}，据${x.seat || ''}${x.land ? '，' + x.land : ''}，兵${x.troops || '？'}，对主角${x.stance || '？'}）`).join('；'));
  return L.join('\n');
}
/** 账房的规则：照正文记账、核史实，只出 JSON */

        if (!prev || prev.status !== st || prev.text !== w.over[key].text) report.push({ text: `${u.y || ''}年${u.m ? u.m + '月' : ''}：${one(u.text, 100)}`, status: st, why: one(u.why, 100) });
      } else if (!key && st === '新出') {
        const x = { y: num(u.y) ?? s.clock.y, m: Math.min(12, Math.max(0, num(u.m) || 0)), text: one(u.text, 100), status: '新出', why: one(u.why, 100), needs: one(u.needs, 80), grade: 'C' };
        x.key = 'n' + x.y + ':' + x.text.slice(0, 14);
        if (evYM(x) > nowYM && x.y <= s.clock.y + 10 && !w.extra.some(o => o.key === x.key)) { w.extra.push(x); report.push({ text: `${x.y}年${x.m ? x.m + '月' : ''}：${x.text}`, status: '新出', why: x.why }); }
      }
    }
    w.extra = w.extra.filter(x => evYM(x) > nowYM - 12).slice(-30);
    s.figOver = s.figOver || {};
    // 推演说某人死了：只有比史书早才记（记当年）；说某人活着：只记「到某年还活着」，不让他长生不老；官职改动记年份，史料里更晚的任命照样生效
    const dataFig = n => { for (const h of HALL(s)) { const f = arr(h.figures).find(x => x.name === n); if (f) return f; } return null; };
    for (const f of arr(d.figures)) if (f && f.name) {
      const k = one(f.name, 10), o = s.figOver[k] || {}, df = dataFig(k), y = s.clock.y;
      const n = { ...o, note: one(f.note || f.stance, 60) || o.note || '' };
      const pst = one(f.post, 40);
      if (pst && (!df || pst !== (figState(s, df, y, s.clock.m).post || ''))) { n.post = pst; n.postY = y; }
      if (f.alive === false && (!df || df.died == null || df.died > y) && o.deadY == null) { n.dead = true; n.deadY = y; }
      if (f.alive === true && df && df.died != null && df.died <= y && arr(s.history).length) n.aliveY = y;
      s.figOver[k] = n;
    }
    syncHist(s);
    d.figures = null;
  } else if (up.length) w.upcoming = up;
  if (d.overview) w.overview = cut(d.overview, 700);
  if (Array.isArray(d.figures) && d.figures.length) s.figures = d.figures.filter(f => f && f.name).slice(0, 18).map(f => ({ name: one(f.name, 10), post: one(f.post, 40), age: num(f.age), where: one(f.where, 20), stance: one(f.stance, 40), alive: f.alive !== false, note: one(f.note, 60) }));
  const rp = arr(d.ripples).filter(r => r && r.cause && r.effect && !arr(w.ripples).some(o => one(o.effect, 12) === one(r.effect, 12))).slice(0, 6).map(r => ({ turn: s.turn, cause: one(r.cause, 60), effect: one(r.effect, 100), when: one(r.when, 20) }));
  w.ripples = arr(w.ripples).concat(rp).slice(-40);
  // 外面发生的事：记成带地点的事件，由「消息传到此地」按路程变成风闻、确报，写进以后的正文
  for (const o of arr(d.outside).filter(o => o && o.text).slice(0, 6)) {
    let y = num(o.y) ?? s.clock.y, m = Math.min(12, Math.max(0, num(o.m) || 0));
    if (y * 12 + (m || 6) > ymOf(s.clock)) { y = s.clock.y; m = s.clock.m; }
    const text = one(o.text, 100), key = 'o' + y + ':' + text.slice(0, 14);
    if (!arr(w.events).some(e => e.key === key || one(e.text, 10) === one(text, 10))) w.events.push({ y, m, text, where: one(o.where, 20), scope: /京|朝|天下|诏|帝|皇/.test(String(o.where) + text) ? '天下' : '地方', key, changed: true, outside: true });
  }
  w.events = w.events.slice(-120);
  const moves = arr(d.npcMoves).filter(m => m && m.name && m.did).slice(0, 6).map(m => ({ name: one(m.name, 12), did: one(m.did, 100), why: one(m.why, 60), plan: one(m.plan, 60) }));
  for (const m of moves) {
    const o = s.people[m.name]; if (o) { o.status = m.did; if (m.plan) o.plan = m.plan; }
    s.chronicle.push({ turn: s.turn, when: `${s.clock.yearLabel || ''}${CAL.label(s.clock.m, 0, s.clock.leap)}`, who: m.name, what: m.did });
  }
  const rows = (a, n) => a.filter(x => x && typeof x === 'object').slice(0, n).map(x => Object.fromEntries(Object.entries(x).map(([k, v]) => [k, one(v, 60)])));
  if (Array.isArray(d.powers) && d.powers.length) s.powers = mergeRows(s.powers, rows(d.powers, 16), 'name', 16);
  if (Array.isArray(d.factions)) { const f = rows(d.factions, 10).filter(x => x.name); if (f.length) s.factions = f; }
  w.tickAt = { ym: nowYM, turn: s.turn, label: timeText(s.clock) };
  return { changes: report.slice(0, 8), ripples: rp, moves, overview: cut(d.overview, 600) };
}

/** 长局不走样：摘要多了，把最早的三十回合压成一章，章节一直带着 */
async function compactMemory(s) {
  const old = arr(s.summaries).slice(0, 30);
  if (old.length < 30) return;
  let text = '';
  try {
    const r = await callClaude(`把下面这局历史模拟游戏较早的三十回合经过，压成一段四百字以内的章节摘要：按时间先后，只留事实（谁、何时、在哪、做了什么、结果、钱粮与名位的变化、结下的恩怨与约定），不加评论，不丢要紧的人名地名数目。只输出摘要正文。\n\n主角：${s.protagonist.name}，${s.protagonist.role}\n\n` + old.map(x => `第${x.turn}回合（${x.when}）：${x.text}`).join('\n'), null, { json: false, maxTokens: 1500, temperature: 0.2, kind: '修史', fast: true }, 'quick');
    text = cut(String(r.text || '').trim(), 500);
  } catch (e) { if (e && e.code === 'cancelled') return 'cancelled'; }
  if (text.length < 40) text = cut(old.map(x => x.text).join('；'), 500);
  s.chapters = arr(s.chapters).concat([{ from: old[0].when, to: old[old.length - 1].when, text }]);
  while (s.chapters.length > 12) { const [a, b] = s.chapters; s.chapters.splice(0, 2, { from: a.from, to: b.to, text: cut(a.text + '；' + b.text, 700) }); }
  s.summaries = s.summaries.slice(30);
}

    const person = ds.org === 'quota' ? val(`[data-oq="${CSS.escape(ds.n + '_' + pi)}"]`) : ds.org === 'appoint' ? val(`[data-oin="${CSS.escape(ds.n + '_' + pi)}"]`) : ds.org === 'addPost' ? val(`[data-oadd="${CSS.escape(ds.n)}"]`) : ds.org === 'addNode' ? val(`[data-onode="${CSS.escape(ds.n || '')}"]`) : '';
    const pol = ds.pol ? arr(S.policies).find(x => x.id === ds.pol) : null;
    if (!S.org && ds.org !== 'policy') return;
    const line = orgAct(S, ds.org, { node: n, pi, person, pol });
    if (line) { const ta = $('#said'); if (ta) { ta.value = (ta.value.trim() ? ta.value.trim() + '\n' : '') + line; } try { await store.save(S); } catch (_) {} }
    render(); return;
  }
  if (t.id === 'bFaceEdit') { openFaceEditor(); return; }
  if (t.id === 'bFaceRand') { if (S) { S.face = FACE.make(faceGender(S.protagonist.gender), null, { role: S.protagonist.role, year: S.clock.y, age: S.protagonist.age }); store.save(S).catch(() => {}); render(); } return; }
  if (t.id === 'bLogin' || t.id === 'bRegister') { t.disabled = true; await acctLogin(t.id === 'bRegister'); t.disabled = false; return; }
  if (t.id === 'bLogout') { acctLogout(); return; }
  if (t.dataset && t.dataset.acct != null) { const el = $('#aName'); if (el) el.value = t.dataset.acct; const pw = $('#aPw'); if (pw) pw.focus(); return; }
  if (t.id === 'bKeyOpen') { KEY_OPEN = true; render(); return; }
  if (t.id === 'bKeyClose') { KEY_OPEN = false; KEYMSG = ''; render(); return; }
  if (t.id === 'bKeySave') {
    if (KEYSAVING) return;
    const k = cleanKey($('#kIn').value), m = String($('#kModel').value || '').trim().toLowerCase();
    if (!k && !(m && KEY.has)) { KEYMSG = '先把 DeepSeek 的 Key 粘贴进左边的框里'; render(); const el = $('#kIn'); if (el) el.focus(); return; }
    if (k && !/^[\x21-\x7e]{8,}$/.test(k)) { KEYMSG = '这串不像 DeepSeek 的 Key（应是 sk- 开头的一串英文数字），请到 platform.deepseek.com 的「API keys」里重新复制'; render(); return; }
    KEYSAVING = 'ds'; KEYMSG = ''; render();
    if (MODE === 'web') {   // 网页版：Key 存在这个浏览器里，浏览器直接试连
      const old = [lsGet('hrpg:dskey'), lsGet('hrpg:dsmodel')];
      if (k) lsSet('hrpg:dskey', k); if (m) lsSet('hrpg:dsmodel', m); webKeyRefresh();
      try { await directSample('只回复两个字：正常', { maxTokens: 20, json: false, temperature: 0 }); lsSet('hrpg:dsbad', null); lsSet('hrpg:dspoor', null); KEYMSG = '✓ 已保存，已接上 DeepSeek，可以开始玩了'; KEY_OPEN = false; const el = $('#kIn'); if (el) el.value = ''; }
      catch (e) {
        const w = (e && e.message) || String(e);
        if (/HTTP 40[0-3]/.test(w) && /型号|model/i.test(w) && m) { lsSet('hrpg:dsmodel', old[1]); }
        if (/HTTP 40[13]/.test(w)) lsSet('hrpg:dsbad', w); else lsSet('hrpg:dsbad', null); lsSet('hrpg:dspoor', /HTTP 402/.test(w) ? '1' : null);   // 余额不足（402）、网络不通都不算 Key 坏：Key 留着，不让玩家重填
        KEYMSG = '已保存，但试连没通：' + w;
      }
      webKeyRefresh(); KEYSAVING = ''; render(); return;
    }
    try {
      const r = await api('/api/quick-key', { apiKey: k || undefined, model: m || undefined });
      await refreshKey();
      if (k) lsSet('hrpg:dskey', k);
      // 游戏程序连不上 DeepSeek（防火墙、杀毒软件、代理拦着）：马上改由浏览器直接试连，通了就以后都这样走
      if (r.ok && r.test && !r.test.ok && netFail(r.test.why)) {
        try { await directSample('只回复两个字：正常', { maxTokens: 20, json: false, temperature: 0 }); DS_DIRECT = true; lsSet('hrpg:dsdirect', '1'); r.test = { ok: true, model: KEY.model, direct: true }; }
        catch (e2) { r.test.why = (e2 && e2.message) || r.test.why; }
      } else if (r.ok && r.test && r.test.ok) { DS_DIRECT = false; lsSet('hrpg:dsdirect', null); }
      if (!r.ok) KEYMSG = '没保存上：' + (r.why || '未知原因');
      else if (r.test && r.test.ok) { KEYMSG = r.test.direct ? '✓ 已保存，已接上 DeepSeek，可以开始玩了（这台电脑的游戏程序被防火墙或杀毒软件拦着，已自动改由浏览器直接连，不用管它）' : `✓ 已保存，试连成功（${r.test.model || ''}）`; KEY_OPEN = false; const el = $('#kIn'); if (el) el.value = ''; }
      else { const w = plainWhy(r.test && r.test.why); KEYMSG = '已保存，但试连没通：' + w + (/Key|余额|权限/.test(w) ? '。请核对 Key 后重新粘贴。' : '。Key 已经存下了，网络好了就能用；点「检查网络」看看卡在哪。'); const el = $('#kIn'); if (el) el.value = ''; }
    } catch (e) { KEYMSG = '没保存上：游戏服务没有回应（' + (e.message || e) + '）'; }
    KEYSAVING = ''; render(); return;
  }
  if (t.id === 'bWBocha') {
    const k = String(($('#wBocha') || {}).value || '').replace(/\s+/g, ''); const m = $('#wBochaMsg'); if (!k) return;
    t.disabled = true; const old = BOCHA_KEY; BOCHA_KEY = k;
    try { const items = await bochaFetch('苏轼'); lsSet('hrpg:bochakey', k); SEARCH_OFF = ''; SEARCH_DOWN = 0; render(); const m2 = $('#wBochaMsg'); if (m2) m2.textContent = `✓ 试搜成功（${items.length} 条），以后每回合先用博查`; }
    catch (e) { BOCHA_KEY = old; t.disabled = false; if (m) m.textContent = '没通：' + (e.name === 'AbortError' ? '博查超时' : e.message); }
    return;
  }
  if (t.id === 'bWBochaOff') { BOCHA_KEY = ''; lsSet('hrpg:bochakey', ''); render(); return; }
  if (t.id === 'bReport') { exportReport().catch(e => { const m = $('#updMsg'); if (m) m.textContent = '没导出来：' + (e.message || e); }); return; }
  if (t.id === 'bUpdCheck') {
    t.disabled = true; t.textContent = '查更新中…（最多一两分钟）';
    try { const u = await api('/api/update/check', {}); UPDINFO = u; if (u.using === 'updated' && u.remote && String(u.remote) > BUILD) { lsSet('hrpg:reloaded', String(u.remote)); if (!BUSY && !BG) { location.reload(); return; } } }
    catch (e) { UPDINFO = { why: e.message || String(e) }; }
    render(); return;
  }
  if (t.id === 'bNoBocha' || t.id === 'bBochaOn') { if (KEYSAVING) return; try { const r = await api('/api/quick-key', t.id === 'bNoBocha' ? { noBocha: true } : { bochaOn: true }); await refreshKey(); KEYMSG = !r.ok ? '没改成：' + (r.why || '') : t.id === 'bNoBocha' ? '✓ 已关掉博查，只用维基百科' : '✓ 又用上博查了'; } catch (e) { KEYMSG = '游戏服务没有回应：' + (e.message || e); } render(); return; }
  if (t.id === 'bBochaSave') {
    if (KEYSAVING) return;
    const k = cleanKey($('#bIn').value); if (!k) { KEYMSG = '先把博查的 Key 粘贴进框里'; render(); const el = $('#bIn'); if (el) el.focus(); return; }
    KEYSAVING = 'bc'; KEYMSG = ''; render();
    try {
      const r = await api('/api/quick-key', { bochaKey: k });
      await refreshKey();
      if (r.bocha && r.bocha.ok) { SEARCH_OFF = ''; SEARCH_DOWN = 0; }
      KEYMSG = !r.ok ? '没保存上：' + (r.why || '') : r.bocha && r.bocha.ok ? `✓ 博查已保存，试搜成功（${r.bocha.count} 条）` : '博查 Key 已存下，但试搜没通：' + plainWhy((r.bocha && r.bocha.why) || '');
      if (r.ok) { const el = $('#bIn'); if (el) el.value = ''; }
    } catch (e) { KEYMSG = '没保存上：游戏服务没有回应（' + (e.message || e) + '）'; }
    KEYSAVING = ''; render(); return;
  }
  if (t.id === 'bNet') {
    if (NETCHECKING) return; NETCHECKING = true;
    t.disabled = true; t.textContent = '检查中…';
    try {
      const r = await api('/api/netcheck');
      KEYMSG = arr(r.results).map(x => `${x.name}：${x.ok ? '✓ 连得上' : '✗ ' + x.why}`).join('\n') + (r.proxy ? `\n代理：${r.proxy}` : '');
      if (arr(r.results).every(x => x.ok)) KEYMSG = '✓ ' + KEYMSG;
    } catch (e) { KEYMSG = '游戏服务没有回应：' + (e.message || e); }
    NETCHECKING = false; render(); return;
  }
  if (t.id === 'bRetry') { const f = LAST_ACTION; ERRMSG = ''; f && f(); return; }
  if (t.dataset.goal != null) { const el = $('#said'); if (el) { el.value = (el.value ? el.value + '\n' : '') + '为了「' + t.dataset.goal + '」，'; el.focus(); } return; }
  if (t.id === 'bCustomClear') { CUSTOM = {}; lsSet('hrpg:custom', null); render(); return; }
  if (t.id === 'bCloseSide') { SIDE_FOLD = true; render(); return; }
  if (t.id === 'bHome') { if (BUSY) return; if (BG) BG_STOP = true; VIEW = 'start'; S = null; ERRMSG = ''; SAVED = ''; DEL_ASK = ''; SAVES_AT = 0; render(); return; }
  if (ds.load) {
    if (BUSY) { ERRMSG = '这一回还在写，写完或点「停下」后再切换存档。'; render(); return; }
    if (BG) BG_STOP = true;   // 上一局的后台活停下，不再往那一局里写
    const s = await store.load(ds.load); if (!s) { ERRMSG = '这个存档读不出来了。'; render(); return; }
    S = s; VIEW = 'game'; TAB = 'board'; ERRMSG = ''; EDITING = false; SAVED = ''; DEL_ASK = ''; lsSet('hrpg:last', s.id); render(); window.scrollTo(0, document.body.scrollHeight); return;
  }
  if (ds.askdel) { DEL_ASK = ds.askdel; render(); return; }
  if (ds.nodel) { DEL_ASK = ''; render(); return; }
  if (ds.del) {
    const id = ds.del; DEL_ASK = '';
    if (S && S.id === id) { if (BUSY) return; S = null; VIEW = 'start'; }   // 删的是正在玩的这一局：先回首页
    if (BG) BG_STOP = true;
    const why = await store.del(id); ARC.del(id); SAVES_CACHE = arr(SAVES_CACHE).filter(x => x.id !== id); SAVES_AT = 0;
    if (why) ERRMSG = `这一局在本机删掉了，${MODE === 'local' ? '游戏存档文件夹' : '账号'}里那份没删成（${why}）；它不会再出现在列表里。`;
    render(); return;
  }
  if (ds.tab) { SIDE_FOLD = TAB === ds.tab ? !SIDE_FOLD : false; TAB = ds.tab; render(); return; }
  if ((ds.write || ds.goal) && !SIDE_FOLD && matchMedia('(max-width: 960px)').matches) { SIDE_FOLD = true; render(); }
  if (ds.fb && FEEDBACK[ds.fb] && S && S.prev && !BUSY) {
    const n = S.chat.length, lastGm = S.chat[n - 1], beforeIt = S.chat[n - 2];
    if (lastGm && lastGm.role === 'gm') {
      noteErr('玩家反馈', ds.fb, { text: cut(lastGm.text, 300), said: beforeIt && beforeIt.role === 'me' ? cut(beforeIt.text, 80) : '' });
      const said = beforeIt && beforeIt.role === 'me' ? beforeIt.text : '', orig = S;
      S = restorePrev(orig); FIXACK = `照「${ds.fb}」重写了这一回。`;
      send(said, lastGm.span || 'auto', FEEDBACK[ds.fb], { orig, ruling: lastGm.extra && lastGm.extra.ruling, fix: true }); return;
    }
  }
  if (ds.write) { const ta = $('#said'); ta.value = (ta.value.trim() ? ta.value.trim() + '\n' : '') + ds.write; ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); ta.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  if (t.id === 'bSend') {
    const sp = $('#span').value; const said = $('#said').value; $('#span').value = 'auto';
    // 玩家是在指出上一回写错了（「你写错了…」「戏外：这里不对…」「敷衍」）：不当成新一步，照他说的重写上一回
    if (S && S.prev && isFixRequest(said)) {
      const n = S.chat.length, lastGm = S.chat[n - 1], beforeIt = S.chat[n - 2];
      if (lastGm && lastGm.role === 'gm' && lastGm.kind !== 'talk') {
        const prevSaid = beforeIt && beforeIt.role === 'me' ? beforeIt.text : '';
        const orig = S; S = restorePrev(orig); $('#said').value = '';
        FIXACK = '是我写错了，已照你说的改。';
        send(prevSaid, lastGm.span || 'auto', String(said).replace(/^\s*戏外[：:]?\s*/, '').trim(), { orig, ruling: lastGm.extra && lastGm.extra.ruling, fix: true }); return;
      }
    }
    send(said, sp); return;
  }
  if (t.id === 'bEdit') { EDITING = true; render(); const el = $('#editText'); el && el.focus(); return; }
  if (t.id === 'bEditCancel') { EDITING = false; render(); return; }
  if (t.id === 'bEditSave') { const el = $('#editText'); const last = [...S.chat].reverse().find(c => c.role === 'gm'); if (el && last) { const tx = el.innerText.replace(/\n{2,}/g, '\n').trim(); if (!tx) { el.focus(); return; } last.text = tx; } EDITING = false; await store.save(S); render(); return; }
  if (t.id === 'bRegen') { $('#regenBox').innerHTML = `<div class="row"><input id="regenNote" class="grow" placeholder="想怎么改？比如：别让他这么快答应 / 写得更细（可以不填）"><button class="main" id="bRegenGo">重写</button><button id="bRegenNo">算了</button></div>`; $('#regenNote').focus(); return; }
  if (t.id === 'bRegenNo') { $('#regenBox').innerHTML = ''; return; }

      if (arr(r.results).some(x => /搜索|维基/.test(x.name) && x.ok)) { SEARCH_OFF = ''; SEARCH_DOWN = 0; }
    } catch (e) { SELFTEST = `<div class="err">游戏服务没有回应：${esc(e.message || e)}</div>`; }
    finally { SELFTESTING = false; }
    render(); return;   // 结果框第一次还不在页面上：重画一遍让它出来，不再往不存在的框里写字卡死
  }
  if (t.id === 'bBranch') {
    if (BUSY || !S) return;
    setBusy(true);
    try {
      await store.save(S);
      const b = clone(S); b.id = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      b.title = `${one(S.title, 20)}（分支·第${S.turn}回合）`; b.branchOf = S.id; b.createdAt = Date.now(); if (b.prev) { b.prev.id = b.id; b.prev.title = b.title; b.prev.branchOf = S.id; }
      await store.save(b); await ARC.copy(S.id, b.id); S = b; lsSet('hrpg:last', b.id);
    } finally { setBusy(false); }
    const m = $('#branchMsg'); if (m) m.textContent = '✓ 已另存为分支，现在玩的是分支'; return;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'sLen') { SETTINGS.len = e.target.value; lsSet('hrpg:settings', JSON.stringify(SETTINGS)); }
  if (e.target.id === 'sTier') { SETTINGS.tier = e.target.value; lsSet('hrpg:settings', JSON.stringify(SETTINGS)); }
});

/* ========== 启动 ========== */
render();
(async () => {
  const c = window.claude;
  if (c && c.use) {
    MODE = 'claude';
    const [sm, db, user] = await Promise.all([c.use('sample'), c.use('db'), c.use('user')]);
    SAMPLE = sm; DB = db;
    try { UID = user ? await user.id() : null; } catch (_) { UID = null; }
  } else {
    try { if (!location.protocol.startsWith('http')) throw 0; const h = await api('/api/health'); if (h && h.ok) { MODE = 'local'; SAMPLE = deskSample; watchUpdate(); await refreshKey(); try { const r = await api('/api/hpacks'); RUNHIST = arr(r.packs).filter(p => p && Array.isArray(p.range) && Array.isArray(p.events)); } catch (_) { RUNHIST = []; } } } catch (_) { MODE = 'none'; }
    // 没有本机游戏程序（在线打开、或把网页存到电脑上双击打开）：网页版，浏览器直接连 DeepSeek，只要填 Key
    if (MODE !== 'local') { MODE = 'web'; SAMPLE = directSample; webKeyRefresh(); webWatchUpdate(); }
  }
  READY = true;
  const last = lsGet('hrpg:last');
  if (last && VIEW === 'start' && !BUSY && !(MODE === 'web' && ACCOUNTS_ON && !WHO)) {
    try { const s = await store.load(last.split('|')[0]); if (s) { S = s; VIEW = 'game'; } } catch (_) { /* 留在首页 */ }
  }
  render();
  // 刷新前还有一回合在写：接着等它写完，不丢
  try {
    const p = JSON.parse(lsGet('hrpg:pending') || 'null');
    if (p && S && p.saveId === S.id && Date.now() - p.at < 30 * 60e3 && (p.story || (p.job && MODE === 'local'))) {
      const same = () => p.baseSig ? chatSig(S) === p.baseSig : p.baseChat != null ? S.chat.length === p.baseChat : S.turn === p.baseTurn;
      const moved = !same();
      const o0 = S; if (p.redo && moved && S.prev) S = restorePrev(S);
      const still = same();
      if (still) send(p.said, p.span, p.note, { job: p.job, story: p.story, ruling: p.ruling, orig: p.redo && moved ? o0 : undefined }); else lsSet('hrpg:pending', null);
    }
    else {
      // 还没开写就刷新了：把玩家写的那句放回输入框
      if (p && S && p.saveId === S.id && p.said && !p.job && !p.story && Date.now() - p.at < 30 * 60e3) { const el = $('#said'); if (el && !el.value) el.value = String(p.said); }
      lsSet('hrpg:pending', null);
    }
  } catch (_) { lsSet('hrpg:pending', null); }
})();
