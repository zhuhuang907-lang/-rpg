<title>历史模拟RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap">
<style>
/* 版式：左边是和 GM 的对话（像聊天一样一来一往），右边是账册：局面、人物、家业、史线、地理、年谱。
   配色取「竹纸 + 墨 + 石青 + 朱印」：纸色偏青灰，石青作主色，朱色只用在印章与要紧处。 */
:root{
  --paper:#eef0ea; --sheet:#f8f9f5; --ink:#1d2421; --ink2:#4a524e; --mute:#7c847f; --rule:#d5dad2;
  --qing:#2c5f7c; --qing-soft:#dde8ee; --zhu:#b5372a; --zhu-soft:#f5e2de; --ochre:#9a7b2f; --ochre-soft:#f3ecd9;
  --good:#3d7a55; --good-soft:#e2efe6; --shadow:0 1px 2px rgba(20,30,28,.06),0 4px 14px rgba(20,30,28,.05);
  --f-title:"Ma Shan Zheng","Noto Serif SC","Songti SC",serif;
  --f-read:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-ui:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#131819; --sheet:#1b2224; --ink:#e4e8e3; --ink2:#b9c1bc; --mute:#86908b; --rule:#2e3739;
  --qing:#86b6d4; --qing-soft:#1f3340; --zhu:#e2725f; --zhu-soft:#3a2420; --ochre:#d2b15e; --ochre-soft:#332b17;
  --good:#7cc195; --good-soft:#1c3125; --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131819; --sheet:#1b2224; --ink:#e4e8e3; --ink2:#b9c1bc; --mute:#86908b; --rule:#2e3739;
  --qing:#86b6d4; --qing-soft:#1f3340; --zhu:#e2725f; --zhu-soft:#3a2420; --ochre:#d2b15e; --ochre-soft:#332b17;
  --good:#7cc195; --good-soft:#1c3125; --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font:15px/1.7 var(--f-ui);padding-inline:16px;padding-block:0 24px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:6px 12px;transition:background .12s,border-color .12s}
button:hover:not(:disabled){border-color:var(--qing)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--qing);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.main{background:var(--qing);border-color:var(--qing);color:var(--sheet);font-weight:600}
button.link{border:none;background:none;padding:2px 4px;color:var(--qing);text-decoration:underline;text-underline-offset:3px}
input,select,textarea{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical}
.muted{color:var(--mute)}
.wrap{max-width:1280px;margin:0 auto}

.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;border-bottom:1px solid var(--rule);margin-bottom:14px}
.brand{font-family:var(--f-title);font-size:28px;line-height:1;letter-spacing:.04em}
.brand small{font-family:var(--f-ui);font-size:12px;color:var(--mute);margin-left:8px;letter-spacing:0}
.top .sp{flex:1}
.status{font-size:13px;color:var(--ink2);font-family:var(--f-read);min-width:0}
.status b{color:var(--ink)}

.h{display:flex;align-items:center;gap:10px;margin:18px 0 8px;font-family:var(--f-read);font-weight:700;font-size:16px;letter-spacing:.08em;flex-wrap:wrap}
.h .seal{display:inline-grid;place-items:center;width:23px;height:23px;border:1.5px solid var(--zhu);color:var(--zhu);border-radius:3px;font-family:var(--f-title);font-size:16px;letter-spacing:0;flex:none}
.h .note{font-family:var(--f-ui);font-weight:400;font-size:12px;color:var(--mute);letter-spacing:0}

.start{max-width:780px;margin:0 auto}
.hero{padding-block:18px 6px}
.hero h1{font-family:var(--f-title);font-weight:400;font-size:40px;margin:0 0 6px;text-wrap:balance}
.hero p{margin:0;color:var(--ink2);max-width:64ch}
.ask1{display:flex;gap:8px;margin-top:16px}
.ask1 input{font-size:17px;padding:12px 14px}
.ask1 button{white-space:nowrap;padding:0 22px;font-size:16px}
.examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border-radius:16px;padding:4px 12px;font-size:13px;background:var(--sheet);text-align:left}
.saves{display:grid;gap:8px}
.save{display:flex;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;flex-wrap:wrap}
.save .t{flex:1;min-width:0}
.save .t b{display:block;font-family:var(--f-read)}
.save .t span{font-size:12px;color:var(--mute)}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.howto div{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink2)}
.howto b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}

.game{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:22px;align-items:start}
.chat{display:flex;flex-direction:column;gap:14px;min-width:0}
.msg{min-width:0}
.msg.gm{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px 18px}
.msg.gm.talk{background:var(--qing-soft);border-color:color-mix(in srgb,var(--qing) 30%,transparent)}
.msg.me{align-self:flex-end;max-width:80%;background:var(--ink);color:var(--paper);border-radius:12px 12px 2px 12px;padding:9px 14px;white-space:pre-wrap}
.msg .lab{font-size:12px;color:var(--qing);margin-bottom:4px;font-family:var(--f-read);display:flex;gap:8px;flex-wrap:wrap}
.msg .lab .tag{color:var(--mute)}
.text{font-family:var(--f-read);font-size:17px;line-height:1.9;max-width:42em}
.text p{margin:0 0 .75em}.text p:last-child{margin-bottom:0}
.custom{margin-top:14px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);padding:8px 12px}
.custom summary{cursor:pointer;font-size:14px;color:var(--qing);font-weight:600}
.cform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;margin-top:10px}
.cform label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink2)}
.cform .wide{grid-column:1/-1}
.cform input,.cform select,.cform textarea{font-size:14px}
@media (max-width:520px){.cform{grid-template-columns:minmax(0,1fr)}}
.intro{border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;line-height:1.75}
.intro .ih{font-family:var(--f-read);font-weight:700;color:var(--qing);margin-bottom:2px}
.intro b{color:var(--ink);font-weight:600;margin-right:6px}
.goalbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:-4px}
.goal{border:1px solid color-mix(in srgb,var(--qing) 30%,transparent);background:var(--qing-soft);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--ink2);text-align:left;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal b{color:var(--qing);margin-right:6px;font-weight:600}
.ex.goal{background:var(--qing-soft)}
.ex.wide{grid-column:1/-1}
.book{margin-top:10px;font-size:13px}.book summary{cursor:pointer;color:var(--mute);list-style:none;padding:4px 0}.book summary::before{content:'▸ ';}.book[open] summary::before{content:'▾ '}
.book .extras{margin-top:6px}
.fs{display:inline-block;font-size:11px;color:var(--qing);border:1px solid color-mix(in srgb,var(--qing) 35%,transparent);border-radius:4px;padding:0 4px;margin-right:6px;line-height:1.5}
.ex.refs a{color:inherit}
.feed{margin-top:10px;font-size:13px;color:var(--ink2)}.feed .fh{color:var(--mute);font-size:12px;margin-bottom:4px}.feed .fi{animation:fadein .4s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.msg.talk .text{font-family:var(--f-ui);font-size:15px;line-height:1.85}
.text[contenteditable="true"]{outline:2px dashed var(--ochre);padding:6px;border-radius:6px}
.caret::after{content:"▍";color:var(--qing);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.thinking{display:block;color:var(--ink2);font-size:14px;white-space:normal}
.thinking .dots{vertical-align:middle;margin-right:10px}
.thinking .link{margin-left:8px}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--qing);animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion: reduce){.dots i,.caret::after{animation:none}}
.extras{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.ex{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;background:var(--paper);font-size:13.5px;min-width:0}
.ex .eh{font-family:var(--f-read);font-weight:700;color:var(--qing);letter-spacing:.08em;font-size:13px}
.ex .eh span{font-family:var(--f-ui);font-weight:400;color:var(--mute);font-size:11px;letter-spacing:0;margin-left:6px}
.ex div+div{margin-top:3px}
.ex.life{background:var(--good-soft)}
.ex.news{background:var(--ochre-soft)}
.msgacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.hints{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.earlier{font-size:13px;color:var(--mute);text-align:center}

.composer{position:sticky;bottom:0;background:var(--paper);padding-block:10px 4px;border-top:1px solid var(--rule)}
.composer textarea{font-size:15px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.row select{width:auto}
.row .grow{flex:1}
.savest{font-size:12px;color:var(--good)}.savest.bad{color:var(--zhu)}

.side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:10px 14px 14px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin:0 -4px 6px;padding-bottom:6px;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:4px 7px;font-size:14px;border-radius:6px;color:var(--ink2)}
.tabs button.on{background:var(--qing-soft);color:var(--qing);font-weight:600}
.who{font-family:var(--f-read)}
.who .n{font-size:20px;font-weight:700}
.who .r{color:var(--mute);font-size:13px}
.who .w{color:var(--qing);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:10px}
.tile{border:1px solid var(--rule);border-radius:8px;padding:6px 9px;background:var(--paper)}
.tile .k{font-size:12px;color:var(--mute)}
.tile .v{font-family:var(--f-read);font-size:15px;font-weight:600;word-break:break-all;font-variant-numeric:tabular-nums}
.tile .why{font-size:11px;color:var(--mute);line-height:1.4}
.up{color:var(--good);font-size:11px;margin-left:3px}.down{color:var(--zhu);font-size:11px;margin-left:3px}
.grp{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:5px}
.grp .gk{width:5.5em;flex:none}
.bar{flex:1;height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--qing)}
.bar i.bad{background:var(--zhu)}.bar i.warn{background:var(--ochre)}.bar i.good{background:var(--good)}
.grp .gw{color:var(--mute);white-space:nowrap;min-width:3em}
.list{font-size:13.5px}
.list > div{border-bottom:1px dotted var(--rule);padding:6px 0}
.list b{font-weight:600}
.list .when{color:var(--qing);margin-right:6px;font-family:var(--f-read)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0}
.kv dt{color:var(--mute)}.kv dd{margin:0;min-width:0}
.pcs{display:grid;gap:8px}
.pc{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--paper)}
.pc .pn{display:flex;justify-content:space-between;gap:6px;align-items:center}
.pc .pn b{font-family:var(--f-read);font-size:15px}
.att{font-size:11px;border:1px solid var(--rule);border-radius:10px;padding:0 6px;color:var(--qing);white-space:nowrap}
.pc .pr{color:var(--mute);font-size:12px}
.pc .pl span{color:var(--mute);margin-right:4px}
.abil{margin-left:6px;font-size:11px;border:1px solid var(--rule);border-radius:3px;padding:0 4px;color:var(--ochre)}
.badge{font-size:11px;padding:0 7px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.b-todo{color:var(--ochre);background:var(--ochre-soft)}.b-doing{color:var(--qing);background:var(--qing-soft)}
.b-bad{color:var(--zhu);background:var(--zhu-soft)}.b-done{color:var(--good);background:var(--good-soft)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--mute);font-weight:500;border-bottom:1px solid var(--rule);padding:4px 6px 4px 0}
.tbl td{border-bottom:1px dotted var(--rule);padding:5px 6px 5px 0;vertical-align:top}
.tblwrap{overflow-x:auto}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.spark{margin-top:8px}.spark svg{width:100%;height:56px;display:block}
.overview{font-family:var(--f-read);font-size:14px;line-height:1.85;white-space:pre-wrap}
.mine{color:var(--zhu)}
.banner{white-space:pre-wrap;background:var(--ochre-soft);border:1px solid var(--ochre);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.err{white-space:pre-wrap;background:var(--zhu-soft);border:1px solid var(--zhu);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}

.closeSide{display:none}
@media (max-width: 960px){
  .game{grid-template-columns:minmax(0,1fr)}
  /* 手机：正文在前；册子收成顶上一行标签，点开铺满全屏，看完收起回到正文 */
  .side{position:sticky;top:0;z-index:20;max-height:none;order:-1;padding:4px 8px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .side.fold .tabs{border-bottom:none;margin-bottom:0;padding-bottom:0}
  .side .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .side .tabs button{flex:none}
  .side.fold .pane{display:none}
  .side:not(.fold){position:fixed;inset:0;z-index:60;overflow:auto;border-radius:0;padding:8px 14px 40px;border:none}
  .side:not(.fold) .tabs{flex-wrap:wrap}
  .side:not(.fold) .closeSide{display:inline-block;margin-left:auto;font-weight:600;color:var(--qing)}
}
@media (max-width: 520px){
  .ask1{flex-direction:column}.ask1 button{padding:10px}
  .top{gap:6px 10px;padding-block:8px;margin-bottom:8px}.brand{font-size:22px}
  .top .status{order:3;flex-basis:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
  .msg.gm{padding:12px 14px}.text{font-size:16.5px;line-height:1.85}
  .composer textarea{font-size:16px;min-height:0}
  .extras{grid-template-columns:minmax(0,1fr)}
  .composer .savest{display:none}.composer label.muted{font-size:12px}
  .hero h1{font-size:32px}
  .msg.me{max-width:92%}
  .h .note{flex-basis:100%;margin-left:33px}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">历史模拟<small>网页版</small></div>
    <div class="status" id="statusLine"></div>
    <div class="sp"></div>
    <button id="bHome" hidden>换一局</button>
  </header>
  <div id="notice"></div>
  <main id="app"></main>
</div>

<script>
'use strict';
/* ========== 小工具 ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cut = (s, n) => { const t = String(s ?? '').replace(/[ \t]+/g, ' ').trim(); return t.length > n ? t.slice(0, n) + '……' : t; };
const one = (s, n) => cut(String(s ?? '').replace(/\s+/g, ' '), n);
const arr = v => (Array.isArray(v) ? v : []);
const clone = o => JSON.parse(JSON.stringify(o));
const num = v => (v === null || v === '' || v === undefined || !Number.isFinite(Number(v)) ? null : Number(v));
const lsGet = k => { try { return localStorage.getItem(k); } catch (_) { return null; } };
const lsSet = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (_) { /* 无存储 */ } };
const fmtN = (n, u) => (n == null || !Number.isFinite(Number(n)) ? '未定' : Number(n).toLocaleString('zh-CN', { maximumFractionDigits: 2 }) + (u || ''));
const N0 = v => { const t = String(v ?? '').replace(/[,，\s]/g, ''); if (!t) return null; const x = Number(t); return Number.isFinite(x) ? x : null; };
const bytes = s => { try { return new TextEncoder().encode(s).length; } catch (_) { return s.length * 3; } };

/* ========== 真实农历（月表：公元前221年—1912年，天文推算） ========== */
const CAL = (() => {
  let months = [], first = new Map();
  try {
    for (const [y, lens, leapPos] of JSON.parse($('#cal').textContent)) {
      first.set(y, months.length); let n = 0;
      for (let i = 0; i < lens.length; i++) { const leap = i === leapPos; if (!leap) n++; months.push({ y, m: n, leap, days: lens[i] === '1' ? 30 : 29 }); }
    }
  } catch (_) { months = []; }
  const toA = y => (y < 0 ? y + 1 : y), fromA = y => (y <= 0 ? y - 1 : y);
  function idx(y, m, leap) {
    const f = first.get(toA(y)); if (f == null) return -1;
    for (let i = f; i < months.length && months[i].y === toA(y); i++) if (months[i].m === m && months[i].leap === !!leap) return i;
    return leap ? idx(y, m, false) : -1;
  }
  function addDays(c, n) {
    let { y, m, d } = c; let i = idx(y, m, c.leap);
    if (i < 0) { d += n; while (d > 30) { d -= 30; m++; if (m > 12) { m = 1; y++; if (y === 0) y = 1; } } return { y, m, d, leap: false }; }
    d = Math.min(d, months[i].days) + n;
    while (d > months[i].days) { d -= months[i].days; i++; if (i >= months.length) return { y: fromA(months[i - 1].y) + 1, m: 1, d: 1, leap: false }; }
    return { y: fromA(months[i].y), m: months[i].m, d, leap: months[i].leap };
  }
  const MC = ['', '正月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '腊月'];
  const N = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
  const dayName = d => (d <= 10 ? '初' + N[d] : d < 20 ? '十' + N[d - 10] : d === 20 ? '二十' : d < 30 ? '廿' + N[d - 20] : '三十');
  const label = (m, d, leap) => (leap ? '闰' : '') + (MC[m] || m + '月') + (d ? dayName(d) : '');
  /** 两个日子之间跨了几个月（闰月也算一个月） */
  function monthsBetween(a, b) { const i = idx(a.y, a.m, a.leap), j = idx(b.y, b.m, b.leap); return i >= 0 && j >= 0 ? j - i : (b.y * 12 + b.m) - (a.y * 12 + a.m); }
  return { addDays, label, monthsBetween };
})();
const yearText = y => (y < 0 ? '公元前' + -y + '年' : '公元' + y + '年');
const timeText = c => `${c.yearLabel || ''}（${yearText(c.y)}）${CAL.label(c.m, c.d, c.leap)}`;
const season = m => '春春春夏夏夏秋秋秋冬冬冬'[(m - 1) % 12] || '';

let SETTINGS = { len: 'normal', tier: 'default', check: true };

function storyRules() {
  return `你在和玩家一起写一个人在真实历史里的一生。玩家说主角做什么，你写那个年代的世界怎么回应：身边的人怎么说、怎么想、怎么做，事情怎么一步步起变化。你写世界和别人，不替主角想、不替主角说。

头一条：玩家说的，就是主角做的。照办、写透，不打折扣、不改成别的、不追加主角没说的决定和话。玩家想做什么都行——违法的、越权的、离经叛道的、远走他乡的、改行的都行；你只管写这件事在那个年代真实地会怎样：谁看见了、谁怎么回应、得了什么失了什么、留下什么后患。成不成看真实情形，不看剧情需要。

怎么写
· 像《大明王朝1566》《雍正王朝》那样的历史正剧：一场一场地写，有人、有对话、有来有往。叙述短，人物的话里有身份、有脾气、有算盘、有潜台词；官场有官腔，市井说市井话，家里说家常话。称主角为「你」。
· 先接上一回的末尾和玩家这一步，把这一步办下去、写透，再写由此带出的直接反应。玩家只说了个大概，就照常理办下去，不追问。别替主角做他没说的决定。
· 节奏：玩家这一步要花几个时辰、几天的，琐碎处概括带过，直接写到下一个转折；每一回都要有至少一件改变了局面、回不去的事，和至少一条主角原先不知道的新消息。
· 悬而未决的事不会一直等主角：玩家连着两回没理会别人的催问，别人就照自己的盘算替他办了或越过他去，后果照来。不要连着两回停在同一个问题上。
· 天下大事按真实的日子到来（看【内置史料】里的「本月之内」「将要发生」）：玩家这一步跨过了那个日子，就写到那一天，让它砸进主角的日子里——他看见、听见、被卷进去的那一部分。
· 好看的是人。每个人有出身、处境、性格、本事和私心，照自己的盘算行事：吩咐下去的事会去办，办得怎样看本事和私心——打折扣、捞好处、揽功诿过、瞒报，也可能办得比预想好。头一次出场交代他是谁、和主角什么关系。
· 历史的质感在具体，也在规矩：公事写到哪个衙门、什么职衔、走什么文书、按什么程序与惯例，人们怎么称呼彼此；市井写到哪条街、哪个行当、怎么讲价；这些照【制度框架】【本地志】【场景简报】【年代志】【这一回联网查到的资料】【内置史料】来，用在动作和对话里，不讲解、不掉书袋。人物用那个年代人的心思想事。
· 日子本身就是内容：时间一过，家人长大变老、婚嫁生死，亲友同僚升迁落魄，年景市面随季节变，消息按路程和身份迟到、走样地传来。多数是小事，自然带出。
· 钱粮细账、运输、行情归账房，正文只在要紧时提一句数目。

规矩
· 不拦、不说教、不劝。【推演】只是参考别人会怎么反应、客观上要多久花多少；主角自己的言行永远照玩家说的写。后果照真实情形——谁知道、他们的利害与胆量、此时的吏治风气；坏事不必遭报应，好事不必有好报。
· 玩家从不被一件事困住。他躲开、拖着、交给别人、远走他乡都行，你顺着写，不用巧合拉回来。找上门的事少而有分量，敌意只来自真实的利害。
· 史实、人物、官制、地名以给你的材料为准，不编史书没有的大事，不造官名，不搬别朝的制度；本局被改写过的照【被改写的历史】与【将要发生】里的「已变」「新出」。小人物见不到大人物，不把无关的真人扯到主角身边，虚构人物不与真人同名。【制度框架】里写着的易错处一律不犯。
· 打仗、出行、派人、贩运都写到具体的县城、关隘、渡口、驿站和里程，照【县级地理】与【地理册】；不在其中的地方不要编县名。
· 路程按真实里程：步行日行五六十里，骑马百里上下，驿递三四百里，漕船顺水日行百里左右、逆水减半。头一次去一个地方，顺带写出方向、远近、行程。
· 打仗照真实军事：兵力、粮草、行军日程、地形天候、军情、士气，胜负看实力与应变；打下地方后民心低、要分兵驻守和派人治理，劫掠失人心、屠城招恶名，降将要防，邻近势力会警觉；名义上还是臣子的擅自兴兵是大罪。
· 升迁降黜照本朝规矩和时日：看出身、资历、考课、举荐、空缺、派系，越级要有缘由。任免写明什么官、几品、管什么。
· 主角会老会病会死；死了由继承人接着，正文写明是谁。

不要：清单、小标题、粗体、分隔线、括号里的按语注释或自我更正、「你可以……」的选项、替玩家总结；现代词与现代观念；「空气仿佛凝固」「嘴角勾起」「嘴角微微上扬」「眼中闪过一丝」「不禁」「一丝」「眸子」「深吸一口气」「意味深长」「空气中弥漫着」「命运的齿轮」「心中暗想」「仿佛」「似乎在诉说」「这一切」这类套话。
· 不用感悟句收尾（「你知道，这只是开始」「风暴正在酝酿」「一切才刚刚开始」）：停在一句对话或一个动作上。
· 不要一段一个比喻；不要把人物心思直接说破，让他的话和动作露出来。
· 别人照自己的利害和性情回应：该痛快答应的就答应，有好处的会凑上来，有顾忌的推诿、讨价还价，另有算盘的表面应承；不为了制造阻碍而阻碍，也不为了顺利而顺从。
· 不要把查到的史料整段搬进来，也不要借人物之口讲解制度；一个场面里用一两处就够，用得准比用得多要紧。

笔法（只学节奏、写法和分寸；用词、称呼、器物、钱的单位一律按本局的年代，不照搬下面的字眼）：
——卖布的把那匹布往案上一抖，灯底下泛出一层光。「您瞧这织口，城里能织到这个份上的不出五家。」你没接话，捻了捻边角。他便压低了声音：「去年冬天是这个价，今年丝贵，再少小店就赔了。」门外挑担的吆喝着过去了。你还了个价。他咂了下嘴，回头冲里头喊：「取秤来，给这位记上。」
——屋里只点了一盏灯。管文书的那人把簿子翻到夹着纸条的那页，不先说话，只用指甲在一个数目底下划了一道。「今年上头催的数，比去年多出这一截。」他抬眼看你，「这一截怎么补，补了谁记情，没补谁记仇，您得先拿个主意。」窗外传来更鼓声。
——你进门时，母亲正坐在灶下添柴，见了你也不起身，只问：「吃过没有？」你说吃过了。她「嗯」了一声，过了一会儿又说：「西头王家的二丫头，今年十六了，你见过的。」灶膛里噼啪响了一下。父亲在里屋咳嗽，咳完了隔着帘子说：「你娘的意思，你自己掂量。」

戏里与戏外
· 玩家是在跟你商量（问历史、地理、局面、某人是谁、请你分析利弊）时，回答第一行只写「【戏外】」，换行后像熟读史书、肯说实话的朋友那样直接、详细地答，可以分析几条路子各自的代价；不推进时间。两种都有时，先一两句答戏外，再写戏里（不写「【戏外】」）。

输出
· 戏里正文约${LEN[SETTINGS.len] || LEN.normal}（过一段较长的日子可以长些），停在一个自然的地方：有人等你回话、一件事摆在面前、或这段日子告一段落。
· 直接写正文，不加标题、不加代码块。写完后若有玩家看不到的真相（谁在瞒报、谁打什么主意、某事的真相与后续），另起一行写「【幕后】」，一两句；没有就不写。`;
}

/** 账房的规则：照正文记账、核史实，只出 JSON */
function ledgerRules() {
  return `你是这局历史模拟游戏的账房兼史官。主持人刚写好这一回的正文（下面给出）。你的事：照正文把账册更新，再把正文的史实核一遍。只记正文里发生了的事和照理必然发生的事（过了月份的收支、按史书此时发生的天下大事、行情随季节的涨落），不要改剧情、不要添正文没有的情节。

记账规则：
1. elapsedDays：这一回正文里过了多少天（一场谈话 0–1 天；按正文说的时间算）。yearLabel：过完后的年号纪年。主角搬到别处常住才填 moveTo（新地方的全称）；搬到了另一个政权的地界（投奔、逃亡、出使后留下）再填 moveToPolity（那个政权的名字，如「金」「北魏」）。
2. 一切量化，数字用阿拉伯数字。钱一律折成【家业账】的本位单位。现钱由程序结算——你不报现钱，只把本回合正文里每一笔钱的进出（买卖、工钱、赋税摊派、送礼打点、借贷、赏赐、被偷被抢、事业投入与收获……）在 ledger 里一笔一笔报，收入为正、支出为负，与正文的数对得上；正文没写数但确实花了钱的，按【本地行情】估一个合理的数。每月固定的进出写在 estate 的 income / expense（每月多少），程序过月自动结，不要再在 ledger 里重复报月收支。若【家业账】写着现钱尚未定数，用 setCash 给出现钱多少。
3. 产业（田地、铺面、宅子、作坊、船、牲口、存货、借出的钱）有数量与估值；在做的事业有状态、进度、下一步。estate 里给出的组整组替换，没变化的组不给。本地行情随季节、年景、战事变化时在 prices 里给出（米、麦、布、盐、肉、田价、房价、雇工日钱、银钱比价等）。
4. meters：这个身份要紧的五六项数值（值里带数，如「存粮 120 石」），有变化才给，写变化方向和原因。groups：人群对主角的满意度 0–100。presentNpcs：本回合出场或有变化的人，favor 是对主角的好感（-100 到 100），随来往增减。
5. lifeEvents：身边人和世界的变化（谁、怎么了）；household：家里人口变化；orders：交代下去的事和办的结果（在办/办妥/办砸/搁下）；deeds：玩家这回做的、可能有后续的事，deedsDone：以前的作为在本回合有了下文的（开头几个字）。
6. worldEvents：这段时间里按史书发生、或正文里传来的天下大事（年月；被本局改变的写实际样子，changed 填 true）；【按史书将要发生】快用完时，在 worldUpcoming 补上之后五年按史书会发生的大事。historyChanges：玩家使史书上的事没照原样发生时记下。
7. places：正文里头一次出现的地方（当时名称、今地、隶属、在主角现居地的方位里程与行程）。
8. powers / territory / forces：势力、主角的地盘与兵马有变化时整组给出（地盘按县、州府一处一条写当时的名称，兵马的驻地写到县城或关隘）（兵额、存粮石数、户口、民心 0–100、月赋都写数字）。succession：只在主角死去时填。career / careerEvents：主角的官职、品级、差遣、称号、职权、上司属下、考课、可能的下一步有变化时给出；任免升降考课等记 careerEvents。statusChanges：功名、爵位、健康、名望等的变化。
9. gmNotes：正文后【幕后】里写的真相，以及你看出的伏笔（玩家看不到）；gmNotesDone：已经浮出或了结的（开头几个字）。
10. hints：四五条，玩家接下来可以做的事，一句一条，方向要拉开：一条顺着眼下的事，一条反着来或换个办法，一条完全另起炉灶的大胆路子（离开此地、改行、投奔某人、冒险一搏、做件出格的事），一条戏外可以问的问题。
11. canon：本回合新确立、以后必须一直成立的事实（身份名分、婚姻亲属、产权契约、承诺约定、结下的恩怨、谁知道了什么秘密、主角立下的规矩），一句一条，没有就 []；canonDone：已经不再成立的（开头几个字）。
12. lookups：下一回合写之前值得联网查证的，三条以内，写成搜索词：玩家接下来多半要碰到的真人此时的官职去向、正在发生或将要传来的事的时间与经过、主角要去的地方此时的隶属与名称、本行的制度门道与物价、本地此时的官与士绅，如「海瑞 万历十三年」「明代 苏州府 织造局」；没有就 []。
13. localFigures：从【联网查到的资料】里认出的、此时在主角所在地方或与主角处境相关的真实人物（本地的官、士绅、名士、商人、僧道等），资料里确有其人才记，写明此时的身份与出处；没有就 []。
14. almanac：从这一回【联网查到的资料】里整理出的、【年代志】里还没有的事实，一句一条（带年份、地名、人名、数目），按人物/官制/地方/物价/风俗/时事/器物归类，写明出处；资料里确实写着才记，小说演义影视的不收；五到十二条，没有就 []。
16. goals：主角眼下可以奔的目标，每回都给齐三条——「眼下」（这几天到一个月内的一件具体的事）、「今年」（今年之内的一件事）、「长远」（这一生想成的事）。贴着主角此刻的身份、处境、性情和玩家这些回合的取向（玩家往哪个方向走，目标就跟着往哪儿长），要具体、够得着、有那个年代的样子（如「赶在秋粮入仓前把那二十亩田的契约过户」「今年考取生员」「让汪家在扬州盐商里排进前八家」），不要空话。上一回的目标照旧的标「在做」；这一回做成了标「达成」、彻底没指望了标「落空」，并补上新的同一档目标（status「新」）。这不是任务，玩家可以不理。
15. turnSummary：本回合事实摘要，120 字内。worldShift：玩家这回做的事若可能波及更大的局面（杀了或救了要紧人物、占了一地、改了一项大政、截了一笔军饷、结交或得罪了权要……），一句话写出来，程序会据此推演天下；小事留空。

史实核查（fixes）：逐句核对正文，只找确凿的硬伤——本朝本年不该有的官名、衙门、地名或隶属，违背【制度框架】的职衔、文书、程序、称谓；此时已死或尚未出生、不在此地、不任此职的真实人物；年号、干支、节令错误；本朝还没有的器物、作物、制度；离谱的物价或钱粮单位；现代词语。不改文风、不改虚构人物、不改情节，拿不准的不算。每处给出原文里错的那几个字（原样摘出，十二字以内，必须能在正文里找到）和改成什么。

只输出一个 JSON 对象，不加代码块、不加说明。没有变化的项给 [] 或省略：

  return `你是一位通晓历代史事、深明因果的史家，替一局历史模拟游戏推演天下大势。现在是${timeText(s.clock)}。主角：${p.name}，${p.role}，在${s.place.full}（${s.place.polity || ''}）。上次推演：${w.tickAt ? w.tickAt.label : '（这是第一次）'}。

推演的道理：
1. 史书有惯性：本局没有动到的地方，一切照史书发生——时间、地点、人物、结局都照史实，不要因为「要有变化」而改。
2. 动到了才变，变化顺着因果走：主角的作为（下面列着）、被改写的历史、本局的势力格局，会沿着人事、钱粮、军情、消息一层层传开；传得多远、多快、多大，与事情的分量和主角的地位相称——小民的小事很少惊动朝廷，杀掉或救下一个要紧人物、占据一地、截断一条粮道、改了一项大政，才会改写一方或天下的走向。消息传到要时日，别人做出反应也要时日。
3. 大势难改，人事易变：财政、天灾、边患、土地兼并、军制这类根子上的原因还在，史书上的大事即使换了人、换了时间、换了地点，也多半会以别的样子发生（比如领头的人没了，会有别人顶上）；只有根子被动了，大势才会真正转向。
4. 别人也在动：各方势力、朝中各派、真实人物都照自己的利害对本局的变化作出反应——警觉、拉拢、打压、趁乱、观望。

/** 推演一次：成功就替换将来的史线、人物、大势，并把有变化的列出来 */
async function worldTick(s) {
  const { text } = await callClaude(worldInput(s), null, { maxTokens: 8000, temperature: 0.4, kind: '推演' });
  const d = parseJSON(text);
  if (!d || !Array.isArray(d.upcoming)) throw { code: 'bad_json' };
  const w = s.world, nowYM = ymOf(s.clock), old = arr(w.upcoming);
  const up = d.upcoming.filter(u => u && u.text).map(u => ({ y: num(u.y) ?? s.clock.y, m: Math.min(12, Math.max(0, num(u.m) || 0)), text: one(u.text, 100), status: /变/.test(u.status || '') ? '已变' : /新/.test(u.status || '') ? '新出' : '照史', why: one(u.why, 100) }))
    .filter(u => evYM(u) > nowYM && u.y <= s.clock.y + 10).sort((a, b) => a.y - b.y || a.m - b.m).slice(0, 20);   // 推演只管眼下十年，太远的不算数
  const report = [];
  for (const u of up) if (u.status !== '照史' && !old.some(o => o.status === u.status && one(o.text, 10) === one(u.text, 10))) report.push({ text: `${u.y}年${u.m ? u.m + '月' : ''}：${u.text}`, status: u.status, why: u.why });
  for (const o of old) if ((!o.status || o.status === '照史') && !up.some(u => one(u.text, 8) === one(o.text, 8)) && evYM(o) > nowYM + 1) {
    const alt = up.find(u => u.status !== '照史' && u.y >= o.y - 1 && u.y <= o.y + 2);
    if (!alt) report.push({ text: `${o.y}年${o.m ? o.m + '月' : ''}：${o.text}`, status: '不再照史', why: '' });
  }
  if (hasHist(s)) {
    w.over = w.over || {}; w.extra = arr(w.extra);
    report.length = 0;
    for (const u of d.upcoming) {
      if (!u || !u.text) continue;
      const key = String(u.key || '').replace(/^\[|\]$/g, '');
      const st = /取消|不会/.test(u.status || '') ? '取消' : /变/.test(u.status || '') ? '已变' : /新/.test(u.status || '') ? '新出' : '照史';
      if (key && st !== '照史' && histEvents(s, nowYM - 1, nowYM + 72).some(e => e.key === key)) {
        const prev = w.over[key];
        w.over[key] = { status: st, text: one(u.text, 100), why: one(u.why, 100), needs: one(u.needs, 80), y: num(u.y), m: num(u.m) };
        if (!prev || prev.status !== st || prev.text !== w.over[key].text) report.push({ text: `${u.y || ''}年${u.m ? u.m + '月' : ''}：${one(u.text, 100)}`, status: st, why: one(u.why, 100) });
      } else if (!key && st === '新出') {
        const x = { y: num(u.y) ?? s.clock.y, m: Math.min(12, Math.max(0, num(u.m) || 0)), text: one(u.text, 100), status: '新出', why: one(u.why, 100), needs: one(u.needs, 80), grade: 'C' };
        x.key = 'n' + x.y + ':' + x.text.slice(0, 14);
        if (evYM(x) > nowYM && x.y <= s.clock.y + 10 && !w.extra.some(o => o.key === x.key)) { w.extra.push(x); report.push({ text: `${x.y}年${x.m ? x.m + '月' : ''}：${x.text}`, status: '新出', why: x.why }); }
      }
    }
    w.extra = w.extra.filter(x => evYM(x) > nowYM - 12).slice(-30);
    s.figOver = s.figOver || {};
    // 推演说某人死了：只有比史书早才记（记当年）；说某人活着：只记「到某年还活着」，不让他长生不老；官职改动记年份，史料里更晚的任命照样生效
    const dataFig = n => { for (const h of HALL(s)) { const f = arr(h.figures).find(x => x.name === n); if (f) return f; } return null; };
    for (const f of arr(d.figures)) if (f && f.name) {
      const k = one(f.name, 10), o = s.figOver[k] || {}, df = dataFig(k), y = s.clock.y;
      const n = { ...o, note: one(f.note || f.stance, 60) || o.note || '' };
      const pst = one(f.post, 40);
      if (pst && (!df || pst !== (figState(s, df, y, s.clock.m).post || ''))) { n.post = pst; n.postY = y; }
      if (f.alive === false && (!df || df.died == null || df.died > y) && o.deadY == null) { n.dead = true; n.deadY = y; }
      if (f.alive === true && df && df.died != null && df.died <= y && arr(s.history).length) n.aliveY = y;
      s.figOver[k] = n;
    }
    syncHist(s);
    d.figures = null;
  } else if (up.length) w.upcoming = up;
  if (d.overview) w.overview = cut(d.overview, 700);
  if (Array.isArray(d.figures) && d.figures.length) s.figures = d.figures.filter(f => f && f.name).slice(0, 18).map(f => ({ name: one(f.name, 10), post: one(f.post, 40), age: num(f.age), where: one(f.where, 20), stance: one(f.stance, 40), alive: f.alive !== false, note: one(f.note, 60) }));
  const rp = arr(d.ripples).filter(r => r && r.cause && r.effect && !arr(w.ripples).some(o => one(o.effect, 12) === one(r.effect, 12))).slice(0, 6).map(r => ({ turn: s.turn, cause: one(r.cause, 60), effect: one(r.effect, 100), when: one(r.when, 20) }));
  w.ripples = arr(w.ripples).concat(rp).slice(-40);
  const moves = arr(d.npcMoves).filter(m => m && m.name && m.did).slice(0, 6).map(m => ({ name: one(m.name, 12), did: one(m.did, 100), why: one(m.why, 60), plan: one(m.plan, 60) }));
  for (const m of moves) {
    const o = s.people[m.name]; if (o) { o.status = m.did; if (m.plan) o.plan = m.plan; }
    s.chronicle.push({ turn: s.turn, when: `${s.clock.yearLabel || ''}${CAL.label(s.clock.m, 0, s.clock.leap)}`, who: m.name, what: m.did });
  }
  const rows = (a, n) => a.filter(x => x && typeof x === 'object').slice(0, n).map(x => Object.fromEntries(Object.entries(x).map(([k, v]) => [k, one(v, 60)])));
  if (Array.isArray(d.powers) && d.powers.length) s.powers = rows(d.powers, 16).filter(x => x.name);
  if (Array.isArray(d.factions)) { const f = rows(d.factions, 10).filter(x => x.name); if (f.length) s.factions = f; }
  w.tickAt = { ym: nowYM, turn: s.turn, label: timeText(s.clock) };
  return { changes: report.slice(0, 8), ripples: rp, moves, overview: cut(d.overview, 600) };
}

/** 长局不走样：摘要多了，把最早的三十回合压成一章，章节一直带着 */
async function compactMemory(s) {
  const old = arr(s.summaries).slice(0, 30);
  if (old.length < 30) return;
  let text = '';
  try {
    const r = await callClaude(`把下面这局历史模拟游戏较早的三十回合经过，压成一段四百字以内的章节摘要：按时间先后，只留事实（谁、何时、在哪、做了什么、结果、钱粮与名位的变化、结下的恩怨与约定），不加评论，不丢要紧的人名地名数目。只输出摘要正文。\n\n主角：${s.protagonist.name}，${s.protagonist.role}\n\n` + old.map(x => `第${x.turn}回合（${x.when}）：${x.text}`).join('\n'), null, { json: false, maxTokens: 1500, temperature: 0.2, kind: '修史', fast: true }, 'quick');
    text = cut(String(r.text || '').trim(), 500);
  } catch (e) { if (e && e.code === 'cancelled') return 'cancelled'; }
  if (text.length < 40) text = cut(old.map(x => x.text).join('；'), 500);
  s.chapters = arr(s.chapters).concat([{ from: old[0].when, to: old[old.length - 1].when, text }]);
  while (s.chapters.length > 12) { const [a, b] = s.chapters; s.chapters.splice(0, 2, { from: a.from, to: b.to, text: cut(a.text + '；' + b.text, 700) }); }
  s.summaries = s.summaries.slice(30);
}

/* ========== 账册 → 给 AI 的材料 ========== */
function blocks(s, forStory) {
  const p = s.protagonist, c = s.clock, L = [], id = IDM[s.idm] || IDM.commoner;
  L.push(`【此刻】${timeText(c)}，${season(c.m)}。主角现居：${s.place.full}（${s.place.polity || ''}）。`);
  const st = Object.entries(s.status || {}).map(([k, v]) => `${k}：${v}`).join('；');
  L.push(`【主角】${p.name}，${p.gender || ''}，${p.age != null ? p.age + '岁' : '年岁不详'}，${p.role}${p.nativePlace ? '，' + p.nativePlace + '人' : ''}${p.real ? '，史载真人' : '，虚构人物'}。${st ? '名位功名等：' + st + '。' : ''}`);
  const hh = arr(s.household);
  if (hh.length) L.push('【家里人】' + hh.map(m => `${m.relation} ${m.name}${m.age != null ? '（' + m.age + '岁）' : ''}${m.dead ? '，已故' : m.away ? '，不在家' : ''}${m.note && !m.dead ? '，' + m.note : ''}`).join('；'));

  if (forStory) L.push(`【家底（细账归账房，正文不必盘账）】现钱 ${mo.cash == null ? '未定' : fmtN(mo.cash, u)}；产业：${arr(e.assets).map(a => a.name + (a.qty ? a.qty : '')).slice(0, 8).join('、') || '无'}${arr(e.projects).length ? '；在做：' + e.projects.map(x => x.name + '（' + x.status + '）').join('、') : ''}`);
  else L.push(`【家业账（以此为准；本位单位：${u}；现钱由程序结算）】现钱：${mo.cash == null ? '尚未定数——本回合用 setCash 给出现钱多少（数字）' : fmtN(mo.cash, u)}`
    + '\n产业：' + (arr(e.assets).map(a => `${a.name}${a.qty ? ' ' + a.qty : ''}${N0(a.value) != null ? '，估值' + fmtN(a.value, u) : ''}${a.note ? '（' + a.note + '）' : ''}`).join('；') || '无')
    + '\n每月进项：' + (arr(e.income).map(x => `${x.item} ${fmtN(x.amount, u)}`).join('；') || '无') + '\n每月开销：' + (arr(e.expense).map(x => `${x.item} ${fmtN(x.amount, u)}`).join('；') || '无')
    + `\n每月净得：${fmtN(inc - exp, u)}`
    + '\n在做的事业：' + (arr(e.projects).map(x => `${x.name}（${x.status}${x.progress ? '，' + x.progress : ''}）`).join('；') || '无'));
  if (!forStory && arr(s.prices).length) L.push('【本地行情（以此为准，有变化在 prices 里给出）】' + s.prices.map(x => `${x.item} ${fmtN(x.price, u)}/${x.per || ''}`).join('；'));
  // 「家资」「现钱」这类数值条以程序结算的现钱为准（账房当初写下的数会过时）
  const cashNow = mo.cash != null ? fmtN(mo.cash, u) : null;
  const ms = Object.entries(s.meters || {}).map(([k, v]) => cashNow && /^(家资|现钱|现银|钱财|银钱|积蓄|家财)/.test(k) ? [k === '家资' ? '现钱' : k, { ...v, value: cashNow }] : [k, v]), gs = Object.entries(s.groups || {});
  L.push(ms.length ? '【数值条】' + ms.map(([k, v]) => `${k}：${v.value}`).join('；') + (gs.length ? '\n人群：' + gs.map(([k, v]) => `${k} ${v.value}`).join('；') : '')
    : `【数值条（本回合在 meters、groups 里给出初值）】这个身份看：${id.meters}；人群：${id.groups}。`);

/** 现钱走势：一条小折线 */
function spark(h) {
  if (h.length < 2) return '';
  const w = 340, ht = 56, xs = h.map(x => x.cash), lo = Math.min(...xs), hi = Math.max(...xs), span = hi - lo || 1;
  const pts = h.map((x, i) => `${(i / (h.length - 1) * (w - 8) + 4).toFixed(1)},${(ht - 6 - (x.cash - lo) / span * (ht - 14)).toFixed(1)}`).join(' ');
  return `<div class="spark"><svg viewBox="0 0 ${w} ${ht}" role="img" aria-label="现钱走势"><polyline points="${pts}" fill="none" stroke="var(--qing)" stroke-width="2"/><circle cx="${pts.split(' ').pop().split(',')[0]}" cy="${pts.split(' ').pop().split(',')[1]}" r="3" fill="var(--qing)"/></svg><div class="muted">现钱走势：第${h[0].turn}回合 ${esc(fmtN(h[0].cash))} → 第${h[h.length - 1].turn}回合 ${esc(fmtN(h[h.length - 1].cash))}（最低 ${esc(fmtN(lo))}，最高 ${esc(fmtN(hi))}）</div></div>`;
}

/* ========== 动作 ========== */
let PHASE = '', TICKMSG = '', LOOKST = null;
async function startGame(sentence, have, havePre, custom) {
  custom = String(custom || '').trim();
  sentence = String(sentence || '').trim(); if (!sentence || BUSY) return;
  ERRMSG = ''; STREAM = ''; PHASE = ''; if (!have) FEED = [];
  CTL = new AbortController(); TURN = CTL;
  setBusy(true);
  let st = have || null, looked = null, pre = havePre || null, ledP = null;
  try {
    if (!st && !pre && canSearch()) {
      PHASE = 'search'; render();
      pre = { research: [], almanac: [], wikiDone: [], turn: 0, clock: { y: 0, m: 1, d: 1, yearLabel: '' }, place: { full: '' } };
      const oq = openingQueries(sentence);
      [looked] = await Promise.all([doLookups(pre, oq), wikiRead(pre, [sentence.replace(/^(我想当|当|做)/, '').replace(/的.*$/, ''), ...oq.slice(2, 4).map(q => q.split(/\s+/)[0])])]);
      pre.place = { full: '' }; pre.title = sentence;
      PHASE = ''; render();
    }
    if (!st) {
      const sys = MODE === 'local';
      DRAFTN = 0; PHASE = 'draft'; render();
      const { text } = await callClaude(openingStoryInput(sentence, sys, custom) + (pre && arr(pre.almanac).length ? '\n\n' + almanacBlock(pre) : '') + (pre && pre.research.length ? '\n\n' + researchBlock(pre) : ''), draftCb, { json: false, temperature: 1.1, maxTokens: 6000, system: sys ? storyRules() : '' });
      let draft = splitStory(text);
      if (draft.text.length < 40) {
        const r2 = await callClaude(openingStoryInput(sentence, sys, custom) + (pre && arr(pre.almanac).length ? '\n\n' + almanacBlock(pre) : ''), draftCb, { json: false, temperature: 1.1, maxTokens: 6000, system: sys ? storyRules() : '' });
        draft = splitStory(r2.text);
        if (draft.text.length < 40) throw { code: 'empty_completion' };
      }
      PHASE = 'verify'; render();
      const oy = sentenceYear(sentence);
      // 核实和立账册一起做：账册照初稿立，核实改掉的字再照改到账里
      if (MODE === 'local') { ledP = callClaude(openingLedgerInput(sentence, draft.text, draft.hidden, custom), null, { maxTokens: 8000, temperature: 0.3, kind: '立账' }); ledP.catch(() => { /* 下面 await 时再处理 */ }); }
      const vr = await verifyText({ ...(pre || {}), research: arr(pre && pre.research), almanac: arr(pre && pre.almanac), clock: { y: oy ?? 0, m: 6, d: 1, yearLabel: '' }, place: { full: '', polity: '' }, protagonist: { name: '', role: sentence }, chat: [], world: {}, figOver: {}, turn: 0, noTime: oy == null, yearOnly: oy != null }, sentence + (custom ? '\n' + custom : ''), draft.text);
      draft.text = vr.text; draft.audit = vr.audit; st = draft;
    }
    STREAM = st.text; PHASE = 'ledger'; render();
    LAST_ACTION = () => startGame(sentence, st, pre, custom);
    let lt = '';
    try { if (ledP) lt = (await ledP).text; } catch (e) { if (e && e.code === 'cancelled') throw e; }
    ledP = null;
    let d = parseJSON(lt);
    if (d && d.setup && arr(st.audit).length) d = auditSweep(d, st.audit);
    if (!d || !d.setup) d = parseJSON((await callClaude(openingLedgerInput(sentence, st.text, st.hidden, custom), null, { maxTokens: 8000, temperature: 0.3, kind: '立账' })).text);
    if (!d || !d.setup) throw { code: 'bad_json' };
    const s = newSave(d.setup);
    if (d.world) s.world = { overview: cut(d.world.overview, 600), events: arr(d.world.events).filter(x => x && x.text).map(x => ({ y: num(x.y) ?? s.clock.y, m: num(x.m) || 0, text: one(x.text, 100) })).slice(-40), upcoming: [] };
    d.worldUpcoming = arr(d.worldUpcoming).concat(arr(d.world && d.world.upcoming));
    if (hasHist(s)) {
      const now = ymOf(s.clock);
      s.world.events = histEvents(s, now - 120, now - 1).map(e => ({ y: e.y, m: e.m, text: e.text, key: e.key }));   // 本月的还没算发生
      const el = eraLabel(s, s.clock.y); if (el) s.clock.yearLabel = el;
    }
    const fx = applyFixes(st.text, d.fixes);
    if (st.hidden) d.gmNotes = [st.hidden].concat(arr(d.gmNotes));
    Object.assign(d, { reply: fx.text, mode: 'play', elapsedDays: 0, ledger: [] });

  if (t.id === 'bEdit') { EDITING = true; render(); const el = $('#editText'); el && el.focus(); return; }
  if (t.id === 'bEditCancel') { EDITING = false; render(); return; }
  if (t.id === 'bEditSave') { const el = $('#editText'); const last = [...S.chat].reverse().find(c => c.role === 'gm'); if (el && last) last.text = el.innerText.replace(/\n{2,}/g, '\n').trim(); EDITING = false; await store.save(S); render(); return; }
  if (t.id === 'bRegen') { $('#regenBox').innerHTML = `<div class="row"><input id="regenNote" class="grow" placeholder="想怎么改？比如：别让他这么快答应 / 写得更细（可以不填）"><button class="main" id="bRegenGo">重写</button><button id="bRegenNo">算了</button></div>`; $('#regenNote').focus(); return; }
  if (t.id === 'bRegenNo') { $('#regenBox').innerHTML = ''; return; }
  if (t.id === 'bRegenGo') {
    if (!S.prev) return;
    const note = $('#regenNote').value.trim() || '换一种写法';
    const n = S.chat.length, lastGm = S.chat[n - 1], beforeIt = S.chat[n - 2];
    const said = lastGm && lastGm.role === 'gm' && beforeIt && beforeIt.role === 'me' ? beforeIt.text : '';
    const orig = S, span = (lastGm && lastGm.span) || 'auto';
    S = restorePrev(orig);
    send(said, span, note, { orig }); return;
  }
  if (t.id === 'bInst') {
    const kb = ($('#kbText').value || '').trim();
    lsSet(KB_KEY, kb ? cut(kb, 60000) : null);
    buildInst(S); return;
  }
  if (t.id === 'bSettle') { settleLast(); return; }
  if (t.id === 'bHistBuild') {
    if (BUSY || !S) return;
    const y = S.clock.y, cov = RUNHIST.find(h => y >= h.range[0] && y <= h.range[1]);
    const from = cov ? cov.range[0] : y - 3;
    CTL = new AbortController(); TURN = CTL; setBusy(true); PHASE = 'histbuild';
    try { const p = await buildHistPack(S, from, from + 11, true); HBMSG = `✓ 已建 ${p.title}：${p.events.length} 件事、${p.figures.length} 位人物`; await store.save(S); }
    catch (e) { if (!(e && e.code === 'cancelled')) HBMSG = '没建成：' + errText(e); }
    finally { PHASE = ''; TURN = null; setBusy(false); }
    return;
  }
  if (t.id === 'bTick') {
    if (BUSY || !S) return;
    TICKMSG = ''; ERRMSG = ''; PHASE = 'world'; CTL = new AbortController(); TURN = CTL; setBusy(true);
    try { const r = await worldTick(S); TICKMSG = `✓ 推演好了${r.changes.length ? '，有 ' + r.changes.length + ' 处走向变了' : '，大势照史书走'}`; await store.save(S); }
    catch (e) { if (!(e && e.code === 'cancelled')) TICKMSG = '没推演成：' + errText(e); }
    finally { PHASE = ''; TURN = null; setBusy(false); }
    return;
  }
  if (t.id === 'bSelfTest' || t.id === 'bSelfTest2') {
    const box = t.id === 'bSelfTest' ? $('#selfBox') : $('#selfBox2'); t.disabled = true; t.textContent = '自检中（半分钟内）…';
    try {
      const r = await api('/api/selftest');
      box.innerHTML = `<div class="list">${arr(r.results).map(x => `<div><b style="color:var(--${x.ok ? 'good' : 'zhu'})">${x.ok ? '✓' : '✗'} ${esc(x.name)}</b> <span class="muted">${esc(x.detail)}（${x.ms} 毫秒）</span></div>`).join('')}</div>`;
      if (arr(r.results).some(x => /搜索|维基/.test(x.name) && x.ok)) { SEARCH_OFF = ''; SEARCH_DOWN = 0; }
    } catch (e) { box.textContent = '游戏服务没有回应：' + (e.message || e); }
    t.disabled = false; t.textContent = '再自检一次'; return;
  }
  if (t.id === 'bBranch') {
    if (BUSY || !S) return;
    setBusy(true);
    try {
      await store.save(S);
      const b = clone(S); b.id = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); b.prev = null;
      b.title = `${one(S.title, 20)}（分支·第${S.turn}回合）`; b.branchOf = S.id; b.createdAt = Date.now();
      await store.save(b); S = b; lsSet('hrpg:last', b.id);
    } finally { setBusy(false); }
    const m = $('#branchMsg'); if (m) m.textContent = '✓ 已另存为分支，现在玩的是分支'; return;
  }
  if (t.id === 'bCopyErr') {
    const txt = problemReport(), st = $('#copyErrSt');
    try { await navigator.clipboard.writeText(txt); if (st) st.textContent = ' ✓ 已复制，直接粘贴给 Claude'; }
    catch (_) { const ta = document.createElement('textarea'); ta.value = txt; ta.style.cssText = 'width:100%;height:8em;margin-top:6px'; t.parentNode.appendChild(ta); ta.select(); if (st) st.textContent = ' 没能自动复制：下面的字已选中，按 Ctrl+C'; }
    return;
  }
  if (t.id === 'bReport') {
    const txt = problemReport();
    const box = $('#reportBox'); if (box) { box.hidden = false; box.value = txt; box.select(); }
    try { await navigator.clipboard.writeText(txt); $('#reportMsg').textContent = '已复制。直接粘贴给我（Claude）就行。'; } catch (_) { $('#reportMsg').textContent = '没能自动复制：下面框里的字已选中，按 Ctrl+C 复制。'; }
    return;
  }
  if (t.id === 'bCopyGeo') {
    const txt = Object.entries(S.places).map(([k, v]) => `${k}\t今${v.now}\t属${v.belong}\t${v.from}${v.note ? '\t' + v.note : ''}`).join('\n');
    try { await navigator.clipboard.writeText(`主角现在在：${S.place.full}（${timeText(S.clock)}）\n` + txt); $('#copyMsg').textContent = '已复制，可以直接粘贴给做地图的 AI。'; }
    catch (_) { $('#copyMsg').textContent = '复制没成功：请手动选中上面的表格复制。'; }
    return;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'sLen') { SETTINGS.len = e.target.value; lsSet('hrpg:settings', JSON.stringify(SETTINGS)); }
  if (e.target.id === 'sSearch') { SEARCH_OFF = ''; SEARCH_DOWN = 0; SETTINGS.search = e.target.checked; lsSet('hrpg:settings', JSON.stringify(SETTINGS)); }
  if (e.target.id === 'sShowWork') { SETTINGS.showWork = e.target.checked; lsSet('hrpg:settings', JSON.stringify(SETTINGS)); render(); }
  if (e.target.id === 'sRuling') { SETTINGS.ruling = e.target.checked; lsSet('hrpg:settings', JSON.stringify(SETTINGS)); }
  if (e.target.id === 'sWorld') { SETTINGS.world = e.target.checked; lsSet('hrpg:settings', JSON.stringify(SETTINGS)); }
  if (e.target.id === 'sCheck') { SETTINGS.check = e.target.checked; lsSet('hrpg:settings', JSON.stringify(SETTINGS)); }
  if (e.target.id === 'sTier') { SETTINGS.tier = e.target.value; lsSet('hrpg:settings', JSON.stringify(SETTINGS)); }
});

/* ========== 启动 ========== */
render();
(async () => {
  const c = window.claude;
  if (c && c.use) {
    MODE = 'claude';
    const [sm, db, user] = await Promise.all([c.use('sample'), c.use('db'), c.use('user')]);
    SAMPLE = sm; DB = db;
    try { UID = user ? await user.id() : null; } catch (_) { UID = null; }
  } else if (location.protocol.startsWith('http')) {
    try { const h = await api('/api/health'); if (h && h.ok) { MODE = 'local'; SAMPLE = localSample; await refreshKey(); try { const r = await api('/api/hpacks'); RUNHIST = arr(r.packs).filter(p => p && Array.isArray(p.range) && Array.isArray(p.events)); } catch (_) { RUNHIST = []; } } } catch (_) { MODE = 'none'; }
  }
  READY = true;
  const last = lsGet('hrpg:last');
  if (last && VIEW === 'start' && !BUSY) {
    try { const s = await store.load(last.split('|')[0]); if (s) { S = s; VIEW = 'game'; } } catch (_) { /* 留在首页 */ }
  }
  render();
  // 刷新前还有一回合在写：接着等它写完，不丢
  try {
    const p = JSON.parse(lsGet('hrpg:pending') || 'null');
    if (p && S && p.saveId === S.id && Date.now() - p.at < 30 * 60e3 && (p.story || (p.job && MODE === 'local'))) {
      const moved = p.baseChat != null ? S.chat.length !== p.baseChat : S.turn !== p.baseTurn;
      if (p.redo && moved && S.prev) S = restorePrev(S);
      const still = p.baseChat != null ? S.chat.length === p.baseChat : S.turn === p.baseTurn;
      if (still) send(p.said, p.span, p.note, { job: p.job, story: p.story, ruling: p.ruling }); else lsSet('hrpg:pending', null);
    }
    else lsSet('hrpg:pending', null);
  } catch (_) { lsSet('hrpg:pending', null); }
})();
</script>
