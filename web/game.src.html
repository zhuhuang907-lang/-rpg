<title>历史模拟RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap">
<style>
/* 版式：左边是和 GM 的对话（像聊天一样一来一往），右边是账册：局面、人物、家业、史线、地理、年谱。
   配色取「竹纸 + 墨 + 石青 + 朱印」：纸色偏青灰，石青作主色，朱色只用在印章与要紧处。 */
:root{
  --paper:#eef0ea; --sheet:#f8f9f5; --ink:#1d2421; --ink2:#4a524e; --mute:#7c847f; --rule:#d5dad2;
  --qing:#2c5f7c; --qing-soft:#dde8ee; --zhu:#b5372a; --zhu-soft:#f5e2de; --ochre:#9a7b2f; --ochre-soft:#f3ecd9;
  --good:#3d7a55; --good-soft:#e2efe6; --shadow:0 1px 2px rgba(20,30,28,.06),0 4px 14px rgba(20,30,28,.05);
  --f-title:"Ma Shan Zheng","Noto Serif SC","Songti SC",serif;
  --f-read:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-ui:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#131819; --sheet:#1b2224; --ink:#e4e8e3; --ink2:#b9c1bc; --mute:#86908b; --rule:#2e3739;
  --qing:#86b6d4; --qing-soft:#1f3340; --zhu:#e2725f; --zhu-soft:#3a2420; --ochre:#d2b15e; --ochre-soft:#332b17;
  --good:#7cc195; --good-soft:#1c3125; --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131819; --sheet:#1b2224; --ink:#e4e8e3; --ink2:#b9c1bc; --mute:#86908b; --rule:#2e3739;
  --qing:#86b6d4; --qing-soft:#1f3340; --zhu:#e2725f; --zhu-soft:#3a2420; --ochre:#d2b15e; --ochre-soft:#332b17;
  --good:#7cc195; --good-soft:#1c3125; --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font:15px/1.7 var(--f-ui);padding-inline:16px;padding-block:0 24px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:6px 12px;transition:background .12s,border-color .12s}
button:hover:not(:disabled){border-color:var(--qing)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--qing);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.main{background:var(--qing);border-color:var(--qing);color:var(--sheet);font-weight:600}
button.link{border:none;background:none;padding:2px 4px;color:var(--qing);text-decoration:underline;text-underline-offset:3px}
input,select,textarea{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical}
.muted{color:var(--mute)}
.wrap{max-width:1280px;margin:0 auto}

.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;border-bottom:1px solid var(--rule);margin-bottom:14px}
.brand{font-family:var(--f-title);font-size:28px;line-height:1;letter-spacing:.04em}
.brand small{font-family:var(--f-ui);font-size:12px;color:var(--mute);margin-left:8px;letter-spacing:0}
.top .sp{flex:1}
.status{font-size:13px;color:var(--ink2);font-family:var(--f-read);min-width:0}
.status b{color:var(--ink)}

.h{display:flex;align-items:center;gap:10px;margin:18px 0 8px;font-family:var(--f-read);font-weight:700;font-size:16px;letter-spacing:.08em;flex-wrap:wrap}
.h .seal{display:inline-grid;place-items:center;width:23px;height:23px;border:1.5px solid var(--zhu);color:var(--zhu);border-radius:3px;font-family:var(--f-title);font-size:16px;letter-spacing:0;flex:none}
.h .note{font-family:var(--f-ui);font-weight:400;font-size:12px;color:var(--mute);letter-spacing:0}

.start{max-width:780px;margin:0 auto}
.hero{padding-block:18px 6px}
.hero h1{font-family:var(--f-title);font-weight:400;font-size:40px;margin:0 0 6px;text-wrap:balance}
.hero p{margin:0;color:var(--ink2);max-width:64ch}
.ask1{display:flex;gap:8px;margin-top:16px}
.ask1 input{font-size:17px;padding:12px 14px}
.ask1 button{white-space:nowrap;padding:0 22px;font-size:16px}
.examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border-radius:16px;padding:4px 12px;font-size:13px;background:var(--sheet);text-align:left}
.saves{display:grid;gap:8px}
.save{display:flex;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;flex-wrap:wrap}
.save .t{flex:1;min-width:0}
.save .t b{display:block;font-family:var(--f-read)}
.save .t span{font-size:12px;color:var(--mute)}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.howto div{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink2)}
.howto b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}

.game{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:22px;align-items:start}
.chat{display:flex;flex-direction:column;gap:14px;min-width:0}
.msg{min-width:0}
.msg.gm{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px 18px}
.msg.gm.talk{background:var(--qing-soft);border-color:color-mix(in srgb,var(--qing) 30%,transparent)}
.msg.me{align-self:flex-end;max-width:80%;background:var(--ink);color:var(--paper);border-radius:12px 12px 2px 12px;padding:9px 14px;white-space:pre-wrap}
.msg .lab{font-size:12px;color:var(--qing);margin-bottom:4px;font-family:var(--f-read);display:flex;gap:8px;flex-wrap:wrap}
.msg .lab .tag{color:var(--mute)}
.text{font-family:var(--f-read);font-size:17px;line-height:2;white-space:pre-wrap;max-width:70ch}
.msg.talk .text{font-family:var(--f-ui);font-size:15px;line-height:1.85}
.text[contenteditable="true"]{outline:2px dashed var(--ochre);padding:6px;border-radius:6px}
.caret::after{content:"▍";color:var(--qing);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.thinking{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:14px}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--qing);animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion: reduce){.dots i,.caret::after{animation:none}}
.extras{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.ex{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;background:var(--paper);font-size:13.5px;min-width:0}
.ex .eh{font-family:var(--f-read);font-weight:700;color:var(--qing);letter-spacing:.08em;font-size:13px}
.ex .eh span{font-family:var(--f-ui);font-weight:400;color:var(--mute);font-size:11px;letter-spacing:0;margin-left:6px}
.ex div+div{margin-top:3px}
.ex.life{background:var(--good-soft)}
.ex.news{background:var(--ochre-soft)}
.msgacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.hints{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.earlier{font-size:13px;color:var(--mute);text-align:center}

.composer{position:sticky;bottom:0;background:var(--paper);padding-block:10px 4px;border-top:1px solid var(--rule)}
.composer textarea{font-size:15px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.row select{width:auto}
.row .grow{flex:1}
.savest{font-size:12px;color:var(--good)}.savest.bad{color:var(--zhu)}

.side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:10px 14px 14px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin:0 -4px 6px;padding-bottom:6px;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:4px 7px;font-size:14px;border-radius:6px;color:var(--ink2)}
.tabs button.on{background:var(--qing-soft);color:var(--qing);font-weight:600}
.who{font-family:var(--f-read)}
.who .n{font-size:20px;font-weight:700}
.who .r{color:var(--mute);font-size:13px}
.who .w{color:var(--qing);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:10px}
.tile{border:1px solid var(--rule);border-radius:8px;padding:6px 9px;background:var(--paper)}
.tile .k{font-size:12px;color:var(--mute)}
.tile .v{font-family:var(--f-read);font-size:15px;font-weight:600;word-break:break-all;font-variant-numeric:tabular-nums}
.tile .why{font-size:11px;color:var(--mute);line-height:1.4}
.up{color:var(--good);font-size:11px;margin-left:3px}.down{color:var(--zhu);font-size:11px;margin-left:3px}
.grp{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:5px}
.grp .gk{width:5.5em;flex:none}
.bar{flex:1;height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--qing)}
.bar i.bad{background:var(--zhu)}.bar i.warn{background:var(--ochre)}.bar i.good{background:var(--good)}
.grp .gw{color:var(--mute);white-space:nowrap;min-width:3em}
.list{font-size:13.5px}
.list > div{border-bottom:1px dotted var(--rule);padding:6px 0}
.list b{font-weight:600}
.list .when{color:var(--qing);margin-right:6px;font-family:var(--f-read)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0}
.kv dt{color:var(--mute)}.kv dd{margin:0;min-width:0}
.pcs{display:grid;gap:8px}
.pc{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--paper)}
.pc .pn{display:flex;justify-content:space-between;gap:6px;align-items:center}
.pc .pn b{font-family:var(--f-read);font-size:15px}
.att{font-size:11px;border:1px solid var(--rule);border-radius:10px;padding:0 6px;color:var(--qing);white-space:nowrap}
.pc .pr{color:var(--mute);font-size:12px}
.pc .pl span{color:var(--mute);margin-right:4px}
.abil{margin-left:6px;font-size:11px;border:1px solid var(--rule);border-radius:3px;padding:0 4px;color:var(--ochre)}
.badge{font-size:11px;padding:0 7px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.b-todo{color:var(--ochre);background:var(--ochre-soft)}.b-doing{color:var(--qing);background:var(--qing-soft)}
.b-bad{color:var(--zhu);background:var(--zhu-soft)}.b-done{color:var(--good);background:var(--good-soft)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--mute);font-weight:500;border-bottom:1px solid var(--rule);padding:4px 6px 4px 0}
.tbl td{border-bottom:1px dotted var(--rule);padding:5px 6px 5px 0;vertical-align:top}
.tblwrap{overflow-x:auto}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.spark{margin-top:8px}.spark svg{width:100%;height:56px;display:block}
.overview{font-family:var(--f-read);font-size:14px;line-height:1.85;white-space:pre-wrap}
.mine{color:var(--zhu)}
.banner{white-space:pre-wrap;background:var(--ochre-soft);border:1px solid var(--ochre);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.err{white-space:pre-wrap;background:var(--zhu-soft);border:1px solid var(--zhu);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}

@media (max-width: 960px){
  .game{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none;order:-1}
  .side.fold .pane{display:none}
}
@media (max-width: 520px){
  .ask1{flex-direction:column}.ask1 button{padding:10px}
  .hero h1{font-size:32px}
  .msg.me{max-width:92%}
  .h .note{flex-basis:100%;margin-left:33px}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">历史模拟<small>网页版</small></div>
    <div class="status" id="statusLine"></div>
    <div class="sp"></div>
    <button id="bHome" hidden>换一局</button>
  </header>
  <div id="notice"></div>
  <main id="app"></main>
</div>

<script type="application/json" id="cal">__CAL__</script>
<script>
'use strict';
/* ========== 小工具 ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cut = (s, n) => { const t = String(s ?? '').replace(/[ \t]+/g, ' ').trim(); return t.length > n ? t.slice(0, n) + '……' : t; };
const one = (s, n) => cut(String(s ?? '').replace(/\s+/g, ' '), n);
const arr = v => (Array.isArray(v) ? v : []);
const clone = o => JSON.parse(JSON.stringify(o));
const num = v => (v === null || v === '' || v === undefined || !Number.isFinite(Number(v)) ? null : Number(v));
const lsGet = k => { try { return localStorage.getItem(k); } catch (_) { return null; } };
const lsSet = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (_) { /* 无存储 */ } };
const fmtN = (n, u) => (n == null || !Number.isFinite(Number(n)) ? '未定' : Number(n).toLocaleString('zh-CN', { maximumFractionDigits: 2 }) + (u || ''));
const N0 = v => { const t = String(v ?? '').replace(/[,，\s]/g, ''); if (!t) return null; const x = Number(t); return Number.isFinite(x) ? x : null; };
const bytes = s => { try { return new TextEncoder().encode(s).length; } catch (_) { return s.length * 3; } };

/* ========== 真实农历（月表：公元前221年—1912年，天文推算） ========== */
const CAL = (() => {
  let months = [], first = new Map();
  try {
    for (const [y, lens, leapPos] of JSON.parse($('#cal').textContent)) {
      first.set(y, months.length); let n = 0;
      for (let i = 0; i < lens.length; i++) { const leap = i === leapPos; if (!leap) n++; months.push({ y, m: n, leap, days: lens[i] === '1' ? 30 : 29 }); }
    }
  } catch (_) { months = []; }
  const toA = y => (y < 0 ? y + 1 : y), fromA = y => (y <= 0 ? y - 1 : y);
  function idx(y, m, leap) {
    const f = first.get(toA(y)); if (f == null) return -1;
    for (let i = f; i < months.length && months[i].y === toA(y); i++) if (months[i].m === m && months[i].leap === !!leap) return i;
    return leap ? idx(y, m, false) : -1;
  }
  function addDays(c, n) {
    let { y, m, d } = c; let i = idx(y, m, c.leap);
    if (i < 0) { d += n; while (d > 30) { d -= 30; m++; if (m > 12) { m = 1; y++; if (y === 0) y = 1; } } return { y, m, d, leap: false }; }
    d = Math.min(d, months[i].days) + n;
    while (d > months[i].days) { d -= months[i].days; i++; if (i >= months.length) return { y: fromA(months[i - 1].y) + 1, m: 1, d: 1, leap: false }; }
    return { y: fromA(months[i].y), m: months[i].m, d, leap: months[i].leap };
  }
  const MC = ['', '正月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '腊月'];
  const N = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
  const dayName = d => (d <= 10 ? '初' + N[d] : d < 20 ? '十' + N[d - 10] : d === 20 ? '二十' : d < 30 ? '廿' + N[d - 20] : '三十');
  const label = (m, d, leap) => (leap ? '闰' : '') + (MC[m] || m + '月') + (d ? dayName(d) : '');
  return { addDays, label };
})();
const yearText = y => (y < 0 ? '公元前' + -y + '年' : '公元' + y + '年');
const timeText = c => `${c.yearLabel || ''}（${yearText(c.y)}）${CAL.label(c.m, c.d, c.leap)}`;
const season = m => '春春春夏夏夏秋秋秋冬冬冬'[(m - 1) % 12] || '';

/* ========== 规则 ========== */
let SETTINGS = { len: 'normal', tier: 'default', check: true };
try { Object.assign(SETTINGS, JSON.parse(lsGet('hrpg:settings') || '{}')); } catch (_) { /* 默认 */ }
const LEN = { short: '三四百字', normal: '六百到一千字', long: '一千到一千六百字' };
const IDM = {
  emperor: { meters: '国库（钱、粮）、内帑、民心、吏治、威望、军心', groups: '朝官各派、宗室、宦官或外戚、军队、农户、工商', estate: '国库与内帑的岁入岁出、皇庄、各项大工与军费', ways: '开仓赈济、兴修水利、整饬吏治、加征、裁冗、练兵、用人罢人、和战' },
  warlord: { meters: '府库、兵额实数、粮饷可支几月、地盘、部将忠心、名分', groups: '部将、士人、百姓、邻近势力', estate: '辖地赋税、屯田、军需、私产', ways: '募兵、屯田、修城、积粮、遣使、结盟离间、出兵' },
  official: { meters: '官库钱粮、上官考语、民望、胥吏掌控、私财、清名', groups: '上司、乡绅、胥吏、小民', estate: '俸禄与养廉、衙门公费、私产田宅、人情往来的开销', ways: '催科、清丈、劝农兴修、赈济、听讼、整顿胥吏、打点上司、结交乡绅' },
  noble: { meters: '家资（钱、粮、田）、食邑或俸禄、朝中关系、宗族地位、名声、身体', groups: '宗族长辈、朝中权要、门客家仆、封地百姓', estate: '田庄租课、食邑、铺面、府中用度', ways: '置田买宅、结交权要、荐举门客、整顿庄户、联姻' },
  commoner: { meters: '家资（钱、粮、田）、家中地位、名声、人情、身体', groups: '家人、邻里、官府差役、主家或佃户、同行', estate: '田地收成、手艺或买卖的进项、口粮赋役与日用', ways: '种田、做工、开铺、贩货、借贷典当、读书应试、投亲靠友、外出谋生' },
};

function rules() {
  return `你是一部历史模拟游戏的主持人（GM），和玩家一起，一来一往地推演一个人在真实历史里的一生。这是一个以经营与过日子为主的长期游戏：玩家想做什么就说什么，你把世界写得真实、细致、丰富，账要算清，史线要清楚，地理要准。你写主角身边的世界与他人，不扮演主角。

一、先分清戏里戏外（mode）
1. 戏里（play）：玩家写的是主角做的事、说的话、下的吩咐、经营的决定，或者要过一段日子。你推进剧情和时间，更新各种账。
2. 戏外（talk）：玩家在跟你商量——问历史背景、问某地在哪离多远、问局面怎样、问某人是谁、请你分析利弊和可能的走法、想改设定。你像一个熟读史书、心思细密、肯说实话的朋友那样，直接、详细、有条理地回答，可以分析、举例、列几条可能的路子并说各自的代价；不推进时间（elapsedDays 0），不写戏里发生的事。拿不准是哪种，就当戏外，先问清楚。
3. 一句话里两种都有，就先简短回答戏外的问题，再推进戏里的部分（mode 填 play）。

二、主角归玩家
4. 主角只做玩家说的事；不写主角的心思和决定，不替他说他没说的话。玩家只说了个大概，就照常理把这件事办下去，不要停下来追问细节。
5. 玩家想做什么都可以：违法、越权、悖逆、行险，游戏不拦也不说教。成败与后果按真实情形推演——有没有人知道、谁知道、他们的利害与胆量、主角手里的权势与把柄、此时此地的吏治与风气；不要让坏事必遭报应，也不要让好事必有好报。
5a. 自由度最要紧：玩家从不被一件事困住。他可以不理、躲开、拖着、交给别人、远走他乡、改行、投奔别人、另起炉灶；你顺着他的选择写下去，不用剧情、巧合或「非处理不可」把他拉回来。找上门的事少而有分量（大约每三四回合才有一件，玩家自己忙着的时候更少），多数人对主角是平常态度，敌意只来自真实的利害冲突，不要四面树敌。
5b. 玩家做过的每件事都在世界上留下痕迹，分量与事情相称：小事小影响，大事大影响，有的事做了就做了、没什么下文。影响落在实处——名声、人情、钱粮、门路、仇怨、机会；有些当下就见，有些几个月几年后才回来。在 deeds 里记下本回合玩家做的、可能有后续的事（做了什么、眼下的影响、可能的后续）；以前的作为真的产生了后续时，在正文里写出来，并在 deedsDone 里写它的开头几个字。

三、写得丰富，像真的日子
6. 剧情像连续剧往下接：先接上一回的末尾和玩家这一步，把这一步办完、写透，再写由此自然带出的变化。玩家在做什么，剧情就围着什么转（打仗写行军军情粮草阵前，做官写公事官场，经营写买卖行情账目，过日子写家计亲事邻里）。
7. 细节要真：衣食住行、器物、钱粮价码、称谓礼数、行业门道、节令风俗、市井见闻，都合乎本朝本地本年，具体到让人看得见、算得清。日常本身就是内容，不是每回都要有大事；不要把日子写成一件接一件的差事。
8. 时间一过，世界和身边的人都在变，不必等玩家去问：家人长大变老、生病、婚嫁、添丁、过世；亲友邻里同僚升迁、搬走、发财、落魄、结仇、和好；年景收成、物价、市面随季节年份变。多数是小事，也有大事，在正文里带出，并记进 lifeEvents。
9. 人物各有性格、本事（高/中/低）、立场与私心；说话办事、出的主意都由此决定，庸人会出馊主意还很笃定，能人也会看走眼。他们的话不一定对，你不替玩家判断对错。头一次出场交代他是谁、和主角什么关系。
10. 交代下去的事由具体的人按本事和私心去办：会打折扣、捞好处、揽功诿过、瞒报，也可能办得比预想好。有人办了事，结果分三层：回报（办事人的说法，可能失真）、账目（数的真实变化）、风声（街谈巷议，透露回报没说的）。后果可以延迟，也可能不了了之；没写出来的真相写进 gmNotes。没办完的差事到时必须交代结果（orders）。
11. 打仗按真实军事写：兵力、粮草、行军日程、地形天候、斥候军情、士气军纪，按玩家的部署一步步推进，胜负看实力与应变。

四、经营要算得清（这是游戏的主轴）
12. 一切都要量化，数字用阿拉伯数字。钱一律折成【家业账】里定的本位单位（如「两」；铜钱、宝钞按当时比价折算），合乎本朝本地本年的物价与量级（参照【本地行情】）。
13. 现钱由程序按你报的 ledger 和每月进项开销自动结算——你不要自己改现钱。本回合每一笔钱的进出（买卖、工钱、赋税摊派、送礼打点、借贷、赏赐、被偷被抢、事业投入与收获……）都在 ledger 里一笔一笔报，收入为正、支出为负，与正文里的数对得上。按月固定的进出写在 estate 的 income / expense 里（每月多少），程序过月自动结。
13a. 产业（田地、铺面、宅子、作坊、船、牲口、存货、借出的钱）要有数量和估值；在做的事业（开荒、开铺、建屋、贩运、读书应试、捐官……）有进度、要时日、有风险、会出岔子。有变化时在 estate 里给出变了的部分（整组替换）。本地行情（米、麦、布、盐、肉、田价、房价、雇工日钱、银钱比价等）随季节、年景、战事变化时在 prices 里给出。
13b. 人和人的关系也量化：presentNpcs 里 favor 写他对主角的好感（-100 到 100），随来往增减；人群满意度 0–100。

五、世界自己在运转（取各家同类游戏之长）
14a. 人物有自己的盘算（如《十字军之王》）：每个要紧人物有性格、本事、野心与私心，会自己行动——结亲、结党、争产、谋位、背叛、报恩、病死；家族要传承，婚姻是结盟，子女要教养、要安排出路。
14b. 世界不围着主角转（如《太吾绘卷》《骑马与砍杀》）：各地行情不同、物价随年景和战事涨落，贩运有利可图也有风险；别人也在经营、做官、打仗，他们的成败会改变主角面前的机会。
14c. 治理与民心（如《三国志》《历史模拟器：崇祯》）：一地的户口、钱粮、民心、治安、吏治彼此牵连，政令有代价、要时日、会走样；重赋得钱失民心，赈济花钱得人心，用人不当则贪腐坐大。
14d. 声望与名分：名声、官位、爵位、正统名分决定别人肯不肯跟你、肯不肯借你钱、肯不肯降你；僭越、背约、屠城、苛政会让名声一落千丈，宽仁守信会慢慢攒下人望。

六、势力与征战（玩家掌兵、称雄、为君时）
14e. 【势力】列着天下各方势力、主角的地盘与兵马，以它为准；有变化时在 powers / territory / forces 里给出（给出的部分整个替换）。各方势力会照自己的利害行动：扩张、结盟、互攻、观望、投降、内乱、覆灭。
14f. 军阀的涌现照真实的道理：中央衰弱、财政崩坏、天灾饥荒、边军坐大、地方募兵自保时，节帅、边将、豪强、土豪团练、流寇首领、宗室外戚就会起来割据；真实历史上的割据者按史书的时间地点出现（本局改写过的除外），另有合乎时势的地方豪强。他们各有地盘、兵力、钱粮、名分与野心，起落都有缘由，不凭空冒出也不凭空消失。
14g. 攻打别的城池按真实的道理推演：要有出师的名义、粮草与转运、行军路线与日程、攻城器械或围困时日；攻下来之后——新得的地方民心低、要分兵驻守（野战兵力因此变薄）、要派人治理、豪强士绅会观望或反抗、溃兵流民四散；劫掠得钱粮失人心，安抚花钱粮得人心；屠城招来天下恶名、守城的人更会死战；降将要防，降卒要整编；邻近势力会警觉、结盟来对付你；兵连祸结则士卒疲敝、逃亡、哗变，粮尽则军心崩。若主角名义上还是朝廷臣子，擅自兴兵是大罪，朝廷会讨伐、招抚或姑息，看时势。
14h. 兵马要算清：兵额写实有人数（数字），存粮写石数，训练士气写一词；程序按每人每日约二升米算粮草可支几日。打仗写明双方投入多少、伤亡多少、俘获多少、逃散多少；补兵要时间要钱粮。地盘写户口数、守军数、存粮石数、民心（0–100）、每月赋税收入。

七、人生与传承
14i. 主角会老、会病、会死。主角死了，游戏不结束：在 succession 里写明由谁接着（通常是嗣子、长子或家里能主事的人），之后玩家就扮演这个继承人，家业、地盘、恩怨照旧传下去。

八、官职、称号与晋升
14j. 【本朝官制】是按本局年代核过的官制表，官名、品级、衙门、隶属以它为准；它没写到的，照本朝本年真实的制度写，拿不准就用当时通行的说法，不造官名，不把别朝的官名搬过来。
14k. 名目要分清：本官（寄禄官、阶官）、实际执掌的职事、临时差遣、散官与阶、勋、爵、加官、封号、科举功名，各朝各不相同（如宋前期以差遣治事、本官只定俸禄；明清以品级和实职为主；十六国各国官制不同，胡汉分治，不能套后世）。书吏、典史以下的吏员、衙役、捕快、里正、保甲长是吏役或乡役，不是官，没有品级（吏员有出身可考职的照本朝规矩）。
14l. 晋升照本朝的规矩和时间来：看出身（本朝真有的途径：察举、九品中正、科举、门荫、军功、辟召、捐纳等）、资历与任期（考满）、考课的等第、上司和举荐、有没有空缺、朝中派系与时局、本人与上司的交情，还要花钱、花时间、托门路；一般一级一级升，越级提拔要有缘由（大功、君主赏识、非常时期），也招人忌。降级、罢官、贬谪、丁忧守制、致仕、坐罪都会发生。文武、京官外官、正途异途路子不同。主角不在官场时，写他够得着的门路与代价。
14m. 主角有官职、差遣、爵位、功名、封号时，在 career 里给出他此刻的仕途（有变化才给，给出的项整个替换）：本官与品级、实际差事、加官称号、职权（能管什么、能调动什么、不能做什么）、顶头上司、属下（官与吏役分开写）、考课政声、到任多久、下一步可能升转到哪及要什么条件。任免、升降、考课、封赠、得罪上官、被弹劾这类履历上的事写进 careerEvents。

九、史线要清楚
14. 【史线】列着这一年前后真实的天下大势与大事，以它为准，不编史书没有的大事；本局被玩家改写过的以【被改写的历史】为准。
15. 时间过去时，按史书这段时间里发生的大事写进 worldEvents（带年月；被玩家改变了的写实际发生的样子，changed 填 true），消息按路程与身份迟到、可能走样后才传到主角耳朵里。【按史书将要发生】快用完时，在 worldUpcoming 里补上之后五年按史书会发生的大事。
16. 小人物见不到帝王将相；不把无关的真人硬扯到主角身边；虚构人物不与史载真人同名。

十、地理要准（玩家没有地图，全靠你）
17. 一律用当时的地名与隶属。【地理册】里的地方以它为准，前后不能矛盾；正文里头一次提到的地方，在 places 里记下：当时名称、今地、隶属、在主角现居地的什么方位、相距多少里、怎么走要几天。
18. 路程按真实里程和走法算：步行日行五六十里，骑马日行百里上下，驿马急递每日三四百里，漕船顺水日行百里左右、逆水减半，山路与雨雪更慢。主角搬到别处时 moveTo 填新地方的全称。

十一、文风
19. 像好的历史正剧那样写（《大明王朝1566》《雍正王朝》的笔法）：叙述干净流畅，有起有落；人物说话带时代与身份的腔调，官场有官腔和潜台词，市井说市井话，家人说家常话。不要电报体和清单式排比；不要「空气仿佛凝固」「嘴角勾起」「不禁」「一丝」「眸子」「深吸一口气」「意味深长」这类套话。称主角为「你」。
20. 戏里的正文约${LEN[SETTINGS.len] || LEN.normal}；戏外的回答说清楚为止。年号、官名、器物、钱粮单位一律合乎本朝本年，正文里不写「据考」「不详」，不出现现代词语。

十二、输出
只输出一个 JSON 对象，不加代码块、不加任何说明，reply 放在最前面：

function localSample(input, opts = {}) {
  return new Promise(async (resolve, reject) => {
    const messages = Array.isArray(input) ? input : [{ role: 'user', content: String(input) }];
    let job = opts.resumeJob || null, stopped = false;
    const onAbort = () => { stopped = true; if (job) api('/api/llm-stop', { job }).catch(() => {}); reject({ code: 'cancelled' }); };
    if (opts.signal) { if (opts.signal.aborted) return onAbort(); opts.signal.addEventListener('abort', onAbort, { once: true }); }
    try {
      if (!job) {
        const r = await api('/api/llm-start', { messages, maxTokens: opts.maxTokens || 8000 });
        if (!r.ok) return reject({ code: 'local', message: r.why || '没发出去' });
        job = r.job;
        opts.onJob && opts.onJob(job);
      }
      let last = '';
      for (;;) {
        await new Promise(res => setTimeout(res, 700));
        if (stopped) return;
        let j; try { j = await api('/api/llm-job', { job }); } catch (_) { return reject({ code: 'local', message: '游戏服务没有回应：启动游戏的小窗口是不是被关掉了？' }); }
        if (j.text && j.text !== last) { last = j.text; opts.onText && opts.onText({ text: last, delta: '' }); }
        if (j.status === 'done') return resolve({ text: j.text, truncated: !!j.truncated });
        if (j.status === 'error' || !j.ok) return reject({ code: 'local', message: j.error || j.why || '没写成' });
        if (j.status === 'cancelled') return;
      }
    } catch (e) { if (!stopped) reject({ code: 'local', message: '游戏服务没有回应：' + (e.message || e) }); }
  });
}

function spark(h) {
  if (h.length < 2) return '';
  const w = 340, ht = 56, xs = h.map(x => x.cash), lo = Math.min(...xs), hi = Math.max(...xs), span = hi - lo || 1;
  const pts = h.map((x, i) => `${(i / (h.length - 1) * (w - 8) + 4).toFixed(1)},${(ht - 6 - (x.cash - lo) / span * (ht - 14)).toFixed(1)}`).join(' ');
  return `<div class="spark"><svg viewBox="0 0 ${w} ${ht}" role="img" aria-label="现钱走势"><polyline points="${pts}" fill="none" stroke="var(--qing)" stroke-width="2"/><circle cx="${pts.split(' ').pop().split(',')[0]}" cy="${pts.split(' ').pop().split(',')[1]}" r="3" fill="var(--qing)"/></svg><div class="muted">现钱走势：第${h[0].turn}回合 ${esc(fmtN(h[0].cash))} → 第${h[h.length - 1].turn}回合 ${esc(fmtN(h[h.length - 1].cash))}（最低 ${esc(fmtN(lo))}，最高 ${esc(fmtN(hi))}）</div></div>`;
}

/* ========== 动作 ========== */
async function startGame(sentence) {
  sentence = String(sentence || '').trim(); if (!sentence || BUSY) return;
  ERRMSG = ''; STREAM = ''; LAST_ACTION = () => startGame(sentence);
  setBusy(true);
  try {
    const { text } = await callClaude(openingInput(sentence), t => { STREAM = t; const el = document.querySelector('.text.caret'); if (el) el.textContent = t; else render(); });
    const d = parseJSON(text);
    if (!d || !(d.reply || d.scene) || !d.setup) throw { code: 'bad_json' };
    const s = newSave(d.setup);
    if (d.world) s.world = { overview: cut(d.world.overview, 600), events: arr(d.world.events).filter(x => x && x.text).map(x => ({ y: num(x.y) ?? s.clock.y, m: num(x.m) || 0, text: one(x.text, 100) })).slice(-40), upcoming: [] };
    d.worldUpcoming = arr(d.worldUpcoming).concat(arr(d.world && d.world.upcoming));
    d.mode = 'play'; d.elapsedDays = 0;
    applyReply(s, d, '');
    S = s; VIEW = 'game'; LAST_ACTION = null; TAB = 'board';
    await factCheck(S);
    await store.save(S);
  } catch (e) { if (!(e && e.code === 'cancelled')) ERRMSG = errText(e); }
  finally { STREAM = ''; setBusy(false); }
  if (S && !S.inst && VIEW === 'game') buildInst(S);
}
async function send(said, span, note, resumeJob) {
  if (BUSY || !S) return;
  ERRMSG = ''; STREAM = ''; PENDING_SAID = String(said || '').trim(); LAST_ACTION = () => send(said, span, note);
  const before = clone(S); before.prev = null;
  if ($('#said')) $('#said').value = '';
  setBusy(true);
  try {
    const { text } = await callClaude(turnInput(S, said, span, note), t => { STREAM = t; const el = document.querySelector('.text.caret'); if (el) el.textContent = t; else render(); },
      { resumeJob, onJob: job => lsSet('hrpg:pending', JSON.stringify({ job, saveId: S.id, said, span, note, at: Date.now() })) });
    lsSet('hrpg:pending', null);
    let d = parseJSON(text);
    if (!d || !(d.reply || d.scene)) d = salvage(text);
    if (!d) throw { code: 'bad_json' };
    applyReply(S, d, said);
    if (d._salvaged) { const g = S.chat[S.chat.length - 1]; g.extra = Object.assign(g.extra || {}, { salvaged: true }); }
    else await factCheck(S);
    S.prev = before;
    LAST_ACTION = null;
    try { await store.save(S); } catch (_) { SAVED = '这回没存上，下回会再试。'; SAVED_BAD = true; }
  } catch (e) {
    lsSet('hrpg:pending', null);
    if (!(e && e.code === 'cancelled')) ERRMSG = errText(e);
    const keepPrev = S.prev; for (const k of Object.keys(S)) delete S[k]; Object.assign(S, before, { prev: keepPrev });
    setTimeout(() => { if ($('#said') && !$('#said').value) $('#said').value = said || ''; }, 0);
  } finally {
    STREAM = ''; PENDING_SAID = ''; setBusy(false);
    const all = document.querySelectorAll('.chat .msg'); const last = all[all.length - 1]; if (last) last.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

document.addEventListener('submit', e => { if (e.target.id === 'fStart') { e.preventDefault(); startGame($('#qText').value); } });
document.addEventListener('keydown', e => { if (e.target.id === 'said' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('#bSend').click(); } });
document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  const ds = t.dataset;
  if (ds.ex) { $('#qText').value = ds.ex; return; }
  if (t.id === 'bStop') { CTL && CTL.abort(); return; }
  if (t.id === 'bKeyOpen') { KEY_OPEN = true; render(); return; }
  if (t.id === 'bKeyClose') { KEY_OPEN = false; KEYMSG = ''; render(); return; }
  if (t.id === 'bKeySave') {
    const k = $('#kIn').value.trim(), m = $('#kModel').value.trim();
    if (!k) { $('#kIn').focus(); return; }
    t.disabled = true; t.textContent = '保存中…'; KEYMSG = '';
    try {
      const r = await api('/api/quick-key', { apiKey: k, model: m || undefined });
      await refreshKey();
      if (!r.ok) KEYMSG = '没保存上：' + (r.why || '未知原因');
      else if (r.test && r.test.ok) { KEYMSG = `✓ 已保存，试连成功（${r.test.model || ''}）`; KEY_OPEN = false; }
      else KEYMSG = '已保存，但试连没通：' + ((r.test && r.test.why) || '') + '。点「检查网络」看看卡在哪。';
    } catch (e) { KEYMSG = '没保存上：游戏服务没有回应（' + (e.message || e) + '）'; }
    render(); return;
  }
  if (t.id === 'bNet') {
    t.disabled = true; t.textContent = '检查中…';
    try {
      const r = await api('/api/netcheck');
      KEYMSG = arr(r.results).map(x => `${x.name}：${x.ok ? '✓ 连得上' : '✗ ' + x.why}`).join('\n') + (r.proxy ? `\n代理：${r.proxy}` : '');
      if (arr(r.results).every(x => x.ok)) KEYMSG = '✓ ' + KEYMSG;
    } catch (e) { KEYMSG = '游戏服务没有回应：' + (e.message || e); }
    render(); return;
  }
  if (t.id === 'bRetry') { const f = LAST_ACTION; ERRMSG = ''; f && f(); return; }
  if (t.id === 'bHome') { if (BUSY) return; VIEW = 'start'; S = null; ERRMSG = ''; SAVED = ''; render(); return; }
  if (ds.load) { const s = await store.load(ds.load); if (!s) { ERRMSG = '这个存档读不出来了。'; render(); return; } S = s; VIEW = 'game'; ERRMSG = ''; EDITING = false; SAVED = ''; lsSet('hrpg:last', s.id); render(); return; }
  if (ds.askdel) { document.getElementById('del-' + ds.askdel).innerHTML = `确定删掉？<button data-del="${esc(ds.askdel)}">删掉</button><button data-nodel="1">不删</button>`; return; }
  if (ds.nodel) { renderStart(); return; }
  if (ds.del) { await store.del(ds.del); renderStart(); return; }
  if (ds.tab) { SIDE_FOLD = TAB === ds.tab ? !SIDE_FOLD : false; TAB = ds.tab; render(); return; }
  if (ds.write) { const ta = $('#said'); ta.value = (ta.value.trim() ? ta.value.trim() + '\n' : '') + ds.write; ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); ta.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  if (t.id === 'bSend') { const sp = $('#span').value; const said = $('#said').value; $('#span').value = 'auto'; send(said, sp); return; }
  if (t.id === 'bEdit') { EDITING = true; render(); const el = $('#editText'); el && el.focus(); return; }
  if (t.id === 'bEditCancel') { EDITING = false; render(); return; }
  if (t.id === 'bEditSave') { const el = $('#editText'); const last = [...S.chat].reverse().find(c => c.role === 'gm'); if (el && last) last.text = el.innerText.trim(); EDITING = false; await store.save(S); render(); return; }
  if (t.id === 'bRegen') { $('#regenBox').innerHTML = `<div class="row"><input id="regenNote" class="grow" placeholder="想怎么改？比如：别让他这么快答应 / 写得更细（可以不填）"><button class="main" id="bRegenGo">重写</button><button id="bRegenNo">算了</button></div>`; $('#regenNote').focus(); return; }
  if (t.id === 'bRegenNo') { $('#regenBox').innerHTML = ''; return; }
  if (t.id === 'bRegenGo') {
    if (!S.prev) return;
    const note = $('#regenNote').value.trim() || '换一种写法';
    const n = S.chat.length, lastGm = S.chat[n - 1], beforeIt = S.chat[n - 2];
    const said = lastGm && lastGm.role === 'gm' && beforeIt && beforeIt.role === 'me' ? beforeIt.text : '';
    S = clone(S.prev);
    send(said, 'auto', note); return;
  }
  if (t.id === 'bInst') {
    const kb = ($('#kbText').value || '').trim();
    lsSet(KB_KEY, kb ? cut(kb, 60000) : null);
    buildInst(S); return;
  }
  if (t.id === 'bCopyGeo') {
    const txt = Object.entries(S.places).map(([k, v]) => `${k}\t今${v.now}\t属${v.belong}\t${v.from}${v.note ? '\t' + v.note : ''}`).join('\n');
    try { await navigator.clipboard.writeText(`主角现在在：${S.place.full}（${timeText(S.clock)}）\n` + txt); $('#copyMsg').textContent = '已复制，可以直接粘贴给做地图的 AI。'; }
    catch (_) { $('#copyMsg').textContent = '复制没成功：请手动选中上面的表格复制。'; }
    return;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'sLen') { SETTINGS.len = e.target.value; lsSet('hrpg:settings', JSON.stringify(SETTINGS)); }
  if (e.target.id === 'sCheck') { SETTINGS.check = e.target.checked; lsSet('hrpg:settings', JSON.stringify(SETTINGS)); }
  if (e.target.id === 'sTier') { SETTINGS.tier = e.target.value; lsSet('hrpg:settings', JSON.stringify(SETTINGS)); }
});

/* ========== 启动 ========== */
render();
(async () => {
  const c = window.claude;
  if (c && c.use) {
    MODE = 'claude';
    const [sm, db, user] = await Promise.all([c.use('sample'), c.use('db'), c.use('user')]);
    SAMPLE = sm; DB = db;
    try { UID = user ? await user.id() : null; } catch (_) { UID = null; }
  } else if (location.protocol.startsWith('http')) {
    try { const h = await api('/api/health'); if (h && h.ok) { MODE = 'local'; SAMPLE = localSample; await refreshKey(); } } catch (_) { MODE = 'none'; }
  }
  READY = true;
  const last = lsGet('hrpg:last');
  if (last && VIEW === 'start' && !BUSY) {
    try { const s = await store.load(last.split('|')[0]); if (s) { S = s; VIEW = 'game'; } } catch (_) { /* 留在首页 */ }
  }
  render();
  // 刷新前还有一回合在写：接着等它写完，不丢
  try {
    const p = JSON.parse(lsGet('hrpg:pending') || 'null');
    if (p && MODE === 'local' && S && p.saveId === S.id && Date.now() - p.at < 30 * 60e3) send(p.said, p.span, p.note, p.job);
    else lsSet('hrpg:pending', null);
  } catch (_) { lsSet('hrpg:pending', null); }
})();
</script>
