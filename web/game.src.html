<title>历史模拟RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap">
<style>
/* 版式：左边是局面与正文（读），右边是人物与问人（查）；手机上单栏，侧栏变成下方的标签页。
   配色取「竹纸 + 墨 + 石青 + 朱印」：纸色偏青灰，石青作主色，朱色只用在印章与要紧处。 */
:root{
  --paper:#eef0ea; --sheet:#f8f9f5; --ink:#1d2421; --ink2:#4a524e; --mute:#7c847f; --rule:#d5dad2;
  --qing:#2c5f7c; --qing-soft:#dde8ee; --zhu:#b5372a; --zhu-soft:#f5e2de; --ochre:#9a7b2f; --ochre-soft:#f3ecd9;
  --good:#3d7a55; --good-soft:#e2efe6; --shadow:0 1px 2px rgba(20,30,28,.06),0 4px 14px rgba(20,30,28,.05);
  --f-title:"Ma Shan Zheng","Noto Serif SC","Songti SC",serif;
  --f-read:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-ui:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#131819; --sheet:#1b2224; --ink:#e4e8e3; --ink2:#b9c1bc; --mute:#86908b; --rule:#2e3739;
  --qing:#86b6d4; --qing-soft:#1f3340; --zhu:#e2725f; --zhu-soft:#3a2420; --ochre:#d2b15e; --ochre-soft:#332b17;
  --good:#7cc195; --good-soft:#1c3125; --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131819; --sheet:#1b2224; --ink:#e4e8e3; --ink2:#b9c1bc; --mute:#86908b; --rule:#2e3739;
  --qing:#86b6d4; --qing-soft:#1f3340; --zhu:#e2725f; --zhu-soft:#3a2420; --ochre:#d2b15e; --ochre-soft:#332b17;
  --good:#7cc195; --good-soft:#1c3125; --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font:15px/1.7 var(--f-ui);padding-inline:16px;padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:6px 12px;transition:background .12s,border-color .12s}
button:hover:not(:disabled){border-color:var(--qing)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--qing);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.main{background:var(--qing);border-color:var(--qing);color:var(--sheet);font-weight:600}
button.link{border:none;background:none;padding:2px 4px;color:var(--qing);text-decoration:underline;text-underline-offset:3px}
input,select,textarea{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical}
.muted{color:var(--mute)}
.wrap{max-width:1240px;margin:0 auto}

/* 顶栏 */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px;border-bottom:1px solid var(--rule);margin-bottom:18px}
.brand{font-family:var(--f-title);font-size:28px;line-height:1;color:var(--ink);letter-spacing:.04em}
.brand small{font-family:var(--f-ui);font-size:12px;color:var(--mute);margin-left:8px;letter-spacing:0}
.top .sp{flex:1}
.top-acts{display:flex;gap:8px;flex-wrap:wrap}

/* 印章式小标题 */
.h{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-family:var(--f-read);font-weight:700;font-size:17px;letter-spacing:.08em;text-wrap:balance}
.h .seal{display:inline-grid;place-items:center;width:24px;height:24px;border:1.5px solid var(--zhu);color:var(--zhu);border-radius:3px;font-family:var(--f-title);font-size:17px;letter-spacing:0;flex:none}
.h .note{font-family:var(--f-ui);font-weight:400;font-size:12px;color:var(--mute);letter-spacing:0}

/* 开始页 */
.start{max-width:760px;margin:0 auto}
.hero{padding-block:22px 6px}
.hero h1{font-family:var(--f-title);font-weight:400;font-size:40px;margin:0 0 6px;text-wrap:balance}
.hero p{margin:0;color:var(--ink2);max-width:62ch}
.ask1{display:flex;gap:8px;margin-top:18px}
.ask1 input{font-size:17px;padding:12px 14px}
.ask1 button{white-space:nowrap;padding:0 22px;font-size:16px}
.examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border-radius:16px;padding:4px 12px;font-size:13px;background:var(--sheet)}
.saves{display:grid;gap:8px;margin-top:6px}
.save{display:flex;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.save .t{flex:1;min-width:0}
.save .t b{display:block;font-family:var(--f-read)}
.save .t span{font-size:12px;color:var(--mute)}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:8px}
.howto div{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink2)}
.howto b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}

/* 游戏页两栏 */
.game{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:12px 14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin:-4px -4px 10px;padding-bottom:8px;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:4px 10px;border-radius:6px;color:var(--ink2)}
.tabs button.on{background:var(--qing-soft);color:var(--qing);font-weight:600}

/* 局面板 */
.board{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px}
.who{display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px dashed var(--rule);margin-bottom:12px}
.who .n{font-family:var(--f-read);font-size:22px;font-weight:700}
.who .r{color:var(--mute);font-size:13px;margin-left:8px}
.who .w{color:var(--qing);font-size:14px;font-family:var(--f-read)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.tile{border:1px solid var(--rule);border-radius:8px;padding:7px 10px;background:var(--paper)}
.tile .k{font-size:12px;color:var(--mute)}
.tile .v{font-family:var(--f-read);font-size:16px;font-weight:600;word-break:break-all;font-variant-numeric:tabular-nums}
.tile .why{font-size:11px;color:var(--mute);line-height:1.4}
.up{color:var(--good);font-size:11px;margin-left:3px}.down{color:var(--zhu);font-size:11px;margin-left:3px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 18px;margin-top:12px}
.grp{display:flex;align-items:center;gap:8px;font-size:13px}
.grp .gk{width:5.5em;flex:none}
.bar{flex:1;height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--qing)}
.bar i.bad{background:var(--zhu)}.bar i.warn{background:var(--ochre)}.bar i.good{background:var(--good)}
.grp .gw{color:var(--mute);white-space:nowrap;min-width:3em}

/* 正文 */
.scene{font-family:var(--f-read);font-size:17px;line-height:2;white-space:pre-wrap;max-width:68ch}
.scene[contenteditable="true"]{outline:2px dashed var(--ochre);padding:6px;border-radius:6px}
.story{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px 20px}
.story .when{font-size:13px;color:var(--qing);margin-bottom:6px;font-family:var(--f-read)}
.echo{font-size:13px;background:var(--qing-soft);color:var(--ink2);border-radius:8px;padding:6px 10px;margin-bottom:10px;white-space:pre-wrap}
.storyacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.thinking{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:14px}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--qing);animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.caret::after{content:"▍";color:var(--qing);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.dots i,.caret::after{animation:none}}
details.past{margin-top:10px}
details.past summary{cursor:pointer;color:var(--mute);font-size:13px}
.pastitem{border-top:1px dotted var(--rule);padding:8px 0}
.pastitem .when{font-size:12px;color:var(--mute)}
.pastitem .scene{font-size:15px;line-height:1.85}

/* 结算 */
.res{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}
.res > div{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;min-width:0;font-size:14px}
.res .rh{font-family:var(--f-read);font-weight:700;color:var(--qing);letter-spacing:.1em}
.res .rh span{display:block;font-family:var(--f-ui);font-weight:400;font-size:11px;color:var(--mute);letter-spacing:0}
.rep{margin:6px 0;white-space:pre-wrap;font-family:var(--f-read)}.rep b{display:block;font-family:var(--f-ui);font-size:12px;color:var(--ink2)}
.acc{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0}.acc .from{color:var(--mute)}
.acc em{grid-column:1/-1;font-style:normal;font-size:12px;color:var(--mute);border-bottom:1px dotted var(--rule);padding-bottom:4px}
.rum{margin:6px 0;padding-left:10px;border-left:2px solid var(--rule);color:var(--ink2)}
.closed{background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 30%,transparent);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px}
.closed div+div{margin-top:4px}

/* 事务卡 */
.matter{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.matter.new{border-color:var(--ochre)}
.mtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mtop .mt{font-family:var(--f-read);font-weight:700;font-size:16px}
.mtop .mf{font-size:12px;color:var(--mute);margin-left:auto}
.badge{font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.b-todo{color:var(--ochre);background:var(--ochre-soft)}.b-doing{color:var(--qing);background:var(--qing-soft)}
.b-bad{color:var(--zhu);background:var(--zhu-soft)}.b-done{color:var(--good);background:var(--good-soft)}
.mtext{font-family:var(--f-read);margin:6px 0;white-space:pre-wrap;color:var(--ink2)}
.mprog{font-size:13px;color:var(--qing)}.mdl{font-size:13px;color:var(--zhu)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:10px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--paper);line-height:1.55;padding:8px 10px}
.opt .ot{font-size:14px}
.opt .om{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--mute);align-items:center}
.opt.picked{border-color:var(--qing);background:var(--qing-soft)}
.risk{font-size:11px;border:1px solid var(--rule);border-radius:3px;padding:0 5px;color:var(--ochre)}
.risk.稳{color:var(--good)}.risk.难{color:var(--zhu)}
.mmore{display:flex;gap:10px;margin-top:6px}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 0}

/* 决定栏 */
.compose{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin-top:18px}
.tray{display:grid;gap:4px;margin-bottom:8px}
.tray .ti{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;background:var(--qing-soft);border-radius:8px;padding:5px 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.row select{width:auto}
.row .grow{flex:1}

/* 侧栏：人物 */
.pcs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pc{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--paper);min-width:0}
.pc .pn{display:flex;justify-content:space-between;gap:6px;align-items:center}
.pc .pn b{font-family:var(--f-read);font-size:15px}
.att{font-size:11px;border:1px solid var(--rule);border-radius:10px;padding:0 6px;color:var(--qing);white-space:nowrap}
.pc .pr{color:var(--mute);font-size:12px}
.pc .pl span{color:var(--mute);margin-right:4px}
.ans{border-top:1px solid var(--rule);padding:8px 0}
.ans .q{font-size:12px;color:var(--qing)}
.ans .a{font-family:var(--f-read);white-space:pre-wrap;margin:4px 0}
.sug{display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:space-between;align-items:center;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:5px 8px;margin:4px 0;font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--mute)}.kv dd{margin:0}
.chron{font-size:13px}.chron div{border-bottom:1px dotted var(--rule);padding:6px 0}
.chron b{color:var(--qing);font-weight:500;margin-right:6px}

.banner{background:var(--ochre-soft);border:1px solid var(--ochre);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:14px}
.err{background:var(--zhu-soft);border:1px solid var(--zhu);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:14px}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}

@media (max-width: 900px){
  .game{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none}
  .res{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 520px){
  .pcs{grid-template-columns:minmax(0,1fr)}
  .ask1{flex-direction:column}.ask1 button{padding:10px}
  .hero h1{font-size:32px}
  .mtop .mf{margin-left:0;width:100%}
  .h{flex-wrap:wrap}.h .note{flex-basis:100%;margin-left:34px}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">历史模拟<small>网页版</small></div>
    <div class="sp"></div>
    <div class="top-acts">
      <button id="bHome" hidden>换一局</button>
    </div>
  </header>
  <div id="notice"></div>
  <main id="app"></main>
</div>

<script type="application/json" id="cal">__CAL__</script>
<script>
'use strict';
/* ========== 小工具 ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cut = (s, n) => { const t = String(s ?? '').replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n) + '……' : t; };
const arr = v => (Array.isArray(v) ? v : []);
const clone = o => JSON.parse(JSON.stringify(o));
const lsGet = k => { try { return localStorage.getItem(k); } catch (_) { return null; } };
const lsSet = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (_) { /* 无存储 */ } };

/* ========== 真实农历（月表：公元前221年—1912年，天文推算） ========== */
const CAL = (() => {
  let months = [], first = new Map();
  try {
    for (const [y, lens, leapPos] of JSON.parse($('#cal').textContent)) {
      first.set(y, months.length); let num = 0;
      for (let i = 0; i < lens.length; i++) { const leap = i === leapPos; if (!leap) num++; months.push({ y, m: num, leap, days: lens[i] === '1' ? 30 : 29 }); }
    }
  } catch (_) { months = []; }
  const toA = y => (y < 0 ? y + 1 : y), fromA = y => (y <= 0 ? y - 1 : y);
  function idx(y, m, leap) {
    const f = first.get(toA(y)); if (f == null) return -1;
    for (let i = f; i < months.length && months[i].y === toA(y); i++) if (months[i].m === m && months[i].leap === !!leap) return i;
    return leap ? idx(y, m, false) : -1;
  }
  function addDays(c, n) {
    let { y, m, d } = c; let i = idx(y, m, c.leap);
    if (i < 0) { d += n; while (d > 30) { d -= 30; m++; if (m > 12) { m = 1; y++; if (y === 0) y = 1; } } return { y, m, d, leap: false }; }
    d = Math.min(d, months[i].days) + n;
    while (d > months[i].days) { d -= months[i].days; i++; if (i >= months.length) return { y: fromA(months[i - 1].y) + 1, m: 1, d: 1, leap: false }; }
    return { y: fromA(months[i].y), m: months[i].m, d, leap: months[i].leap };
  }
  const MC = ['', '正月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '腊月'];
  const N = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
  const dayName = d => (d <= 10 ? '初' + N[d] : d < 20 ? '十' + N[d - 10] : d === 20 ? '二十' : d < 30 ? '廿' + N[d - 20] : '三十');
  const label = (m, d, leap) => (leap ? '闰' : '') + (MC[m] || m + '月') + (d ? dayName(d) : '');
  return { addDays, label };
})();
const yearText = y => (y < 0 ? '公元前' + -y + '年' : '公元' + y + '年');
const timeText = c => `${c.yearLabel || ''}（${yearText(c.y)}）${CAL.label(c.m, c.d, c.leap)}`;
const season = m => '春春春夏夏夏秋秋秋冬冬冬'[(m - 1) % 12] || '';

/* ========== 写作规则（与桌面版 rpg-kernel/core/lean.js 同一套） ========== */
const LEN = { short: '约 300～500 字', normal: '约 500～1000 字', long: '约 1000～1600 字' };
const POLICY = {
  emperor: '开仓赈济（耗粮，当即止流亡、民心回升）；兴修水利（耗钱、徭役扰民，一年后增产）；整饬吏治（遣使巡察，民心回升但开罪一批官员）；加征（立得钱粮，民怨随之）；裁汰冗员；大阅练兵（耗钱，士气练度升）',
  warlord: '募兵（耗钱，下月成军，户口与民心降）；屯田（数月后粮增）；修缮城防（耗钱，数月后城防加一等）；积储军粮；遣使结好或离间；大阅练兵',
  official: '开仓赈济（须报上司，擅开有罪）；劝农兴修（征民夫，秋后见效）；清丈田亩、追比欠赋（开罪乡绅）；整顿胥吏；捐俸或摊派；申详上司、打点疏通',
  noble: '置田买宅；结交权要（花钱送礼）；荐举门客；整顿家仆庄户；上书言事',
  commoner: '借贷或典当；买卖田产货物；托人情、送礼；告官具状；投靠大户；外出谋生',
};
const METER_SPEC = {
  emperor: ['国库（钱、粮）、内帑、民心、吏治、威望、军心', '按朝代取：朝官各派、宗室、宦官或外戚、军队、农户、工商'],
  warlord: ['府库、兵额实数、粮饷可支几月、地盘、部将忠心、名分', '部将、士人、百姓、邻近势力'],
  official: ['官库钱粮、上官考语、民望、胥吏掌控、私财、清名', '上司、乡绅、胥吏、小民'],
  noble: ['家资（钱、粮、田）、食邑或俸禄、朝中关系、宗族地位、名声、身体', '宗族长辈、朝中权要、门客家仆、封地百姓'],

function rules(len) {

一、主角归玩家
1. 主角只做玩家写明或选定的事；不写主角的心思、决定和玩家没写的动作，不替他说他没说的话。
2. 玩家想做什么都可以做：违法、越权、悖逆、行险，游戏都不拦，也不说教。成败与后果按真实情形推演——有没有人知道、谁知道、他们的利害与胆量、主角手里的权势与把柄、此时此地的吏治与风气。很多事做了没人追究，有的过了很久才翻出来，有的当场败露；不要让坏事必遭报应，也不要让好事必有好报。

二、执行与回报

11. 每份来报给两到三个可选的办法（options）：写成主角可以直接下的令，各有代价与隐患，标上把握（稳 / 有把握 / 五五 / 难）和建议交给谁办。办法要彼此真不同，至少一条是常人不太会选的硬招或偏招。
12. actions 另给三到五件此刻随手能做的事（问某人、去某处、查某账、见某人），一句话一件。
13. 来报只写合乎本地、本身份尺度的事；朝廷大政、战事、改元、大灾只能来自真实史事，按身份与路程迟到、可能走样（皇帝当场，京官邸报，地方官一两月后看邸报或上司札子，平民几个月后听传闻）。不把无关的史事、真人硬扯到主角身边；不编史书没有的大事、密谋、离奇巧合。

四、时间
14. 这一步要多久就过多久，elapsedDays 填实际天数（当场办完填 0，最多 180）。时间过去了，先把这段时间里实际发生的事交代清楚：差事办得怎样、钱粮进出、家里与差事上的变化、传来的真实消息；不要「转眼」「数日后」一笔带过。过完这些天后的年号纪年填在 yearLabel（如「万历二十八年」）。

19. 正文${LEN[len] || LEN.normal}（来报与回报另算）。称主角为「你」。

let SAMPLE = null, DB = null, UID = null, READY = false;
const LOCAL_INDEX = 'hrpg:index';
const store = {
  async list() {
    const out = [];
    let idx = []; try { idx = JSON.parse(lsGet(LOCAL_INDEX) || '[]'); } catch (_) { idx = []; }
    for (const x of idx) out.push({ ...x, where: 'local' });
    if (DB && UID) {
      try {
        const q = await DB.collection('data/users/' + UID).get();
        for (const d of q.docs) if (d.exists) { const v = d.data(); out.push({ id: d.id, title: v.title, sub: v.sub, updatedAt: v.updatedAt, where: 'db' }); }
      } catch (_) { /* 读不到就只列本机的 */ }
    }
    return out.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  },
  async load(id, where) {
    if (where === 'db' && DB && UID) { const s = await DB.collection('data/users/' + UID).doc(id).get(); return s.exists ? clone(s.data()) : null; }
    try { return JSON.parse(lsGet('hrpg:save:' + id) || 'null'); } catch (_) { return null; }
  },
  async save(s) {
    s.updatedAt = Date.now();
    s.sub = `${s.clock.yearLabel || ''} · ${s.place.full || ''} · 第${s.turn}回合`;
    shrink(s);
    if (DB && UID && s.where !== 'local') {
      try { await DB.collection('data/users/' + UID).doc(s.id).set(clone(s)); s.where = 'db'; return; }
      catch (e) { if (e && e.code === 'invalid_argument') s.where = 'local'; else throw e; }
    }
    s.where = 'local';
    lsSet('hrpg:save:' + s.id, JSON.stringify(s));
    let idx = []; try { idx = JSON.parse(lsGet(LOCAL_INDEX) || '[]'); } catch (_) { idx = []; }
    idx = idx.filter(x => x.id !== s.id); idx.push({ id: s.id, title: s.title, sub: s.sub, updatedAt: s.updatedAt });
    lsSet(LOCAL_INDEX, JSON.stringify(idx));
  },
  async del(id, where) {
    if (where === 'db' && DB && UID) await DB.collection('data/users/' + UID).doc(id).delete();
    lsSet('hrpg:save:' + id, null);
    let idx = []; try { idx = JSON.parse(lsGet(LOCAL_INDEX) || '[]'); } catch (_) { idx = []; }
    lsSet(LOCAL_INDEX, JSON.stringify(idx.filter(x => x.id !== id)));
  },
};
/** 一个存档最多 256KB：老回合只留摘要，撤销用的上一版也一样瘦身 */
function shrink(s) {
  const slim = x => { if (!x || !x.log) return; x.log.forEach((l, i) => { if (i < x.log.length - 12) l.scene = ''; }); if (x.log.length > 300) x.log = x.log.slice(-300); };
  slim(s); if (s.prev) { slim(s.prev); delete s.prev.prev; }
  while (JSON.stringify(s).length > 230000 && s.log.some(l => l.scene)) { const l = s.log.find(x => x.scene); l.scene = ''; if (s.prev) s.prev = null; }
}

function parseJSON(text) {
  let t = String(text || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b <= a) return null;
  try { return JSON.parse(t.slice(a, b + 1)); } catch (_) {
    try { return JSON.parse(t.slice(a, b + 1).replace(/,\s*([}\]])/g, '$1')); } catch (__) { return null; }
  }
}
/** 流式时先把 scene 读出来显示 */
function partialScene(text) {
  const m = /"scene"\s*:\s*"/.exec(text || ''); if (!m) return '';
  let out = '', i = m.index + m[0].length;
  for (; i < text.length; i++) {
    const c = text[i];
    if (c === '\\') {
      const n = text[i + 1]; if (n == null) break;
      if (n === 'u') { const h = text.slice(i + 2, i + 6); if (h.length < 4) break; out += String.fromCharCode(parseInt(h, 16) || 32); i += 5; continue; }
      out += n === 'n' ? '\n' : n === 't' ? '\t' : n; i++; continue;
    }
    if (c === '"') break;
    out += c;
  }
  return out;
}
async function callClaude(prompt, onScene) {
  if (!SAMPLE) throw { code: 'no_sample', message: '这个页面要在 claude.ai 里打开才能调 AI' };
  CTL = new AbortController();
  const r = await SAMPLE(prompt, { signal: CTL.signal, cache: false, modelTier: SETTINGS.tier, onText: onScene ? ({ text }) => onScene(partialScene(text)) : undefined });
  return r;
}

/* ========== 拼提示 ========== */
const CLOSED = /了结|办妥|办砸|作罢|告终|结案|失败|完结/;
function blocks(s) {
  const p = s.protagonist, c = s.clock, L = [];
  L.push(`【此刻】${timeText(c)}，${season(c.m)}。地点：${s.place.full}（${s.place.polity || ''}）。`);
  const st = Object.entries(s.status || {}).map(([k, v]) => `${k}：${v}`).join('；');
  L.push(`【主角档案（以此为准，不改不补）】${p.name}，${p.gender || ''}，${p.age != null ? p.age + '岁' : '年岁不详'}，${p.role}${p.nativePlace ? '，' + p.nativePlace + '人' : ''}${p.real ? '，史载真人' : '，虚构人物'}。${st ? '名位与家业：' + st + '。' : ''}`);
  if (arr(s.household).length) L.push('【家人】' + s.household.map(m => `${m.relation} ${m.name}${m.age != null ? '（' + m.age + '岁）' : ''}${m.note ? '，' + m.note : ''}`).join('；'));
  const ms = Object.entries(s.meters || {}), gs = Object.entries(s.groups || {});
  if (ms.length) L.push('【数值条（以此为准；有变化的在 meters / groups 里申报新值与原因）】\n' + ms.map(([k, v]) => `· ${k}：${v.value}`).join('\n') + (gs.length ? '\n人群：' + gs.map(([k, v]) => `${k} ${v.value}`).join('；') : ''));
  const open = arr(s.matters).filter(m => !CLOSED.test(m.status));
  if (open.length) L.push('【事务账：还没了结的事（每件都要在 matters 里报进展）】\n' + open.map(m => `· 「${m.title}」第${m.opened}回合来自${m.from}（${m.form}）：${cut(m.text, 120)}${m.deadline ? '　期限：' + m.deadline : ''}　现状：${m.status}${m.progress ? '，' + m.progress : ''}`).join('\n'));
  const P = Object.entries(s.people || {}).sort((a, b) => (b[1].seen || 0) - (a[1].seen || 0)).slice(0, 14);
  if (P.length) L.push('【人物近况】\n' + P.map(([k, v]) => `· ${k}：${v.role || ''}${v.tie ? '，' + v.tie : ''}${v.attitude ? '，对主角' + v.attitude : ''}${v.want ? '，想要' + v.want : ''}${v.status ? '，近况：' + v.status : ''}`).join('\n'));
  const od = arr(s.orders).filter(o => /在办|待办|推迟/.test(o.status));
  if (od.length) L.push('【差事：交代下去还没办完的（到时必须写结果）】\n' + od.map(o => `· 第${o.turn}回合交代 ${o.who}：${o.what}（${o.status}${o.result ? '，' + o.result : ''}）`).join('\n'));
  const cs = arr(s.consults).filter(x => !x.used);
  if (cs.length) L.push('【这一步之前主角问过的人（他们记得主角听没听）】\n' + cs.map(x => `· 问${x.who}：「${cut(x.q, 50)}」他答：${cut(x.reply, 100)}`).join('\n'));
  if (arr(s.gmNotes).length) L.push('【仅 GM 知道（玩家看不到；按真实情形决定何时浮出，也可能不了了之）】\n' + s.gmNotes.map(n => `· 第${n.turn}回合：${n.text}`).join('\n'));
  if (arr(s.history).length) L.push('【本局已被改写的历史（以此为准，不再照史书发生）】\n' + s.history.map(h => `· ${h.event} → ${h.now}（因${h.cause}）`).join('\n'));
  const sums = arr(s.log).filter(l => l.summary).slice(-40);
  if (sums.length) L.push('【前情提要】\n' + sums.map(l => `第${l.turn}回合（${l.time}）：${l.summary}`).join('\n'));
  const lastScenes = arr(s.log).filter(l => l.scene).slice(-2);
  if (lastScenes.length) L.push('【前两回合原文（衔接用，不要重复）】\n' + lastScenes.map(l => `第${l.turn}回合：${cut(l.scene, 900)}`).join('\n'));
  L.push(`【本身份的常法（出办法时可参照，代价与见效时间要真实；玩家也可以不按常法来）】${POLICY[s.idm] || POLICY.commoner}`);
  return L.join('\n\n');
}

function askPrompt(s, who, q) {

  const past = arr(s.consults).filter(c => c.who === who).slice(-3).map(c => `第${c.turn}回合问过他「${cut(c.q, 30)}」`);
  return `你扮演一个历史人物，回答主角的问话。只输出一个 JSON 对象，不加代码块：{"reply":"他的回答","suggestions":[{"text":"他出的一条主意，具体到谁去办、怎么办","risk":"稳/有把握/五五/难"}],"memo":"他心里没说出口的打算"}
要求：用这个人的身份、性格、说话方式回答，合乎本朝本年；他只知道他这个身份能知道的事。他有立场和私心：对他自己有利的地方不明说，也可能说谎、夸大、隐瞒，但不荒唐。回答直截了当，三到六句；主意一到三条，各有隐患。主角想做的事哪怕违法越权，他也按自己的利害和胆量回应：可能帮着出主意、可能劝阻、可能借机要好处、可能转身去告发。不出现现代词语。

${mem.length || past.length ? '【他与主角打过的交道】\n' + mem.concat(past).join('\n') : ''}

【上一回合】${cut((arr(s.log).filter(l => l.scene).slice(-1)[0] || {}).scene, 500)}

function polishPrompt(s, text) {

/* ========== 记账 ========== */
function applyTurn(s, d, input) {
  const turn = s.turn + 1;
  const time = CAL.label(s.clock.m, s.clock.d, s.clock.leap);
  s.turn = turn;
  s.log.push({ turn, time: `${s.clock.yearLabel || ''}${time}`, input: input || '', scene: String(d.scene || '').trim(), summary: cut(d.turnSummary || d.scene, 160) });
  // 数值
  const acc = [];
  for (const m of arr(d.meters)) {
    const k = cut(m && (m.项 || m.name), 16), v = cut(m && (m.值 || m.value), 40);
    if (!k || !v) continue;
    const old = (s.meters[k] || {}).value;
    if (old && old !== v) acc.push({ k, from: old, to: v, why: cut(m.因, 60) });
    s.meters[k] = { value: v, delta: old && old !== v ? (m.变 || '') : '', why: old !== v ? cut(m.因, 60) : (s.meters[k] || {}).why || '' };
  }
  for (const k of Object.keys(s.meters)) if (!arr(d.meters).some(m => (m.项 || m.name) === k)) s.meters[k].delta = '';
  for (const g of arr(d.groups)) {
    const k = cut(g && (g.人群 || g.name), 12), v = Math.max(0, Math.min(100, Math.round(Number(g && (g.值 ?? g.value)))));
    if (!k || !Number.isFinite(v)) continue;
    const old = s.groups[k];
    s.groups[k] = { value: v, delta: old ? v - old.value : 0, why: cut(g.因, 60) || (old && old.why) || '' };
  }
  // 事务账
  const justClosed = [];
  const findM = t => s.matters.find(m => m.title === t || (t && m.title && (m.title.includes(t) || t.includes(m.title))));
  for (const u of arr(d.matters)) {
    const m = findM(cut(u && u.title, 16)); if (!m) continue;
    if (u.status) m.status = cut(u.status, 4);
    if (u.progress) m.progress = cut(u.progress, 120);
    if (u.outcome) m.outcome = cut(u.outcome, 220);
    if (CLOSED.test(m.status) && !m.closed) { m.closed = turn; justClosed.push(m.title); }
  }
  const newTitles = [];
  for (const r of arr(d.reports).slice(0, 4)) {
    if (!r || !(r.title || r.text)) continue;
    const rec = { title: cut(r.title, 16), from: cut(r.from, 30), form: cut(r.form, 6), text: cut(r.text, 320), deadline: cut(r.deadline, 50),
      options: arr(r.options).filter(o => o && o.text).slice(0, 4).map(o => ({ text: cut(o.text, 90), who: cut(o.who, 20), risk: cut(o.risk, 4), cost: cut(o.cost, 70) })) };
    const old = findM(rec.title);
    if (old && !CLOSED.test(old.status)) Object.assign(old, rec);
    else { s.matters.push({ ...rec, status: '未办', opened: turn }); newTitles.push(rec.title); }
  }
  const open = s.matters.filter(m => !CLOSED.test(m.status)), closed = s.matters.filter(m => CLOSED.test(m.status)).slice(-15);
  s.matters = s.matters.filter(m => open.includes(m) || closed.includes(m));
  // 人物
  for (const n of [...arr(d.newNpcs), ...arr(d.presentNpcs)]) {
    if (!n || !n.name || n.name === s.protagonist.name) continue;
    const k = cut(n.name, 12), o = s.people[k] || {};
    s.people[k] = { role: cut(n.role || o.role, 40), tie: cut(n.tie || o.tie, 30), attitude: cut(n.attitude || o.attitude, 8), want: cut(n.want || o.want, 60), status: cut(n.status || o.status, 60), seen: turn };
  }
  // 差事
  for (const o of arr(d.orders)) {
    if (!o || !o.who || !o.what) continue;
    const old = s.orders.find(x => x.who === o.who && /在办|待办|推迟/.test(x.status) && (x.what.includes(String(o.what).slice(0, 6)) || String(o.what).includes(x.what.slice(0, 6))));
    if (old) { old.status = cut(o.status || old.status, 4); if (o.result) old.result = cut(o.result, 140); }
    else s.orders.push({ turn, who: cut(o.who, 20), what: cut(o.what, 80), status: cut(o.status || '在办', 4), result: cut(o.result, 140) });
  }
  s.orders = s.orders.slice(-40);
  // 暗线
  for (const t of arr(d.gmNotesDone)) s.gmNotes = s.gmNotes.filter(n => !String(n.text).startsWith(String(t).slice(0, 8)));
  for (const t of arr(d.gmNotes)) if (t) s.gmNotes.push({ turn, text: cut(typeof t === 'string' ? t : JSON.stringify(t), 140) });
  s.gmNotes = s.gmNotes.slice(-15);
  // 名位家业、改写的历史
  for (const c of arr(d.statusChanges)) { const k = cut(c && (c.项 || c.item), 12), v = cut(c && (c.后 || c.to), 60); if (k && v) { s.status[k] = v; s.statusLog.push({ turn, k, v, why: cut(c.原因, 60) }); } }
  s.statusLog = s.statusLog.slice(-40);
  for (const h of arr(d.historyChanges)) if (h && h.event && h.now) s.history.push({ turn, event: cut(h.event, 60), now: cut(h.now, 80), cause: cut(h.cause, 60) });
  for (const c of s.consults) c.used = true;
  // 时间
  const days = Math.max(0, Math.min(180, Math.round(Number(d.elapsedDays) || 0)));
  if (days) {
    const nd = CAL.addDays(s.clock, days);
    const years = Math.max(0, nd.y - s.clock.y);
    Object.assign(s.clock, nd);
    if (years && s.protagonist.age != null) s.protagonist.age += years;
    if (years) for (const m of s.household) if (m.age != null) m.age += years;
  }
  if (d.yearLabel) s.clock.yearLabel = cut(d.yearLabel, 16);
  const st = d.settlement && typeof d.settlement === 'object' ? d.settlement : {};
  s.last = {
    days, acc, justClosed, newTitles,
    reps: arr(st.回报).map(x => (typeof x === 'string' ? { who: '', text: x } : x)).filter(x => x && x.text).map(x => ({ who: cut(x.who, 20), text: cut(x.text, 400) })),
    rums: arr(st.风声).map(x => cut(x, 120)).filter(Boolean).slice(0, 4),
    actions: arr(d.actions).map(a => cut(typeof a === 'string' ? a : (a && a.text), 40)).filter(Boolean).slice(0, 6),
  };
}
function newSave(setup) {

  return {

      <div class="mtop"><span class="badge ${(L.newTitles || []).includes(m.title) ? 'b-todo' : badgeCls(m.status)}">${(L.newTitles || []).includes(m.title) ? '新到' : esc(m.status)}</span><span class="mt">${esc(m.title)}</span><span class="mf">${esc(m.form)} · ${esc(m.from)}</span></div>
      <div class="mtext">${esc(m.text)}</div>
      ${m.progress ? `<div class="mprog">进展：${esc(m.progress)}</div>` : ''}${m.deadline ? `<div class="mdl">期限：${esc(m.deadline)}</div>` : ''}
      <div class="opts">${arr(m.options).map(o => `<button class="opt ${TRAY.some(t => t.text === o.text) ? 'picked' : ''}" data-opt="${enc({ text: o.text, who: o.who })}" ${BUSY ? 'disabled' : ''}><span class="ot">${esc(o.text)}</span><span class="om">${o.risk ? `<span class="risk ${esc(o.risk)}">${esc(o.risk)}</span>` : ''}${o.who ? '交' + esc(o.who) : ''}${o.cost ? ' · ' + esc(o.cost) : ''}</span></button>`).join('')}</div>
      <div class="mmore">${nameOf(m.from) ? `<button class="link" data-askwho="${esc(nameOf(m.from))}" data-askq="${esc('「' + m.title + '」这件事，到底是怎么回事？')}">问问${esc(nameOf(m.from))}</button>` : ''}<button class="link" data-act="${esc('「' + m.title + '」先放着不管')}">先放着</button></div>
    </article>`).join('') : '<div class="muted">眼下没有压着的事。</div>'}
  ${arr(L.actions).length ? `<div class="acts"><span class="muted">随手能做：</span>${L.actions.map(a => `<button class="chip" data-act="${esc(a)}" ${BUSY ? 'disabled' : ''}>${esc(a)}</button>`).join('')}</div>` : ''}`;

  const compose = `<section class="compose" id="compose">
    <div class="h" style="margin-top:0"><span class="seal">决</span>这一回合的决定</div>
    <div class="tray">${TRAY.length ? TRAY.map((t, i) => `<div class="ti"><span>${esc(t.text)}${t.who ? `<span class="muted">（交${esc(t.who)}去办）</span>` : ''}</span><button class="link" data-untray="${i}" aria-label="去掉">去掉</button></div>`).join('') : '<div class="muted">还没选。点上面的办法，或在下面自己写；什么都不选直接过＝这段日子不下令。</div>'}</div>
    <textarea id="freeText" rows="2" placeholder="自己写几句：要做什么、找谁、怎么办。违法越权的也行。"></textarea>
    <div class="row">
      <label class="muted" for="assignee">交给</label>
      <select id="assignee"><option value="">（按身份默认）</option>${ppl.map(n => `<option>${esc(n)}</option>`).join('')}</select>
      <button id="bPolish" ${BUSY ? 'disabled' : ''}>润色成文书</button>
      <span class="grow"></span>
      <button class="main" id="bTurn" ${BUSY || !SAMPLE ? 'disabled' : ''}>过这一回合</button>
    </div>
  </section>`;

  const side = `<aside class="side">
    <div class="tabs">${[['people', '人物'], ['me', '我的状态'], ['chron', '档案'], ['set', '设置']].map(([k, n]) => `<button data-tab="${k}" class="${TAB === k ? 'on' : ''}">${n}</button>`).join('')}</div>
    ${TAB === 'people' ? sidePeople(ppl) : TAB === 'me' ? sideMe() : TAB === 'chron' ? sideChron() : sideSet()}
  </aside>`;

  const keepFree = $('#freeText') ? $('#freeText').value : '';
  const keepAsk = $('#askQ') ? $('#askQ').value : '';
  const keepWho = $('#askWho') ? $('#askWho').value : '';
  $('#app').innerHTML = `<div class="game"><div class="mainc">${board}${story}${res}${matters}${compose}</div>${side}</div>`;
  if ($('#freeText')) $('#freeText').value = keepFree;
  if ($('#askQ')) $('#askQ').value = keepAsk;
  if ($('#askWho') && keepWho) $('#askWho').value = keepWho;
}
function sidePeople(ppl) {
  const P = S.people;
  const fam = S.household.filter(m => !P[m.name]);
  const cards = Object.entries(P).sort((a, b) => (b[1].seen || 0) - (a[1].seen || 0)).map(([k, v]) => `<div class="pc"><div class="pn"><b>${esc(k)}</b>${v.attitude ? `<span class="att">${esc(v.attitude)}</span>` : ''}</div>
      <div class="pr">${esc(v.role)}${v.tie && v.tie !== v.role ? ' · ' + esc(v.tie) : ''}</div>${v.want ? `<div class="pl"><span>想要</span>${esc(v.want)}</div>` : ''}${v.status ? `<div class="pl"><span>近况</span>${esc(v.status)}</div>` : ''}
      <button class="link" data-askwho="${esc(k)}">找来问</button></div>`)
    .concat(fam.map(m => `<div class="pc"><div class="pn"><b>${esc(m.name)}</b></div><div class="pr">${esc(m.relation)}${m.age != null ? ' · ' + m.age + '岁' : ''}</div>${m.note ? `<div class="pl">${esc(m.note)}</div>` : ''}<button class="link" data-askwho="${esc(m.name)}">找来问</button></div>`));
  const cs = arr(S.consults).slice(-6).reverse();
  return `<div class="h" style="margin-top:4px"><span class="seal">人</span>身边的人<span class="note">问人不花时间</span></div>
    <div class="pcs">${cards.join('') || '<div class="muted">开场后，出场的人会列在这里。</div>'}</div>
    <div class="h"><span class="seal">问</span>问人</div>
    <select id="askWho"><option value="">— 问谁 —</option>${ppl.map(n => `<option>${esc(n)}</option>`).join('')}</select>
    <textarea id="askQ" rows="2" style="margin-top:6px" placeholder="问什么？留空就问「眼下这件事你怎么看、该怎么办」"></textarea>
    <div class="row"><button class="main" id="bAsk" ${ASKING || BUSY || !SAMPLE ? 'disabled' : ''}>${ASKING ? '他在想……' : '问'}</button></div>
    ${cs.map(x => `<div class="ans"><div class="q">问 ${esc(x.who)}：${esc(x.q)}</div><div class="a">${esc(x.reply)}</div>${arr(x.suggestions).map(g => `<div class="sug"><span>${esc(g.text)}${g.risk ? ` <span class="risk ${esc(g.risk)}">${esc(g.risk)}</span>` : ''}</span><span><button class="link" data-opt="${encodeURIComponent(JSON.stringify({ text: g.text, who: '' }))}">加入决定</button><button class="link" data-keep="${encodeURIComponent(JSON.stringify({ who: x.who, text: g.text, risk: g.risk }))}">收进建议簿</button></span></div>`).join('')}</div>`).join('')}
    <div class="h"><span class="seal">簿</span>建议簿</div>
    ${arr(S.advice).length ? S.advice.map((a, i) => `<div class="sug"><span><b>${esc(a.who)}</b>：${esc(a.text)}</span><span><button class="link" data-opt="${encodeURIComponent(JSON.stringify({ text: a.text, who: '' }))}">加入决定</button><button class="link" data-unadvice="${i}">删</button></span></div>`).join('') : '<div class="muted">问人得来的好主意，点「收进建议簿」记在这里。</div>'}`;
}
function sideMe() {
  const p = S.protagonist;
  const kv = [['姓名', p.name], ['性别', p.gender], ['年岁', p.age != null ? p.age + ' 岁' : '不详'], ['身份', p.role], ['籍贯', p.nativePlace], ['出身', p.real ? '史载真人' : '虚构人物'], ['所在', S.place.full], ['时间', timeText(S.clock)]]
    .concat(Object.entries(S.status)).filter(([, v]) => v);
  const od = arr(S.orders).slice().reverse().slice(0, 14);
  return `<div class="h" style="margin-top:4px"><span class="seal">我</span>我的状态</div>
    <dl class="kv">${kv.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    ${S.household.length ? `<div class="h"><span class="seal">家</span>家人</div><dl class="kv">${S.household.map(m => `<dt>${esc(m.relation)}</dt><dd>${esc(m.name)}${m.age != null ? '，' + m.age + '岁' : ''}${m.note ? '，' + esc(m.note) : ''}</dd>`).join('')}</dl>` : ''}
    <div class="h"><span class="seal">差</span>交代下去的事</div>
    ${od.length ? `<dl class="kv">${od.map(o => `<dt><span class="badge ${badgeCls(o.status)}">${esc(o.status)}</span></dt><dd>${esc(o.who)}：${esc(o.what)}${o.result ? ' —— ' + esc(o.result) : ''}</dd>`).join('')}</dl>` : '<div class="muted">还没有交代过差事。</div>'}
    ${arr(S.statusLog).length ? `<div class="h"><span class="seal">变</span>近来变化</div><div class="chron">${S.statusLog.slice(-10).reverse().map(x => `<div><b>第${x.turn}回合</b>${esc(x.k)}：${esc(x.v)}${x.why ? '（' + esc(x.why) + '）' : ''}</div>`).join('')}</div>` : ''}`;
}
function sideChron() {
  const done = S.matters.filter(m => CLOSED.test(m.status)).slice().reverse();
  return `<div class="h" style="margin-top:4px"><span class="seal">史</span>这一局的经过</div>
    <div class="chron">${S.log.slice().reverse().map(l => `<div><b>第${l.turn}回合 · ${esc(l.time)}</b>${esc(l.summary)}</div>`).join('') || '<div class="muted">还没开始。</div>'}</div>
    <div class="h"><span class="seal">结</span>了结的事</div>
    <div class="chron">${done.map(m => `<div><span class="badge ${badgeCls(m.status)}">${esc(m.status)}</span> <b style="color:var(--ink)">${esc(m.title)}</b>${esc(m.outcome || m.progress || '')}</div>`).join('') || '<div class="muted">还没有。</div>'}</div>
    ${arr(S.history).length ? `<div class="h"><span class="seal">改</span>被你改写的历史</div><div class="chron">${S.history.map(h => `<div><b>第${h.turn}回合</b>${esc(h.event)} → ${esc(h.now)}</div>`).join('')}</div>` : ''}`;
}
function sideSet() {
  return `<div class="h" style="margin-top:4px"><span class="seal">设</span>设置</div>
    <label class="muted" for="sLen">每回合正文多长</label>
    <select id="sLen">${[['short', '短（300～500 字）'], ['normal', '标准（500～1000 字）'], ['long', '长（1000～1600 字）']].map(([k, n]) => `<option value="${k}" ${SETTINGS.len === k ? 'selected' : ''}>${n}</option>`).join('')}</select>
    <label class="muted" for="sTier" style="display:block;margin-top:10px">用哪档 AI</label>
    <select id="sTier">${[['default', '标准（快一些）'], ['complex', '最强（更细，但更慢、更费额度）']].map(([k, n]) => `<option value="${k}" ${SETTINGS.tier === k ? 'selected' : ''}>${n}</option>`).join('')}</select>
    <p class="muted" style="font-size:13px">剧情用你自己的 Claude 账号来写，会占用你的 Claude 使用额度。存档存在你的账号里，只有你看得到。</p>`;
}

/* ========== 动作 ========== */
async function startGame(sentence) {
  sentence = String(sentence || '').trim(); if (!sentence || BUSY) return;
  ERRMSG = ''; STREAM = ''; LAST_ACTION = () => startGame(sentence);
  setBusy(true);
  try {
    const { text } = await callClaude(openingPrompt(sentence), t => { STREAM = t; const el = document.querySelector('.scene.caret'); if (el) el.textContent = t; else render(); });
    const d = parseJSON(text);
    if (!d || !d.scene || !d.setup) throw { code: 'bad_json' };
    const s = newSave(d.setup);
    applyTurn(s, d, '');
    s.turn = 1; s.log[0].turn = 1;
    S = s; await store.save(S); lsSet('hrpg:last', S.id + '|' + S.where);
    VIEW = 'game'; LAST_ACTION = null; TRAY = [];
  } catch (e) { if (!(e && e.code === 'cancelled')) ERRMSG = errText(e); }
  finally { STREAM = ''; setBusy(false); }
}
async function runTurn(input, note) {
  if (BUSY || !S) return;
  ERRMSG = ''; STREAM = ''; LAST_ACTION = () => runTurn(input, note);
  const before = clone(S); before.prev = null;
  setBusy(true);
  try {
    const { text } = await callClaude(turnPrompt(S, input, note), t => { STREAM = t; const el = document.querySelector('.scene.caret'); if (el) el.textContent = t; else render(); });
    const d = parseJSON(text);
    if (!d || !d.scene) throw { code: 'bad_json' };
    applyTurn(S, d, input);
    S.prev = before;
    await store.save(S);
    TRAY = []; LAST_ACTION = null;
    if ($('#freeText')) $('#freeText').value = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) { if (!(e && e.code === 'cancelled')) ERRMSG = errText(e); const keepPrev = S.prev; for (const k of Object.keys(S)) delete S[k]; Object.assign(S, before, { prev: keepPrev }); }
  finally { STREAM = ''; setBusy(false); }
}
function composeInput() {
  const who = $('#assignee') ? $('#assignee').value : '';
  const L = TRAY.map(t => `· ${t.text}${t.who ? `（交${t.who}去办）` : ''}`);
  const free = $('#freeText') ? $('#freeText').value.trim() : '';
  if (free) L.push(free + (who ? `（交${who}去办）` : ''));
  else if (who && L.length) L.push(`（以上没写明的，交${who}去办）`);
  return L.join('\n');
}

document.addEventListener('submit', e => { if (e.target.id === 'fStart') { e.preventDefault(); startGame($('#qText').value); } });
document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  const ds = t.dataset;
  if (ds.ex) { $('#qText').value = ds.ex; return; }
  if (t.id === 'bStop') { CTL && CTL.abort(); return; }
  if (t.id === 'bRetry') { const f = LAST_ACTION; ERRMSG = ''; f && f(); return; }
  if (t.id === 'bHome') { if (BUSY) return; VIEW = 'start'; S = null; ERRMSG = ''; render(); return; }
  if (ds.load) {
    const w = ds.where; const s = await store.load(ds.load, w);
    if (!s) { ERRMSG = '这个存档读不出来了。'; render(); return; }
    s.where = w; S = s; VIEW = 'game'; TRAY = []; ERRMSG = ''; EDITING = false; lsSet('hrpg:last', s.id + '|' + w); render(); return;
  }
  if (ds.askdel) { const sp = document.getElementById('del-' + ds.askdel); sp.innerHTML = `确定删掉？<button data-del="${esc(ds.askdel)}">删掉</button><button data-nodel="${esc(ds.askdel)}">不删</button>`; return; }
  if (ds.nodel) { renderStart(); return; }
  if (ds.del) { const where = JSON.parse($('#saves').dataset.where || '{}')[ds.del]; await store.del(ds.del, where); renderStart(); return; }
  if (ds.tab) { TAB = ds.tab; render(); return; }
  if (ds.opt) { try { const o = JSON.parse(decodeURIComponent(ds.opt)); const i = TRAY.findIndex(x => x.text === o.text); if (i >= 0) TRAY.splice(i, 1); else TRAY.push(o); } catch (_) { /* 无 */ } render(); return; }
  if (ds.act) { if (!TRAY.some(x => x.text === ds.act)) TRAY.push({ text: ds.act, who: '' }); render(); return; }
  if (ds.untray != null) { TRAY.splice(Number(ds.untray), 1); render(); return; }
  if (ds.askwho) { TAB = 'people'; render(); $('#askWho').value = ds.askwho; if (![...$('#askWho').options].some(o => o.value === ds.askwho)) { $('#askWho').insertAdjacentHTML('beforeend', `<option>${esc(ds.askwho)}</option>`); $('#askWho').value = ds.askwho; } $('#askQ').value = ds.askq || ''; $('#askQ').focus(); $('.side').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (ds.keep) { try { const o = JSON.parse(decodeURIComponent(ds.keep)); if (!S.advice.some(a => a.text === o.text)) { S.advice.push(o); await store.save(S); } } catch (_) { /* 无 */ } render(); return; }
  if (ds.unadvice != null) { S.advice.splice(Number(ds.unadvice), 1); await store.save(S); render(); return; }
  if (t.id === 'bTurn') { runTurn(composeInput()); return; }
  if (t.id === 'bEdit') { EDITING = true; render(); const el = $('#sceneText'); el && el.focus(); return; }
  if (t.id === 'bEditCancel') { EDITING = false; render(); return; }
  if (t.id === 'bEditSave') { const el = $('#sceneText'); S.log[S.log.length - 1].scene = el.innerText.trim(); EDITING = false; await store.save(S); render(); return; }
  if (t.id === 'bRegen') {
    $('#regenBox').innerHTML = `<div class="row"><input id="regenNote" class="grow" placeholder="想怎么改？比如：别让他这么快答应 / 写得更细一点（可以不填）"><button class="main" id="bRegenGo">重写</button><button id="bRegenNo">算了</button></div>`;
    $('#regenNote').focus(); return;
  }
  if (t.id === 'bRegenNo') { $('#regenBox').innerHTML = ''; return; }
  if (t.id === 'bRegenGo') {
    if (!S.prev) return;
    const note = $('#regenNote').value.trim(); const input = S.log[S.log.length - 1].input;
    const keepAdvice = S.advice, keepConsults = S.consults.filter(c => !c.used);
    const where = S.where; S = clone(S.prev); S.where = where; S.advice = keepAdvice; S.consults = S.consults.concat(keepConsults.filter(c => !S.consults.some(x => x.at === c.at)));
    if (S.turn === 0) return;
    runTurn(input, note || '换一种写法'); return;
  }
  if (t.id === 'bAsk') {
    const who = $('#askWho').value; if (!who) { $('#askWho').focus(); return; }
    const q = $('#askQ').value.trim() || '眼下这件事你怎么看？该怎么办？';
    ASKING = true; ERRMSG = ''; render();
    try {
      const { text } = await callClaude(askPrompt(S, who, q));
      const j = parseJSON(text) || { reply: text, suggestions: [] };
      S.consults.push({ at: Date.now(), turn: S.turn, who, q, reply: cut(j.reply, 800), suggestions: arr(j.suggestions).filter(x => x && x.text).slice(0, 3).map(x => ({ text: cut(x.text, 160), risk: cut(x.risk, 4) })), memo: cut(j.memo, 200) });
      S.consults = S.consults.slice(-30);
      await store.save(S);
    } catch (err) { if (!(err && err.code === 'cancelled')) ERRMSG = errText(err); }
    finally { ASKING = false; render(); }
    return;
  }
  if (t.id === 'bPolish') {
    const raw = composeInput(); if (!raw) { $('#freeText').focus(); return; }
    t.disabled = true; t.textContent = '润色中…';
    try { const { text } = await callClaude(polishPrompt(S, raw)); TRAY = []; render(); $('#freeText').value = text.trim(); $('#freeText').rows = 5; }
    catch (err) { if (!(err && err.code === 'cancelled')) { ERRMSG = errText(err); render(); } }
    return;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'sLen') { SETTINGS.len = e.target.value; lsSet('hrpg:settings', JSON.stringify(SETTINGS)); }
  if (e.target.id === 'sTier') { SETTINGS.tier = e.target.value; lsSet('hrpg:settings', JSON.stringify(SETTINGS)); }
});

/* ========== 启动 ========== */
render();
(async () => {
  const c = window.claude;
  if (c && c.use) {
    const [sm, db, user] = await Promise.all([c.use('sample'), c.use('db'), c.use('user')]);
    SAMPLE = sm; DB = db;
    try { UID = user ? await user.id() : null; } catch (_) { UID = null; }
  }
  READY = true;
  // 回到上次在玩的那一局
  const last = lsGet('hrpg:last');
  if (last && VIEW === 'start' && !BUSY) {
    const [id, where] = last.split('|');
    try { const s = await store.load(id, where); if (s) { s.where = where; S = s; VIEW = 'game'; } } catch (_) { /* 读不到就留在首页 */ }
  }
  render();
})();
</script>
