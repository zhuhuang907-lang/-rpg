<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>枢 · 历史模拟</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="seal">枢</span><span id="scnName">历史模拟</span></div>
  <div class="status" id="status"></div>
  <nav class="menu">
    <button data-open="history" class="hidden-start">史事</button>
    <button data-open="log" class="hidden-start">起居注</button>
    <button data-open="calendar" class="hidden-start">历书</button>
    <button data-open="life" class="hidden-start">生涯</button>
    <button data-open="home">存档</button>
    <button data-open="settings">设置</button>
  </nav>
</header>
<div class="statbar" id="statbar"></div>

<!-- 开始页 -->
<main id="home" class="home">
  <section class="home-intro">
    <h1>选一个世界，醒过来</h1>
    <p class="muted">秦到清，任何年份、任何身份。开局时先在游戏里查史，再醒来。</p>
  </section>
  <section class="scn" id="customBox">
    <h2>新开一局</h2>
    <div id="needCfg" class="hintbox hidden"></div>
    <div class="newgrid">
      <button id="btnRandom" class="primary big">随机一个时代和身份</button>
      <span class="muted small">或者自己定：</span>
    </div>
    <div class="form">
      <label>年份<input id="cYear" type="number" placeholder="如 1068；公元前写负数，如 -200"></label>
      <label>朝代<select id="cDyn"><option value="">（按年份自动）</option></select></label>
      <label>地点<input id="cPlace" placeholder="如 杭州钱塘县；可空"></label>
      <label class="wide">身份<input id="cIdn" placeholder="随便写：苏州绣娘、黄巢军中书记、乾隆朝的盐商、唐代长安的胡商……"></label>
      <label>姓名<input id="cName" placeholder="可空，空则虚构一个"></label>
      <label>性别<select id="cGender"><option value="">（不限）</option><option>男</option><option>女</option></select></label>
      <label>年龄<input id="cAge" type="number" placeholder="可空"></label>
      <label class="chk"><input type="checkbox" id="cReal"> 扮演真实历史人物（姓名填真名）</label>
      <label>模式<select id="cMode"><option value="history">依史：大事照史书发生</option><option value="free">推演：你的作为可以改写大事</option></select></label>
    </div>
    <div class="composer-row"><span class="grow"></span><button id="btnCustom" class="primary">查史，然后醒来</button></div>
  </section>
  <section id="scenarios"></section>
  <section>
    <h2>继续</h2>
    <div id="saves" class="saves"></div>
  </section>
</main>

<!-- 游戏页 -->
<main id="play" class="play hidden">
  <aside class="col left" id="colLeft">
    <h3>局势</h3>
    <div id="groups"></div>
    <h3>地方一览</h3>
    <div id="regions"></div>
  </aside>

  <section class="col center">
    <div id="story" class="story"></div>
    <div id="beatBox" class="beatbox hidden"></div>
    <div id="result" class="result hidden"></div>
    <div id="docketWrap" class="hidden">
      <h3 class="deskhead">案头 <span class="muted" id="docketNote"></span></h3>
      <div id="docket" class="docket"></div>
      <div class="composer" id="composer">
        <h3>拿主意</h3>
        <div id="picks" class="picks"></div>
        <textarea id="decision" rows="3" placeholder="用大白话写你打算怎么办。也可以从右边「问人」得到的主意里点「采纳」。"></textarea>
        <div class="composer-row">
          <label>交给 <select id="executor"></select> 去办</label>
          <span class="grow"></span>
          <button id="btnSkip" class="ghost" title="案头只有日常小事时，连着过几回合">无事快进</button>
          <button id="btnPolish" class="ghost">润色</button>
          <button id="btnEnd" class="primary">定下，过这一回合</button>
        </div>
        <div id="polished" class="polished hidden"></div>
      </div>
    </div>
  </section>

  <aside class="col right" id="colRight">
    <h3>问人 <span class="muted" id="consultLeft"></span></h3>
    <div id="people"></div>
    <div id="consultBox" class="consult hidden"></div>
    <h3>建议簿</h3>
    <div id="notebook" class="notebook"><div class="muted small">问过人之后，他们的主意会列在这里。</div></div>
  </aside>
</main>

<nav class="tabs" id="tabs">
  <button data-tab="left">局势</button>
  <button data-tab="center" class="on">案头</button>
  <button data-tab="right">问人</button>
</nav>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-head"><h2 id="modalTitle"></h2><button id="modalClose" class="ghost" aria-label="关闭">✕</button></div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<div id="busy" class="busy hidden"><span id="busyText">……</span></div>
<div id="job" class="modal hidden"><div class="modal-box"><div class="modal-head"><h2>查史</h2></div><div id="jobBody" class="modal-body"></div></div></div>
<script src="/app.js"></script>
</body>
</html>
