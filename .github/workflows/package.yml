# 打包 Windows 版：
#   · HistoryRPG-Setup.exe：安装程序，双击安装，桌面出现「历史模拟RPG」图标（推荐）
#   · HistoryRPG-windows.zip：免安装版，解压后双击「启动游戏.exe」
# 每次推送 rpg-kernel/ 的改动都会重新测试、打包，发布到 Releases 的「latest」。
name: 打包 Windows 版

on:
  push:
    branches: [main, claude/gallant-davinci-l8pni0]
    paths: ['rpg-kernel/**', '.github/workflows/package.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 测试
        working-directory: rpg-kernel
        env:
          # 打包机访问维基常常几分钟不回：测试时断开外网，走「检索不可用」的降级路径
          RPG_OFFLINE: '1'
          TEST_TIMEOUT_MS: '180000'
        run: node test_runner.js

      - name: 组装
        shell: pwsh
        run: |
          $out = "dist\HistoryRPG"
          $app = "$out\app"
          New-Item -ItemType Directory -Force "$app\runtime" | Out-Null
          # 游戏本体放进 app 文件夹（玩家只看到启动程序、说明和一个备用 bat）
          foreach ($p in 'server.js','adapters','core','public','rulepacks','prompts','wordlists','data') {
            Copy-Item "rpg-kernel\$p" "$app\" -Recurse
          }
          Copy-Item "rpg-kernel\一键启动.bat" "$app\start.bat"
          foreach ($p in 'adapter-config.json','search.json','saves','cache','archive','logs','app-window','server.log','launcher.log','saves-deleted','status.json') {
            Remove-Item "$app\data\$p" -Recurse -Force -ErrorAction SilentlyContinue
          }
          # 自带 Node 运行环境
          Copy-Item (Get-Command node).Source "$app\runtime\node.exe"
          # 启动器：Windows 自带的 C# 编译器
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /codepage:65001 /target:winexe `
            /win32icon:rpg-kernel\launcher\game.ico /out:"$out\启动游戏.exe" `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll rpg-kernel\launcher\GameLauncher.cs
          if (-not (Test-Path "$out\启动游戏.exe")) { throw '启动器编译失败' }
          Copy-Item rpg-kernel\launcher\fallback.bat "$out\打不开就双击这个.bat"
          # 版本号：游戏内「一键更新」靠它比较新旧
          $ver = @{ run = [int]$env:GITHUB_RUN_NUMBER; sha = "$env:GITHUB_SHA".Substring(0,7); date = (Get-Date -Format 'yyyy-MM-dd HH:mm') } | ConvertTo-Json -Compress
          [IO.File]::WriteAllText("$PWD\$app\version.json", $ver, (New-Object Text.UTF8Encoding $false))
          # 说明（带 BOM，记事本里中文不乱码）
          $txt = Get-Content rpg-kernel\launcher\README.txt -Raw -Encoding UTF8
          [IO.File]::WriteAllText("$PWD\$out\使用说明.txt", $txt, (New-Object Text.UTF8Encoding $true))

      - name: 冒烟（免安装版）
        shell: pwsh
        run: |
          $app = "dist\HistoryRPG\app"
          $env:PORT = '3199'; $env:SHU_NO_BROWSER = '1'
          $p = Start-Process -FilePath "$app\runtime\node.exe" -ArgumentList 'server.js' -WorkingDirectory "$app" -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) { Start-Sleep 1; try { $ok = (Invoke-RestMethod http://127.0.0.1:3199/api/health).ok } catch {} }
          $qs = $null; try { $qs = Invoke-RestMethod http://127.0.0.1:3199/api/quick-status } catch {}
          $page = $null; try { $page = (Invoke-WebRequest http://127.0.0.1:3199/ -UseBasicParsing).Content } catch {}
          $net = $null; try { $net = Invoke-RestMethod http://127.0.0.1:3199/api/netcheck -TimeoutSec 40 } catch {}
          # 保存 Key 能落盘（用假 Key，只看保存，不看试连结果）
          $save = $null; try { $save = Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"apiKey":"sk-smoketest","bochaKey":"bocha-smoketest"}' http://127.0.0.1:3199/api/quick-key -TimeoutSec 120 } catch {}
          $qs2 = $null; try { $qs2 = Invoke-RestMethod http://127.0.0.1:3199/api/quick-status } catch {}
          taskkill /T /F /PID $p.Id | Out-Null
          if (-not $ok) { throw '打包后的游戏起不来' }
          if (-not $qs.ok) { throw '一句话开局接口不通' }
          if ($page -notmatch 'qText') { throw '首页没有一句话开局输入框' }
          Write-Host ('网络诊断：' + ($net | ConvertTo-Json -Depth 4 -Compress))
          Write-Host ('保存 Key：' + ($save | ConvertTo-Json -Depth 4 -Compress))
          if (-not $qs2.hasKey) { throw '保存 Key 后没有记住' }
          if (-not $qs2.hasBocha) { throw '保存博查 Key 后没有记住' }
          foreach ($x in 'saves','cache','logs','server.log','adapter-config.json','search.json','launcher.log') {
            Remove-Item "$app\data\$x" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "$app\data\adapter-config.json") { throw '测试 Key 没清掉' }
          Compress-Archive -Path dist\HistoryRPG -DestinationPath dist\HistoryRPG-windows.zip

      - name: 安装程序
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw '没装上 Inno Setup' }
          & $iscc "/DSrcDir=$PWD\dist\HistoryRPG" "/DOutDir=$PWD\dist" rpg-kernel\launcher\installer.iss
          if (-not (Test-Path dist\HistoryRPG-Setup.exe)) { throw '安装程序没生成' }
          # 静默装一遍，确认装出来的东西能跑
          $dir = "$env:RUNNER_TEMP\rpg-install"
          Start-Process dist\HistoryRPG-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir" -Wait
          if (-not (Test-Path "$dir\启动游戏.exe")) { throw '安装后没有启动程序' }
          if (-not (Test-Path "$dir\app\runtime\node.exe")) { throw '安装后没有运行环境' }
          $env:PORT = '3198'
          $p = Start-Process -FilePath "$dir\app\runtime\node.exe" -ArgumentList 'server.js' -WorkingDirectory "$dir\app" -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) { Start-Sleep 1; try { $ok = (Invoke-RestMethod http://127.0.0.1:3198/api/health).ok } catch {} }
          taskkill /T /F /PID $p.Id | Out-Null
          if (-not $ok) { throw '安装后的游戏起不来' }
          # 发布页上的版本信息（大小与 SHA-256：游戏内更新下载后逐一核对，镜像被改过就不装）
          $v = Get-Content "dist\HistoryRPG\app\version.json" -Raw | ConvertFrom-Json
          $f = Get-Item dist\HistoryRPG-Setup.exe
          $v | Add-Member setupSize $f.Length
          $v | Add-Member setupSha256 ((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower())
          [IO.File]::WriteAllText("$PWD\dist\version.json", ($v | ConvertTo-Json -Compress), (New-Object Text.UTF8Encoding $false))
          Get-Content dist\version.json

      - uses: actions/upload-artifact@v4
        with:
          name: HistoryRPG-windows
          path: |
            dist/HistoryRPG-Setup.exe
            dist/HistoryRPG-windows.zip
            dist/version.json

      - name: 发布到 Releases（latest）
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          $notes = @"
          ## 点这里直接下载安装程序
          **[HistoryRPG-Setup.exe（GitHub 直连）](https://github.com/zhuhuang907-lang/-rpg/releases/download/latest/HistoryRPG-Setup.exe)**
          国内下载慢就点加速地址（任选一个）：
          [ghfast.top](https://ghfast.top/https://github.com/zhuhuang907-lang/-rpg/releases/download/latest/HistoryRPG-Setup.exe) ·
          [gh-proxy.com](https://gh-proxy.com/https://github.com/zhuhuang907-lang/-rpg/releases/download/latest/HistoryRPG-Setup.exe) ·
          [ghproxy.net](https://ghproxy.net/https://github.com/zhuhuang907-lang/-rpg/releases/download/latest/HistoryRPG-Setup.exe)

          **以后不用再来这里下载**：游戏里有新版本时，顶上会提示，点「一键更新」就自动下载、安装、重新打开。

          ## 怎么装
          1. 下载 **HistoryRPG-Setup.exe**，双击安装（Windows 提示「已保护你的电脑」就点「更多信息」→「仍要运行」）。
          2. 装完双击桌面上的 **历史模拟RPG** 图标。
          3. 页面上粘贴 DeepSeek Key 点「保存」，输入一句话开局。

          免安装版：下载 HistoryRPG-windows.zip → 右键「全部解压缩」→ 双击「启动游戏.exe」。

          提交：${{ github.sha }}
          "@
          gh release create latest dist/HistoryRPG-Setup.exe dist/HistoryRPG-windows.zip dist/version.json --title "历史模拟 RPG · Windows 最新版" --notes $notes --target ${{ github.sha }}
